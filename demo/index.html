function hoursLeft(p) { return PARK_HOURS - Math.floor((Date.now() - p.at) / 3600000); }

function parkedCard(app, p, b) {
  const left = hoursLeft(p);
  const msg = el('p.sub.warn');
  const match = app.parkedMatch(p);
  return el('div.parked', null, [
    el('div.parkedtop', null, [
      el('span.nm', { text: p.label || 'Something' }),
      el('span.amt', { text: app.money(p.amount) })
    ]),
    /* "Ready to decide in 30 hours" against a button promising two days: the
       countdown and the promise were in different units, so the buyer had to
       do the sum. Same wording as the parked list on the Today page. */
    left > 0
      ? el('p.sub', { text: 'Ready to decide ' + readyWhen(p.at) + '.' })
      : el('p.sub', { html: affordLine(app, b, p.amount) }),
    match ? el('p.sub', { style: 'margin-top:9px', text: 'On ' + fmtShort(parseISO(match.date)) +
      ' you logged ' + app.money(match.amount) + ' for ' + match.note + '. Did you buy this one?' }) : null,
    match ? el('div.footrow', null, [
      el('button.btn.primary', { type: 'button', text: 'Yes, take it off the list',
        onclick: () => app.unpark(p.id) }),
      el('button.linky', { type: 'button', text: 'No, keep waiting',
        onclick: () => app.keepWaiting(p.id, match.id) })
    ]) : null,
    /* With the question up there are already two ways off the list, and a third
       button next to them only asks the buyer to tell two removals apart. */
    match || left <= 0 ? null : el('div.footrow', null,
      el('button.linky', { type: 'button', text: 'Let it go', onclick: () => app.unpark(p.id) })),
    left > 0 ? null : msg,
    left > 0 || match ? null : el('div.footrow', null, [
      el('button.btn.primary', { type: 'button', text: 'Buy it', onclick: () => {
        if (app.capped()) { msg.textContent = CONFIG.copy.cappedTitle; return; }
        app.buyParked(p.id);
      } }),
      el('button.linky', { type: 'button', text: 'Let it go', onclick: () => app.unpark(p.id) })
    ])
  ]);
}

/* Routines. The handful of things worth doing on payday, as a list that ticks
   itself clean when the next payday comes round. */
const routinesScreen = {
  id: 'routines',
  label: 'Routines',
  view(app) {
    const s = app.state;
    const t = today();
    const payday = paydayFor(s, addDays(t, 1));
    /* paydayFor always looks forward, so today being a payday never shows up in
       `payday` itself. On the one page that is entirely about payday, say so. */
    /* Only once there is a pay to be paid. The guard checked that the anchor
       parsed, not that anything was earning, and a wiped planner anchors its
       default fortnight at today plus 14, which puts the previous one exactly
       on the day of the wipe. So this page told somebody who had entered
       nothing at all that today was their payday. */
    const payToday = (s.pay || {}).amount > 0 &&
      !isNaN(parseISO((s.pay || {}).anchor)) && +paydayFor(s, t) === +t;
    const payGap = Math.max(1, daysBetween(t, payday));
    const lastPayday = addDays(payday, -payGap);
    const steps = s.routine || [];
    const done = steps.filter(x => x.done).length;

    /* A new pay stretch wipes the ticks, so the list is always about this one. */
    /* Strictly before: the previous payday is the first day of this stretch, so
       a tick made on that day belongs to this one and must survive. */
    if (s.routineDone && parseISO(s.routineDone) < lastPayday && done > 0) {
      app.change(st => {
        st.routine = (st.routine || []).map(x => Object.assign({}, x, { done: false }));
        st.routineDone = null;
      }, { quiet: true });
    }

    const add = field('What to remember', { placeholder: 'Move money into Dentist' });

    return el('div.routines', null, [
      screenTop(app, 'Routines', 'The few things worth doing each payday.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Payday routine'),
            steps.length
              ? el('p.sub', { style: 'margin-top:8px', html: '<b>' + done + ' of ' + steps.length + '</b> ticked off.' })
              : null,
            steps.length
              ? el('div.bar', { style: 'margin-top:11px' },
                  el('i', { style: 'width:' + Math.round(done / steps.length * 100) + '%' }))
              : null,
            steps.length
              ? el('div.rows', { style: 'margin-top:10px' }, steps.map(x => el('div.row.noterow', null, [
                  /* The circle is the control. A separate "Tick it" link beside
                     a thing that looks tickable is one target too many. */
                  el('button.tick' + (x.done ? '.on' : ''), {
                    type: 'button', 'aria-pressed': x.done ? 'true' : 'false',
                    'aria-label': (x.done ? 'Untick: ' : 'Tick off: ') + x.text,
                    text: x.done ? '✓' : '',
                    onclick: () => app.change(st => {
                      st.routine = st.routine.map(y => y.id === x.id ? Object.assign({}, y, { done: !y.done }) : y);
                      st.routineDone = toISO(today());
                    }) }),
                  el('span.nm' + (x.done ? '.doneline' : ''), { text: x.text }),
                  el('button.linky.rowx', { type: 'button', text: 'Remove',
                    onclick: () => app.change(st => { st.routine = st.routine.filter(y => y.id !== x.id); }) })
                ])))
              : el('p.sub', { style: 'margin-top:10px', text: 'No steps yet. Add the things you want to remember when you get paid.' }),
            el('div.form', null, [
              el('div.fgrid', null, add.node),
              el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Add a step', onclick: () => {
                if (!add.value) return;
                app.change(st => { st.routine.push({ id: uid('r'), text: add.value, done: false }); });
              } }))
            ])
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, payToday ? 'Payday' : 'Next payday'),
            payToday ? el('p.sub', { style: 'margin-top:8px', html: '<b>Today is payday.</b> This is the list to run through.' }) : null,
            el('p.sub', { style: 'margin-top:8px', html:
              (payToday ? 'The one after is <b>' : '<b>') + fmtDay(payday) + '</b>, '
              + (payToday ? 'in <b>' : 'which is <b>') + payGap + (payGap === 1 ? ' day' : ' days')
              + '</b>' + (payToday ? '.' : ' away.') })
          ]),
          el('div.card', null, [
            capIcon(null, 'What happens to the ticks'),
            el('p.sub', { style: 'margin-top:8px', text: 'Every step is unticked again on your next payday, so the list is always about the pay period you are in.' }),
            el('p.sub', { style: 'margin-top:8px', text: 'Nothing here is counted or scored. Leaving a step unticked changes nothing else in the planner.' })
          ])
        ])
      ])
    ]);
  }
};

/* Insights. Where it went, day by day, and how this stretch compares with the
   one before it. One series per chart, and every figure is written on. */
const insightsScreen = {
  id: 'insights',
  label: 'Insights',
  view(app) {
    const s = app.state;
    const t = today();
    const b = safeToSpend(s, t);
    /* back = 0 is the stretch you are in; 1 is the one before it, and so on.
       Every boundary is a real payday, walked backwards one at a time: stepping
       back by an average period length drifts on months that are not 30 days. */
    const back = app.back || 0;
    const past = back > 0;
    let end = b.payday;
    let start = b.start;
    for (let i = 0; i < back; i++) { end = start; start = prevPayday(s, start); }
    const prevStart = prevPayday(s, start);
    /* Same floor as Month: one step back past the oldest thing the planner has
       is the last one worth offering. */
    const atOldest = start <= earliestDay(s);
    const periodLen = Math.max(1, daysBetween(start, end));
    /* Dates, not "that one": the label has to stand up on its own, away from
       the date bar at the top of the page. */
    const span = fmtShortY(start) + ' to ' + fmtShortY(addDays(end, -1));
    const prevSpan = fmtShortY(prevStart) + ' to ' + fmtShortY(addDays(start, -1));

    const inRange = (from, to) => s.spends.filter(x => {
      const d = parseISO(x.date);
      return d >= from && d < to;
    });

    const stop = past ? end : addDays(t, 1);
    const thisLot = inRange(start, stop);
    const lastLot = inRange(prevStart, start);
    const thisSum = round2(thisLot.reduce((n, x) => n + x.amount, 0));
    const lastSum = round2(lastLot.reduce((n, x) => n + x.amount, 0));
    /* Nothing logged last time and nothing logged before it either means there
       is no history yet, which reads differently from a quiet pay period. */
    const anyBefore = s.spends.some(x => parseISO(x.date) < start);

    /* Day by day, from the start of this stretch to payday. */
    const days = [];
    for (let i = 0; i < periodLen; i++) {
      const d = addDays(start, i);
      const iso = toISO(d);
      days.push({
        value: round2(s.spends.filter(x => x.date === iso).reduce((n, x) => n + x.amount, 0)),
        highlight: iso === toISO(t),
        /* The ends carry the month: a stretch can cross one, and "3" next to
           "1" tells a reader nothing. */
        short: (i === 0 || i === periodLen - 1) ? fmtShort(d) : String(d.getDate()),
        full: fmtDay(d)
      });
    }
    const dayCount = past ? periodLen : Math.max(1, daysBetween(start, t) + 1);
    const perDay = round2(thisSum / dayCount);

    /* Where it went, by envelope, with anything untagged gathered up. */
    const buckets = {};
    thisLot.forEach(x => {
      const name = x.env ? (s.envelopes.filter(e => e.id === x.env)[0] || {}).name || 'Other' : 'Not in an envelope';
      buckets[name] = round2((buckets[name] || 0) + x.amount);
    });
    const where = Object.keys(buckets).map(k => ({ name: k, value: buckets[k] }))
      .sort((a, c) => c.value - a.value);

    return el('div.insights', null, [
      screenTop(app, 'Insights', 'Where your money went. No judgement.'),
      el('div.card.periodbar', null, [
        el('button.btn', { type: 'button', text: '\u2039', 'aria-label': 'Earlier pay period',
          disabled: atOldest ? true : null,
          title: atOldest ? 'There is nothing in the planner before this pay period' : 'Earlier pay period',
          onclick: () => { app.back = back + 1; app.render(); } }),
        el('div', null, [
          el('div.periodname', { text: back === 0 ? 'This pay period'
              : back === 1 ? 'Last pay period' : back + ' pay periods ago' }),
          el('span.foot', { text: fmtDayY(start) + ' to ' + fmtDayY(addDays(end, -1)) })
        ]),
        el('button.btn', { type: 'button', text: '\u203a', 'aria-label': 'Later pay period',
          disabled: back === 0 ? true : null,
          title: back === 0 ? 'This is the pay period you are in' : 'Later pay period',
          onclick: () => { app.back = Math.max(0, back - 1); app.render(); } })
      ]),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            helpCap('Day by day', past ? 'Each bar is one day of the pay period named above.'
              : 'Each bar is one day since your last payday.' + amberNote(days)),
            el('p.sub', { style: 'margin:8px 0 4px', html:
              'You averaged <b>' + app.money(perDay) + '</b> a day' +
              (past ? ' between ' + span.replace(' to ', ' and ') + '.' : ' so far this pay period.') }),
            dayBars(app, days)
          ]),
          el('div.card', null, [
            helpCap('Where it went', 'Only what you logged. Bills and goal money are not counted here.'),
            el('div', { style: 'margin-top:10px' },
              barList(app, where, { empty: past
                ? 'Nothing was logged between ' + span.replace(' to ', ' and ') + '.'
                : 'Nothing logged since your last payday. Log a spend and it shows up here.' }))
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            helpCap(past ? 'Against the pay period before it' : 'This pay period against the last',
              past ? 'Everything logged in ' + span + ', against everything logged in ' + prevSpan + '.'
                : 'What you have logged since your last payday, against the whole of the pay period '
                  + 'before it. Yours is not over yet, so expect it to be the shorter bar.'),
            el('div', { style: 'margin-top:10px' }, barList(app, [
              { name: past ? span : 'This pay period, so far', value: thisSum },
              { name: prevSpan, value: lastSum, outline: true }
            ], { empty: 'Nothing to compare yet.' })),
            el('p.sub', { style: 'margin-top:11px', text: lastSum === 0
              ? (anyBefore
                  ? 'Nothing was logged in the pay period before, ' + prevSpan + '.'
                  /* No promise about next time: a buyer can log nothing then too. */
                  : 'There is nothing logged before ' + fmtShortY(start) + ' to compare with.')
              : (thisSum <= lastSum
                  ? 'That is ' + app.money(round2(lastSum - thisSum)) + ' less than the whole of the one before.'
                  : 'That is ' + app.money(round2(thisSum - lastSum)) + ' more than the whole of the one before.') })
          ]),
          el('div.card', null, [
            capIcon(null, past ? span + ' in numbers' : 'This pay period in numbers'),
            /* Left until payday belongs to the stretch you are in. On a finished
               one it is today's figure wearing the wrong date, so it is dropped. */
            el('div.rows', null, (past ? [
              ['Days in it', String(periodLen)],
              ['Logged', app.money(thisSum)],
              ['Average a day', app.money(perDay)]
            ] : [
              ['Days in it', String(periodLen)],
              ['Logged so far', app.money(thisSum)],
              ['Average a day, so far', app.money(perDay)],
              /* A negative here is not an amount anybody can act on, and the
                 Today page says what it means in words. The sentence under the
                 card is that same sentence. */
              ['Left until payday', app.money(Math.max(0, b.left))]
            ]).map(([k, v]) => el('div.row', null, [
              el('span.nm', { text: k }), el('span.amt', { text: v })
            ]))),
            (!past && b.left < 0) ? el('p.sub.warn', { style: 'margin-top:11px', html:
              'What is due before payday is <b>' + app.money(round2(-b.left)) +
              '</b> more than the account holds. Nothing is safe to spend yet.' }) : null
          ])
        ])
      ])
    ]);
  }
};

/* Milestones. These only ever count up. Nothing here can be broken or lost,
   which is the whole reason there is no streak anywhere in this product. */
const milestonesScreen = {
  id: 'milestones',
  label: 'Milestones',
  view(app) {
    const s = app.state;
    const t = today();
    const b = safeToSpend(s, t);

    const daysLogged = (new Set(s.spends.map(x => x.date))).size;
    const noSpendDays = noSpendDayCount(s, t);
    const parkedNow = (s.parked || []).length;
    const goalsReached = s.goals.filter(g => g.target > 0 && g.saved >= g.target).length;
    const setAside = round2(b.working.potsOut + b.working.goalPotsOut);
    const billsDue = b.working.due.length;
    const billsCovered = billsDue > 0 && b.left >= 0;

    /* Reached is read off the latched flags, never off the live numbers, so
       nothing here can fall back a step. The engine sets a flag before this
       page is drawn, so a condition true right now is already a flag. What is
       live is only the second line, and it never says "Not yet." under a tick:
       it says what is true now instead.  See latchMilestones in budget.js. */
    const items = [
      { name: 'Every bill before payday is covered', done: !!s.everBillsCovered,
        /* Not "set aside": F002 settled that for money already put by, and
           nothing is put by for a bill the balance simply covers. */
        line: billsCovered ? 'Done. There is enough in your account for all of them.'
          : s.everBillsCovered
            ? (billsDue === 0 ? 'Done before. Nothing is due before payday right now.'
              : 'Done before. Not all of them are covered right now.')
            : billsDue === 0 ? 'Nothing is due before payday yet.' : 'Not yet.' },
      { name: 'A day with nothing spent', done: !!s.everNoSpendDay,
        line: noSpendDays > 0 ? noSpendDays + (noSpendDays === 1 ? ' day' : ' days') + ' in the last two months'
          : s.everNoSpendDay ? 'Done before. None in the last two months.' : 'Not yet.' },
      { name: 'Ten days with something logged', done: !!s.everTenDays,
        line: daysLogged >= 10 ? 'Done. Logged on ' + daysLogged + ' days.'
          : s.everTenDays ? 'Done before. ' + daysLogged + (daysLogged === 1 ? ' day is' : ' days are') + ' logged right now.'
            : daysLogged + ' of 10' },
      { name: 'A goal reached in full', done: !!s.everGoalReached,
        line: goalsReached > 0 ? goalsReached + ' reached'
          : s.everGoalReached ? 'Done before. No goal is full right now.' : 'Not yet.' },
      { name: 'Money set aside for later', done: !!s.everSetAside,
        line: setAside > 0 ? app.money(setAside) + ' set aside'
          : s.everSetAside ? 'Done before. Nothing is set aside right now.' : 'Not yet.' },
      { name: 'Something parked rather than bought', done: !!s.everParked,
        line: parkedNow > 0 ? (parkedNow === 1 ? 'One thing is waiting now.' : parkedNow + ' things are waiting now.')
          : s.everParked ? 'Done before. Nothing is waiting right now.' : 'Not yet.' }
    ];
    const reached = items.filter(i => i.done).length;

    return el('div.milestones', null, [
      screenTop(app, 'Milestones', 'These only count up. Nothing here can be broken.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Reached'),
            el('p.sub', { style: 'margin-top:8px', html: '<b>' + reached + ' of ' + items.length + '</b> so far.' }),
            el('div.bar', { style: 'margin-top:11px' },
              el('i', { style: 'width:' + Math.round(reached / items.length * 100) + '%' }))
          ]),
          el('div.card', null, [
            capIcon(null, 'The list'),
            el('div.rows', null, items.map(i => el('div.row.rowtall', null, [
              el('span.tick' + (i.done ? '.on' : ''), { text: i.done ? '✓' : '' }),
              el('span.nm', null, [
                el('span.nmline' + (i.done ? '' : '.pending'), { text: i.name }),
                el('span.foot', { text: i.line })
              ])
            ])))
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            helpCap('Why there is no streak', 'A streak is a thing that can break, and the day it breaks is usually the day people stop opening the app. These only go up.'),
            el('p.sub', { style: 'margin-top:10px', text: 'Miss a week and nothing here is lost. Come back and it is exactly where you left it.' })
          ])
        ])
      ])
    ]);
  }
};

/* Brain dump. The one place with no amount, no category and no date. Nothing
   here is ever counted, sorted or nagged about. */
const brainDumpScreen = {
  id: 'brain-dump',
  label: 'Brain dump',
  view(app) {
    const s = app.state;
    const box = el('textarea.fi.dump', { rows: '3', placeholder: 'Anything at all', 'aria-label': 'Brain dump' });

    const add = () => {
      const text = box.value.trim();
      if (!text) return;
      app.change(st => { st.notes.unshift({ id: uid('n'), text: text, done: false }); });
      /* The change redraws the screen, so the box you were typing in is gone and
         with it the cursor. This is the one screen built for one thought after
         another, so put the cursor back in the new box. */
      const next = document.querySelector('.dumpscreen .dump');
      if (next) next.focus();
    };

    const open = s.notes.filter(n => !n.done);
    const cleared = s.notes.filter(n => n.done);

    return el('div.dumpscreen', null, [
      screenTop(app, 'Brain dump', 'Get it out of your head. Nothing here has to become a task.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Write it down'),
            el('div.form', null, [
              el('div.fgrid', null, box),
              el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Add', onclick: add }))
            ])
          ]),
          listCard('On your mind', open.map(n => noteRow(app, n)),
            'Nothing written down yet. Use the box above whenever something is on your mind.'),
          /* Cleared sits directly under On your mind rather than across in the
             other column, so a note you are done with visibly lands somewhere
             you can see from where you clicked. */
          cleared.length ? listCard('Cleared', cleared.map(n => noteRow(app, n)), '') : null
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Why this is here'),
            el('p.sub', { style: 'margin-top:8px', text:
              'Worries are easier to look at once they are written down. Nothing here is counted or chased.' })
          ])
        ])
      ])
    ]);
  }
};

function noteRow(app, n) {
  return el('div.row.noterow', null, [
    el('span.nm' + (n.done ? '.doneline' : ''), { text: n.text }),
    el('button.linky.rowx', { type: 'button', text: n.done ? 'Put back' : 'Done with it',
      onclick: () => app.change(s => {
        s.notes = s.notes.map(x => x.id === n.id ? Object.assign({}, x, { done: !x.done }) : x);
      }) }),
    el('button.linky.rowx', { type: 'button', text: 'Delete',
      onclick: () => app.change(s => { s.notes = s.notes.filter(x => x.id !== n.id); }) })
  ]);
}

/* Settings. Also the setup: name, what is in the account, and when you are paid.
   Three answers and Today has a real number on it. */
const settingsScreen = {
  id: 'settings',
  label: 'Settings',
  view(app) {
    const s = app.state;

    const name = field('Your name', { value: s.name, placeholder: 'Your name' });
    const balance = field('In your main account', { value: amountValue(everydayBalance(s), app.cur), inputmode: 'decimal', placeholder: '0.00' });
    const asOf = field('Checked on', { type: 'date', value: s.balanceAsOf,
      min: toISO(addDays(today(), -3650)), max: toISO(today()) });
    const cur = picker('Currency', CURRENCIES.map(c => ({ value: c.code, label: c.label + ' (' + c.symbol.trim() + ')' })), app.cur.code);
    const msg = el('p.sub.warn');

    /* The example in this line has to be their own money and their own two
       signs, or it is just a sentence about euros to somebody in Sweden. */
    const curNote = el('p.sub', { style: 'margin-top:8px' });
    const sayCur = () => {
      const to = CURRENCIES.filter(c => c.code === cur.value)[0] || app.cur;
      const n = balance.bad ? 0 : (balance.number || 2500);
      curNote.textContent = to.code === app.cur.code
        ? 'Switching currency changes the sign only, it does not convert.'
        : 'Switching currency changes the sign only, it does not convert. '
          + money(n, app.cur) + ' becomes ' + money(n, to) + '.';
    };
    cur.el.addEventListener('change', sayCur);
    balance.el.addEventListener('input', sayCur);
    sayCur();

    const save = () => {
      if (!asOf.value) { msg.textContent = 'The balance needs a date, so spending is counted from the right day.'; return; }
      /* The field warns while it is being typed, but Save went ahead anyway and
         booked an unreadable balance as zero. */
      if (balance.bad) { msg.textContent = amountNote(parseAmount(balance.el.value)); return; }
      app.change(st => {
        st.name = name.value;
        const acc = everyday(st);
        const moved = acc && acc.balance !== balance.number;
        if (acc) acc.balance = balance.number;
        /* A new balance with the old date would take this stretch's spending off
           twice, so unless the date was changed by hand it moves to today. */
        const picked = asOf.value > toISO(today()) ? toISO(today()) : asOf.value;
        st.balanceAsOf = (moved && asOf.value === s.balanceAsOf) ? toISO(today()) : picked;
        st.currency = CURRENCIES.filter(c => c.code === cur.value)[0] || st.currency;
        st.example = false;
      });
    };

    const file = el('input', { type: 'file', accept: '.json,application/json', hidden: true });
    const loadMsg = el('p.sub');
    file.addEventListener('change', () => {
      if (!file.files[0]) return;
      importBackup(file.files[0], (err, next) => {
        if (err) { loadMsg.textContent = err; return; }
        app.replace(next);
      });
    });

    /* Anything that throws real numbers away asks first, and that includes
       loading the example over them: it wipes as much as clearing does. On the
       example itself there is nothing to lose, so it goes straight through. */
    const wipe = el('div.stack');
    const ask = (line, yes, onYes) => {
      wipe.innerHTML = '';
      wipe.appendChild(el('p.sub', { text: line }));
      wipe.appendChild(confirmRow('', onYes, wipeButtons, { yes: yes, no: 'Keep my numbers' }));
    };
    const wipeButtons = () => {
      wipe.innerHTML = '';
      if (s.example) {
        wipe.appendChild(el('button.btn.primary', { type: 'button', text: 'Start over with my own numbers',
          onclick: () => app.replace(blankState()) }));
        return;
      }
      wipe.appendChild(el('button.btn', { type: 'button', text: 'Show the example numbers again',
        onclick: () => ask('This puts the example numbers back and takes your own out. A backup is the only way to get them back.',
          'Yes, show the example', () => app.replace(exampleState())) }));
      wipe.appendChild(el('button.btn', { type: 'button', text: 'Clear everything and start over',
        onclick: () => ask('This removes every number you have put in. A backup is the only way to get them back.',
          'Yes, clear everything', () => app.replace(blankState())) }));
    };
    wipeButtons();

    const themeRow = el('div.seg', null, THEMES.map(t =>
      el('button.segbtn' + (s.theme === t ? '.on' : ''), {
        type: 'button', text: THEME_NAMES[t],
        onclick: () => app.change(st => { st.theme = t; applyTheme(t); })
      })
    ));

    return el('div.settings', null, [
      screenTop(app, 'Settings', s.example
        ? 'These are example numbers. Adding your own replaces them.'
        : 'Your name, your balance, and how the planner looks.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Your numbers'),
            el('div.form', null, [
              el('div.fgrid', null, [name.node, cur.node, balance.node, asOf.node]),
              msg,
              el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Save', onclick: save }))
            ]),
            el('p.sub', { style: 'margin-top:12px', text:
              'Spending from before this date is already inside the number you typed, so the planner only counts what you log after it. Whenever your real balance drifts, put the bank\'s number in again and pick today. Change the balance and the date moves to today for you, unless you pick a different one yourself.' }),
            curNote
          ]),
          el('div.card', null, [
            capIcon(null, 'Other settings'),
            el('p.sub', { style: 'margin-top:8px', text: 'Pay lives on the Money in page, other accounts on the Accounts page, and the quick buttons below.' }),
            el('div.footrow', null, [
              el('button.btn', { type: 'button', text: 'Money in', onclick: () => app.go('money-in') }),
              el('button.btn', { type: 'button', text: 'Accounts', onclick: () => app.go('accounts') })
            ])
          ]),
          quickAddCard(app)
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Theme'),
            themeRow
          ]),
          el('div.card', null, [
            /* No count in the sentence: it said "the nine pages" and went stale the
         day the Guide was added to the list. */
      helpCap('How many pages you want', 'Simple keeps the pages most people use every week: Today, Log, Month, Calendar, Bills, Money in, Goals, Savings, the Guide and Settings. Everything else is still there, with all its numbers, just out of the way.'),
            el('div.seg', null, [['simple', 'Simple'], ['all', 'Everything']].map(([v, label]) =>
              el('button.segbtn' + ((v === 'simple') === !!s.simple ? '.on' : ''), {
                type: 'button', text: label,
                onclick: () => app.change(st => { st.simple = v === 'simple'; })
              })
            ))
          ]),
          el('div.card', null, [
            capIcon(null, 'Keeping your numbers safe'),
            el('div.stack', null, [
              el('button.btn', { type: 'button', text: 'Download a backup', onclick: () => exportBackup(app.state) }),
              el('button.btn', { type: 'button', text: 'Load a backup', onclick: () => file.click() }),
              wipe,
              file, loadMsg
            ]),
            el('p.fine', { text: CONFIG.copy.privacy }),
            CONFIG.demoCap ? el('p.fine', { text:
              'This is the demo. You can log ' + CONFIG.demoCap + ' spends in it, and you have ' +
              app.capLeft() + ' left. Download a backup at any point and the full planner carries straight on from it.' }) : null
          ])
        ])
      ])
    ]);
  }
};


/* The quick buttons are the things this person buys without thinking, so they
   have to be theirs, not ours. */
function quickAddCard(app) {
  const rows = app.quickAdd().map((q, i) => el('div.row', null, [
    el('span.nm', { text: q.label }),
    el('span.amt', { text: app.money(q.amount) }),
    el('button.linky.rowx', { type: 'button', text: 'Remove', onclick: () => app.change(s => {
      s.quickAdd = app.quickAdd().filter((x, j) => j !== i);
    }) })
  ]));
  const label = field('What is it', { placeholder: 'Coffee' });
  const amount = field('How much', { inputmode: 'decimal', placeholder: '0.00' });
  const msg = el('p.sub.warn');
  return el('div.card', null, [
    capIcon(null, 'Quick buttons on the Today page'),
    rows.length ? el('div.rows', null, rows) : el('p.sub', { text: 'No quick buttons yet. Add the things you buy most below.' }),
    el('div.form', null, [
      el('div.fgrid', null, [label.node, amount.node]),
      msg,
      el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Add a button', onclick: () => {
        /* A click that does nothing at all reads as a broken button. */
        if (!label.value) { msg.textContent = 'Give the button a name, so you know what it buys.'; return; }
        if (!(amount.number > 0)) { msg.textContent = 'Put in how much it costs, as a number above zero.'; return; }
        app.change(s => { s.quickAdd = app.quickAdd().concat([{ label: label.value, amount: amount.number }]); });
      } }))
    ])
  ]);
}
