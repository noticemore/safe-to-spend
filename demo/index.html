function dayOf(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function today() { return dayOf(new Date()); }

function parseISO(s) {
  const [y, m, d] = String(s).split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

/* Day 31 follows the real month length: 31 Jan + 1 month is 28 Feb, and the
   anchor day is remembered so 28 Feb + 1 month is 31 Mar, not 28 Mar. */
function addMonths(d, n, anchorDay) {
  const want = anchorDay || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return new Date(t.getFullYear(), t.getMonth(), Math.min(want, last));
}

function daysBetween(a, b) { return Math.round((dayOf(b) - dayOf(a)) / DAY); }

/* A frequency is {unit:'day'|'week'|'month', every:n} or null for one-off. */
function periodDays(freq) {
  if (!freq) return null;
  if (freq.unit === 'day') return freq.every;
  if (freq.unit === 'week') return freq.every * 7;
  return freq.every * 30.4375;
}

function step(d, freq, anchorDay) {
  if (freq.unit === 'day') return addDays(d, freq.every);
  if (freq.unit === 'week') return addDays(d, freq.every * 7);
  return addMonths(d, freq.every, anchorDay);
}

/* First occurrence on or after `from`. The jump is worked out in one go rather
   than stepped, so an anchor a century out still lands on the right date instead
   of running out of steps and answering with a day in the past. */
function nextOn(anchorISO, freq, from) {
  const anchor = parseISO(anchorISO);
  if (!freq) return anchor;
  if (isNaN(anchor)) return from;

  const anchorDay = anchor.getDate();
  let d = anchor;

  if (freq.unit === 'day' || freq.unit === 'week') {
    const span = (freq.unit === 'day' ? freq.every : freq.every * 7) || 1;
    const gap = daysBetween(d, from);
    if (gap > 0) d = addDays(d, Math.ceil(gap / span) * span);
    else if (gap < 0) d = addDays(d, -Math.floor(-gap / span) * span);
  } else {
    const every = freq.every || 1;
    const months = (from.getFullYear() - anchor.getFullYear()) * 12
      + (from.getMonth() - anchor.getMonth());
    d = addMonths(anchor, Math.floor(months / every) * every, anchorDay);
  }

  /* Month lengths and the anchor day can leave it a step out either way. */
  let guard = 0;
  while (d < from && guard++ < 24) d = step(d, freq, anchorDay);
  guard = 0;
  while (guard++ < 24) {
    const back = freq.unit === 'month'
      ? addMonths(d, -freq.every, anchorDay)
      : step(d, { unit: freq.unit, every: -freq.every }, anchorDay);
    if (back < from) break;
    d = back;
  }
  return d;
}

/* Occurrences in [from, until). */
function occurrences(anchorISO, freq, from, until) {
  const out = [];
  let d = nextOn(anchorISO, freq, from);
  if (!freq) return d >= from && d < until ? [d] : [];
  const anchorDay = parseISO(anchorISO).getDate();
  let guard = 0;
  while (d < until && guard++ < 400) { out.push(d); d = step(d, freq, anchorDay); }
  return out;
}

function nextPayday(pay, from) {
  const f = from || today();
  const first = nextOn(pay.anchor, pay.freq, f);
  if (!pay.second) return first;
  const second = nextOn(pay.second, pay.freq, f);
  return second < first ? second : first;
}

const fmtDay = d => d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
/* No weekday. For a date sitting inside a sentence, where "Sat," on every one
   of them is noise and the line has to stay short enough to scan. */
const fmtShort = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
/* The same two, for a date that has to stand on its own with no heading nearby
   to say which year it is in. Insights steps back for ever, so "19 Nov" there
   can mean last year while it reads as next week. */
const thisYear = d => d.getFullYear() === today().getFullYear();
const fmtShortY = d => thisYear(d) ? fmtShort(d)
  : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDayY = d => thisYear(d) ? fmtDay(d)
  : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

/* When a parked thing comes off the waitlist, said as a time a person can
   picture. "Waiting 30 more hours" has to be added up before it means
   anything, and the button that parked it promised two days, not hours, so the
   countdown and the promise were in different units. Both pages call this. */
function readyWhen(at) {
  const when = new Date(at + PARK_HOURS * 3600000);
  const h = when.getHours();
  const part = h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
  const days = daysBetween(today(), when);
  if (days <= 0) return 'this ' + part;
  if (days === 1) return 'tomorrow ' + part;
  /* Forty eight hours never reaches a week out, but a clock set wrong or a
     backup restored from another machine can, and a weekday on its own would
     then name a day in the past. */
  if (days < 7) return when.toLocaleDateString(undefined, { weekday: 'long' }) + ' ' + part;
  return fmtDay(when) + ', ' + part;
}

/* Money. Held in minor units as a plain number of currency units, rounded on display. */
function money(n, cur, opts) {
  const o = opts || {};
  const abs = Math.abs(n);
  const body = abs.toLocaleString(undefined, {
    minimumFractionDigits: cur.decimals,
    maximumFractionDigits: cur.decimals
  });
  const sign = n < 0 ? '-' : (o.plus && n > 0 ? '+' : '');
  return cur.after ? sign + body + cur.symbol : sign + cur.symbol + body;
}
function round2(n) { return Math.round(n * 100) / 100; }

/* People write amounts in more than one way, and getting it wrong by a factor of
   a hundred is not survivable in a money app. "1,234.56" and "1.234,56" are the
   same money. "12,50" is how a good part of Europe writes twelve fifty, and this
   planner sells in fourteen currencies. Anything with a letter in it is not an
   amount at all, so "1e9" is refused rather than quietly becoming 19. */
function parseAmount(raw) {
  const text = String(raw == null ? '' : raw).trim();
  if (!text) return { ok: true, value: 0, blank: true };
  if (/[a-z]/i.test(text)) return { ok: false, value: 0 };
  const sign = foreignSign(text);
  if (sign) return { ok: false, value: 0, sign: sign };

  const neg = text.charAt(0) === '-' || /^\(.*\)$/.test(text);
  const body = text.replace(/[^0-9.,]/g, '');
  if (!body) return { ok: false, value: 0 };

  const lastDot = body.lastIndexOf('.');
  const lastComma = body.lastIndexOf(',');
  let dec = -1;
  if (lastDot >= 0 && lastComma >= 0) {
    dec = Math.max(lastDot, lastComma);
  } else if (lastComma >= 0) {
    /* A single comma with one or two digits behind it is a decimal comma.
       Anything else is somebody separating their thousands. */
    dec = (body.indexOf(',') === lastComma && body.length - lastComma - 1 <= 2) ? lastComma : -1;
  } else if (lastDot >= 0) {
    dec = body.indexOf('.') === lastDot ? lastDot : -1;
  }

  const whole = (dec >= 0 ? body.slice(0, dec) : body).replace(/[.,]/g, '');
  const frac = dec >= 0 ? body.slice(dec + 1).replace(/[.,]/g, '') : '';
  if (!whole && !frac) return { ok: false, value: 0 };

  const n = Number((whole || '0') + (frac ? '.' + frac : ''));
  if (!isFinite(n)) return { ok: false, value: 0 };
  /* Nothing capped an amount, so a slipped keyboard put 999999999999 into a
     form and every screen carried a twelve digit figure that no column is
     built for. It is the buyer's own typo and it corrupts nothing, but the
     planner should say so rather than draw it. */
  if (Math.abs(n) > MAX_AMOUNT) return { ok: false, value: 0, big: true };
  return { ok: true, value: round2(neg ? -n : n) };
}

/* Names typed by hand never match on the nose: case, spacing and punctuation
   all drift. Flattening both sides is what lets a logged spend be matched to a
   parked thing without asking the buyer to type it the same way twice. */
function plainName(t) {
  return String(t == null ? '' : t).toLowerCase()
    .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
}

/* kr, zl, CA$ and the rest carry a letter, so they are already refused as not
   an amount. These five do not, which meant "$10" typed into a planner set to
   euro was quietly read as ten euro. Nothing here converts between
   currencies, and a figure that silently changes flag is worse than one that
   is refused, so a sign that is not this planner's own stops the entry. The
   buyer's own sign is let through: people type it out of habit. */
const MONEY_SIGNS = '$\u20AC\u00A3\u20B9\u00A5';

function currentCurrency() {
  const cur = (typeof STATE !== 'undefined' && STATE && STATE.currency) ||
    (typeof CONFIG !== 'undefined' && CONFIG ? CONFIG.currency : null) || { symbol: '' };
  /* A settings file carries the code and the symbol but no name for it, so the
     name comes from the table rather than the message saying "your currency". */
  if (cur.label) return cur;
  const known = (typeof CURRENCIES !== 'undefined' ? CURRENCIES : [])
    .filter(c => c.code === cur.code)[0];
  return known || cur;
}

function foreignSign(text) {
  const mine = currentCurrency().symbol || '';
  for (let i = 0; i < text.length; i++) {
    const c = text.charAt(i);
    if (MONEY_SIGNS.indexOf(c) >= 0 && mine.indexOf(c) < 0) return c;
  }
  return '';
}

/* One sentence per way of getting an amount wrong, so every box in the app
   says the same thing. */
const NOT_AN_AMOUNT = 'That does not look like an amount. Try something like 12.50';
/* High enough that no real budget reaches it, low enough that the figure still
   fits the column it is drawn in. */
const MAX_AMOUNT = 999999999.99;

function amountNote(parsed) {
  if (parsed && parsed.big) {
    return 'That is more than the planner can hold. The most it takes is ' +
      money(MAX_AMOUNT, currentCurrency()) + '.';
  }
  if (parsed && parsed.sign) {
    return 'Amounts here are in ' + (currentCurrency().label || 'your currency') +
      ', and nothing is converted. Type the number on its own, with no ' + parsed.sign + '.';
  }
  return NOT_AN_AMOUNT;
}


/* Storage. One key, one versioned object, every read and write wrapped:
   private windows and blocked site data must not take the app down, and must
   not pretend everything is fine either. */
const KEY = 'gl.' + CONFIG.slug + '.v1';
const BROKEN_KEY = KEY + '.unreadable';

/* Set while loading, read by the app so it can say something to the person
   instead of quietly starting them again from scratch. */
let LOAD_PROBLEM = null;
let SAVE_WORKS = true;

function num(v) {
  const n = Number(v);
  return isFinite(n) ? n : 0;
}

function storageWorks() {
  try {
    localStorage.setItem(KEY + '.test', '1');
    localStorage.removeItem(KEY + '.test');
    return true;
  } catch (e) { return false; }
}

/* Everything that comes in from outside goes through here: an old save, a
   backup file, anything hand edited. A missing list or an amount stored as text
   used to be a blank page or a figure ten times too big. */
function normalise(s) {
  if (!s || typeof s !== 'object') return null;
  s.v = 1;
  ['bills', 'goals', 'spends', 'parked', 'incomes', 'envelopes', 'notes', 'debts',
   'quickAdd', 'routine', 'accounts'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  if (!s.threeThings || typeof s.threeThings !== 'object' || Array.isArray(s.threeThings)) {
    s.threeThings = {};
  }

  if (!s.pay || typeof s.pay !== 'object') s.pay = {};
  if (!s.pay.freq) s.pay.freq = { unit: 'week', every: 2 };
  if (!s.pay.anchor) s.pay.anchor = toISO(addDays(today(), 14));
  s.pay.amount = num(s.pay.amount);

  if (!s.currency || !s.currency.code) s.currency = CONFIG.currency;

  /* Older saves kept one loose balance. It becomes the everyday account. */
  if (!s.accounts.length) {
    s.accounts = [{ id: 'a1', name: 'Everyday', balance: num(s.balance), everyday: true }];
  }
  if (!s.accounts.some(a => a.everyday)) s.accounts[0].everyday = true;
  delete s.balance;

  /* With no date, nothing logged would ever come off the balance. Today is the
     safe answer: it counts from now on rather than silently counting nothing. */
  if (!s.balanceAsOf) s.balanceAsOf = toISO(today());

  s.accounts.forEach(a => { a.balance = num(a.balance); });
  s.bills.forEach(b => { b.amount = num(b.amount); if (b.pot != null) b.pot = num(b.pot); });
  s.goals.forEach(g => {
    g.target = num(g.target); g.saved = num(g.saved); g.perPayday = num(g.perPayday);
  });
  s.spends.forEach(x => { x.amount = num(x.amount); });
  s.incomes.forEach(i => { i.amount = num(i.amount); });
  /* Interest was dropped from the planner, so an older save still carries a
     rate on every debt and may name an order that no longer exists. Both are
     cleaned up on load rather than left to sort by a field nobody fills in. */
  s.debts.forEach(d => { d.balance = num(d.balance); d.minimum = num(d.minimum); delete d.rate; });
  if (s.debtOrder === 'dearest') s.debtOrder = 'frees';
  s.parked.forEach(x => { x.amount = num(x.amount); });
  /* The extra debt payment is saved now, so an old save or a hand edit can
     arrive with it as text or missing. */
  s.debtExtra = num(s.debtExtra);
  return s;
}

function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
  } catch (e) {
    SAVE_WORKS = false;
    return null;
  }
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (s && s.v === 1) return s;
    LOAD_PROBLEM = 'saved by a newer version';
    return null;
  } catch (e) {
    /* Keep the damaged text. Writing the example over it is the only thing this
       planner could do that nobody could undo. */
    try { localStorage.setItem(BROKEN_KEY, raw); } catch (e2) {}
    LOAD_PROBLEM = 'damaged';
    return null;
  }
}

function save(state) {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    SAVE_WORKS = true;
  } catch (e) {
    SAVE_WORKS = false;
  }
}

/* The unreadable copy, handed back as a file so somebody who knows JSON has a
   chance of rescuing it. */
function hasRescueCopy() {
  try { return !!localStorage.getItem(BROKEN_KEY); } catch (e) { return false; }
}
function downloadRescueCopy() {
  let raw = '';
  try { raw = localStorage.getItem(BROKEN_KEY) || ''; } catch (e) { return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
  a.download = CONFIG.slug + '-unreadable-' + toISO(today()) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportBackup(state) {
  const body = JSON.stringify({ product: CONFIG.slug, saved: new Date().toISOString(), state }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'application/json' }));
  a.download = CONFIG.slug + '-backup-' + toISO(today()) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Kept apart from the file reading so it can be checked on its own. */
function readBackup(text) {
  let parsed = null;
  try { parsed = JSON.parse(text); } catch (e) {
    return { err: 'That file could not be read.' };
  }
  /* A backup from a sister planner is the same shape and completely wrong, and
     loading one used to leave a blank page on every open from then on. */
  if (parsed && parsed.product && parsed.product !== CONFIG.slug) {
    return { err: 'That backup is from a different planner, so it will not fit this one.' };
  }
  const s = parsed && parsed.state && parsed.state.v === 1 ? normalise(parsed.state) : null;
  if (!s) return { err: 'That file is not a backup from this planner.' };
  return { state: s };
}

function importBackup(file, done) {
  const r = new FileReader();
  r.onload = () => {
    const out = readBackup(r.result);
    if (out.err) return done(out.err);
    done(null, out.state);
  };
  r.onerror = () => done('That file could not be read.');
  r.readAsText(file);
}

/* The money engine. One function answers the product's only question, and it
   returns its own working, so the "How is this worked out?" panel never has to
   recalculate anything itself. */

/* Money lives in accounts. The everyday one is where pay lands and where
   safe to spend is worked out from; the rest are tracked but never spendable. */
function everyday(state) {
  return (state.accounts || []).filter(a => a.everyday)[0] || (state.accounts || [])[0] || null;
}

/* Does this bill come out of the money the Today number is about? A bill
   pointing at an account that is gone, or at the account that used to be the
   everyday one, falls back to yes: otherwise changing which account is the
   main one would quietly drop every bill from the sum. */
function fromEveryday(state, bill) {
  const accounts = state.accounts || [];
  const dayId = (everyday(state) || {}).id;
  const named = bill.account && accounts.some(a => a.id === bill.account);
  return !(named && dayId && bill.account !== dayId);
}
function everydayBalance(state) {
  const a = everyday(state);
  return a ? a.balance : 0;
}
function netInAccounts(state) {
  return round2((state.accounts || []).reduce((t, a) => t + a.balance, 0));
}

/* Payday can come from more than one place: a second job, a benefit, anything
   recurring that is marked as pay. The nearest one wins. */
function paydayFor(state, from) {
  let best = nextPayday(state.pay, from);
  (state.incomes || []).forEach(i => {
    if (!i.isPay || !i.freq) return;
    const d = nextOn(i.date, i.freq, from);
    if (d < best) best = d;
  });
  return best;
}

/* How many paydays landed after `after`, up to and including `upto`. It has to
   walk paydayFor rather than count the regular pay on its own, because an
   income on Money in marked "counts as a payday" is a payday everywhere else in
   the app. Counting only the regular pay held goal money back on every stretch
   but credited it on some of them, and the difference went nowhere. */
function paydaysBetween(state, after, upto) {
  let n = 0, cur = after, guard = 0;
  while (guard++ < 400) {
    const d = paydayFor(state, addDays(cur, 1));
    if (isNaN(d) || d > upto) break;
    n++;
    cur = d;
  }
  return n;
}

/* The payday before `d`. It walks real paydays instead of taking an average
   period off the date: a month is 28 to 31 days, so a fixed step drifts and the
   drift compounds. Insights was showing 1 Nov, 2 Oct, 3 Sept, 4 Aug. */
function prevPayday(state, d) {
  const span = Math.max(1, Math.round(payPeriodDays(state.pay)));
  let lo = addDays(d, -span);
  let first = paydayFor(state, lo);
  let guard = 0;
  while (guard++ < 24 && (isNaN(first) || first >= d)) {
    lo = addDays(lo, -span);
    first = paydayFor(state, lo);
  }
  /* No payday anywhere behind it: the average is the only answer left. */
  if (isNaN(first) || first >= d) return addDays(d, -span);
  let cur = first, g2 = 0;
  while (g2++ < 400) {
    const next = paydayFor(state, addDays(cur, 1));
    if (isNaN(next) || next >= d) break;
    cur = next;
  }
  return cur;
}

/* Anything logged after the balance was taken, up to today. A spend dated in
   the future has not happened yet, and one dated before the balance was taken is
   already inside that balance, so neither comes off twice. With no balance date
   at all, counting nothing would be the dangerous answer, so everything counts. */
function spendsSince(state, fromISO) {
  const from = fromISO ? parseISO(fromISO) : null;
  const upto = today();
  return (state.spends || []).filter(s => {
    const d = parseISO(s.date);
    if (isNaN(d) || d > upto) return false;
    return from && !isNaN(from) ? d >= from : true;
  });
}

function spentOn(state, d) {
  const iso = toISO(d);
  return round2(state.spends.filter(s => s.date === iso).reduce((t, s) => t + s.amount, 0));
}

/* How long one pay stretch is on average. Two paydays a month halves it. */
function payPeriodDays(pay) {
  const p = periodDays(pay.freq) || 30.4375;
  return pay.second ? p / 2 : p;
}

/* A bill that comes round less often than the pay does cannot be paid out of one
   stretch, so it is saved up for instead: $372 every six months is held back at
   $62 a month. Anything that lands at least as often as the pay is just paid. */
function isFund(bill, pay) {
  const p = periodDays(bill.freq);
  if (!p) return true;
  return p > payPeriodDays(pay) + 1;
}

/* Money set aside grows a little every day, so the day the bill lands the pot is
   already holding it and the bill does not get charged a second time. */
function accrue(state, upto) {
  const t = upto || today();
  const last = state.lastRun ? parseISO(state.lastRun) : t;
  const days = daysBetween(last, t);
  if (days <= 0) { state.lastRun = toISO(t); return state; }

  /* Goals fill themselves on payday. Without this the amount per payday was
     held back every stretch for ever and the goal never moved an inch. */
  const paydaysPassed = paydaysBetween(state, last, t);
  if (paydaysPassed) {
    (state.goals || []).forEach(g => {
      if (g.paused || !(g.perPayday > 0)) return;
      if (round2((g.target || 0) - (g.saved || 0)) <= 0) return;
      g.saved = round2(Math.min(g.target, (g.saved || 0) + g.perPayday * paydaysPassed));
    });
  }

  (state.bills || []).forEach(b => {
    /* Nothing is being set aside for a bill that comes out of another account,
       so letting its pot tick up every day only prints a number that means
       nothing and never gets spent. */
    if (b.paused || !isFund(b, state.pay) || !fromEveryday(state, b)) return;
    if (b.pot == null) b.pot = 0;
    const period = periodDays(b.freq) || Math.max(1, daysBetween(last, parseISO(b.due)));
    b.pot = round2(b.pot + b.amount / period * days);
    /* Each time it actually fell due, the pot paid for it. */
    occurrences(b.due, b.freq, addDays(last, 1), addDays(t, 1))
      .forEach(() => { b.pot = round2(Math.max(0, b.pot - b.amount)); });
    b.pot = round2(Math.min(b.pot, b.amount));
  });

  state.lastRun = toISO(t);
  return state;
}

/* Three separate piles, never mixed on one row:
   - due:  money that leaves the account before payday
   - held: the slice being set aside during this stretch
   - pots: what past stretches already set aside and is sitting in the balance */
function billsForStretch(state, from, payday) {
  const stretch = Math.max(1, daysBetween(from, payday));
  const due = [], held = [], pots = [], elsewhere = [];

  const accounts = state.accounts || [];

  (state.bills || []).forEach(b => {
    /* A paused bill stops costing anything: nothing falls due and nothing more
       is set aside. What it has ALREADY set aside stays set aside, which is
       the whole reason to pause rather than delete. Dropping it out of `pots`
       would hand the pot back as spending money and push Safe to Spend up by
       the full amount the moment the pause was pressed, which is the opposite
       of what the button says. A paused goal already keeps its saved money the
       same way, in `goalPots`. */
    if (b.paused) {
      if (fromEveryday(state, b) && (b.pot || 0) > 0) {
        pots.push({ name: b.name, amount: round2(b.pot), on: nextOn(b.due, b.freq, from) });
      }
      return;
    }
    /* A bill paid from another account is real, but it is not coming out of the
       money this screen is about, so it is listed there and not deducted here.
       A bill pointing at an account that is gone, or at the account that used to
       be the everyday one, falls back to the everyday account: otherwise changing
       which account is the main one would quietly drop every bill from the sum. */
    if (!fromEveryday(state, b)) {
      /* Still said out loud, on the screen that lists what is due. Dropping it
         silently makes the app look like it lost a bill. */
      const where = (accounts.filter(a => a.id === b.account)[0] || {}).name || 'another account';
      occurrences(b.due, b.freq, from, payday)
        .forEach(on => elsewhere.push({ name: b.name, amount: b.amount, on: on, account: where }));
      return;
    }

    const pot = b.pot || 0;
    const fund = isFund(b, state.pay);
    /* Payday itself: rent that leaves on the morning you are paid still has to be
       covered by the money sitting there now. It is only pulled in when nothing
       else from this bill already falls inside the stretch, so a monthly bill on
       a monthly payday is never counted twice. */
    let inside = occurrences(b.due, b.freq, from, payday);
    if (!inside.length) inside = occurrences(b.due, b.freq, payday, addDays(payday, 1));

    if (!fund) {
      inside.forEach(on => due.push({ name: b.name, amount: b.amount, on: on }));
      return;
    }

    const on = inside.length ? inside[0] : nextOn(b.due, b.freq, from);

    /* A one-off whose day has gone and which nobody has removed is still owed, so
       it keeps being held back instead of quietly vanishing from the sum. */
    if (!b.freq && on < from) {
      due.push({ name: b.name, amount: b.amount, on: on, overdue: true });
      return;
    }

    if (inside.length) {
      /* It lands inside this stretch. The pot is only an earmark inside the same
         balance, nothing was ever moved out of it, so the whole bill still has to
         come out of that balance. */
      /* How much of it is already put by travels as a number, not as words
         glued onto the name: ", saved up for" told nobody how much, and every
         screen showing this bill inherited the phrase whether it suited or
         not. */
      inside.forEach(x => due.push({ name: b.name, amount: b.amount, on: x, saved: pot }));
      return;
    }

    const period = periodDays(b.freq) || Math.max(stretch, daysBetween(from, on));
    const slice = round2(Math.max(0, Math.min(b.amount - pot, b.amount * stretch / period)));
    if (slice > 0) held.push({ name: b.name, amount: slice, on: on });
    if (pot > 0) pots.push({ name: b.name, amount: pot, on: on });
  });

  due.sort((a, b) => a.on - b.on);
  held.sort((a, b) => a.on - b.on);
  pots.sort((a, b) => a.on - b.on);
  elsewhere.sort((a, b) => a.on - b.on);
  return { due, held, pots, elsewhere, stretch };
}

/* The oldest day this planner has anything to say about. Insights and Month
   both step backwards one period at a time and used to keep going for ever,
   into empty months that predate everything the buyer owns. */
function earliestDay(state) {
  let d = state.balanceAsOf ? parseISO(state.balanceAsOf) : today();
  if (isNaN(d)) d = today();
  (state.spends || []).forEach(x => {
    const p = parseISO(x.date);
    if (!isNaN(p) && p < d) d = p;
  });
  (state.incomes || []).forEach(i => {
    const p = parseISO(i.date);
    if (!isNaN(p) && p < d) d = p;
  });
  return d;
}

/* Money landing before payday counts towards the stretch, otherwise someone who
   is paid twice from different places sees a figure that is far too mean. */
function incomesForStretch(state, from, payday) {
  const out = [];
  (state.incomes || []).forEach(i => {
    occurrences(i.date, i.freq || null, from, payday)
      .forEach(on => out.push({ name: i.name, amount: i.amount, on: on }));
  });
  out.sort((a, b) => a.on - b.on);
  return out;
}

function goalsForStretch(state) {
  return state.goals
    .filter(g => !g.paused && g.perPayday > 0 && g.saved < g.target)
    .map(g => ({ name: g.name, amount: Math.min(g.perPayday, round2(g.target - g.saved)) }));
}

function safeToSpend(state, now) {
  const from = now || today();
  /* Strictly after today: on payday itself, the stretch being planned is the
     one that starts today, not the one that just ended. */
  const payday = paydayFor(state, addDays(from, 1));
  const { due, held, pots, elsewhere, stretch } = billsForStretch(state, from, payday);
  const goals = goalsForStretch(state);
  const incomes = incomesForStretch(state, from, payday);
  /* Money already in a goal is sitting in the balance and is not spendable,
     exactly like a bill's pot. */
  const goalPots = state.goals.filter(g => g.saved > 0).map(g => ({ name: g.name, amount: round2(g.saved) }));

  const billsOut = round2(due.reduce((t, b) => t + b.amount, 0));
  const heldOut = round2(held.reduce((t, b) => t + b.amount, 0));
  const potsOut = round2(pots.reduce((t, b) => t + b.amount, 0));
  const goalsOut = round2(goals.reduce((t, g) => t + g.amount, 0));
  const goalPotsOut = round2(goalPots.reduce((t, g) => t + g.amount, 0));
  const incomeIn = round2(incomes.reduce((t, i) => t + i.amount, 0));
  const spentSince = round2(spendsSince(state, state.balanceAsOf).reduce((t, s) => t + s.amount, 0));

  const spentToday = spentOn(state, from);
  const left = round2(everydayBalance(state) + incomeIn - potsOut - goalPotsOut
    - spentSince - billsOut - heldOut - goalsOut);
  const potAtDayStart = round2(left + spentToday);
  const allowance = round2(potAtDayStart / stretch);
  const safe = round2(allowance - spentToday);

  /* The stretch you are IN runs from the last payday to the next one. `stretch`
     is only what is left of it, so anything looking backwards needs `start`. */
  const start = prevPayday(state, payday);
  const period = Math.max(1, daysBetween(start, payday));

  return {
    payday, stretch, period, start, left, allowance, spentToday,
    safe: Math.max(0, safe),
    over: safe < 0 ? round2(-safe) : 0,
    tomorrow: round2(Math.max(0, left - Math.max(0, safe)) / Math.max(1, stretch - 1)),
    used: allowance > 0 ? Math.min(1, spentToday / allowance) : 0,
    working: {
      balance: everydayBalance(state), balanceAsOf: state.balanceAsOf, spentSince,
      due, held, pots, elsewhere, goals, goalPots, incomes,
      billsOut, heldOut, potsOut, goalsOut, goalPotsOut, incomeIn
    }
  };
}

/* One answer to "can I afford this", wherever it is asked. The Today page asks
   it about something being held in a shop and the Waitlist asks it about
   something already on the list. A buyer who meets two different sentences for
   the same sum reads them as two different answers, so there is one set. */
function affordLine(app, b, amount) {
  if (amount <= b.safe) {
    return 'You can afford it today. That leaves <b>' + app.money(round2(b.safe - amount)) +
      '</b> for the rest of today.';
  }
  if (amount <= b.left) {
    const after = round2((b.left - amount) / Math.max(1, b.stretch));
    return 'You can, but it comes out of the days after today. Buying it makes every day ' +
      'until payday <b>' + app.money(after) + '</b> instead of <b>' + app.money(b.allowance) + '</b>.';
  }
  return 'That is <b>' + app.money(round2(amount - b.left)) +
    '</b> more than you have between now and payday.';
}


const NO_SPEND_WINDOW = 60;

/* Days with nothing logged, looking back from `now` and never past the day the
   balance was taken, because there is no record of what happened before it.
   Read by the Milestones page and by the latch below, from one place, so the
   count on the page and the tick beside it can never disagree. */
function noSpendDayCount(state, now) {
  const seen = {};
  (state.spends || []).forEach(x => { seen[x.date] = true; });
  let n = 0;
  for (let i = 1; i <= NO_SPEND_WINDOW; i++) {
    const d = toISO(addDays(now, -i));
    if (parseISO(d) < parseISO(state.balanceAsOf)) break;
    if (!seen[d]) n++;
  }
  return n;
}
/* Milestones only ever count up, which is the whole reason this product has no
   streak in it. Four of them used to be read live off the current numbers, so
   they could un-tick: money set aside drops to zero the moment payday lands,
   the no-spend count only reaches back two months, and a goal that is spent or
   deleted took its own tick with it. So the moment a condition is true it is
   written into the state, and the page reads the flag from then on.

   This runs from app.render(), not from the Milestones screen, because a buyer
   who reaches one on Today and never opens Milestones must keep it just the
   same. It writes to the state directly instead of going through app.change,
   because it is called from inside the render that app.change ends with.
   Returns true when something new was latched, so the caller can save. */
function latchMilestones(state) {
  let hit = false;
  const mark = k => { if (!state[k]) { state[k] = true; hit = true; } };
  const now = today();
  const b = safeToSpend(state, now);

  /* Every bill due before payday is already deducted inside `left`, so the
     money is covered exactly when `left` has not gone under. */
  if (b.working.due.length > 0 && b.left >= 0) mark('everBillsCovered');
  if (round2(b.working.potsOut + b.working.goalPotsOut) > 0) mark('everSetAside');
  if ((state.goals || []).some(g => g.target > 0 && g.saved >= g.target)) mark('everGoalReached');
  if ((state.parked || []).length > 0) mark('everParked');
  if (noSpendDayCount(state, now) > 0) mark('everNoSpendDay');
  /* Distinct dates, so two spends on one day are one day. Deleting spends
     used to take this tick back off. */
  if ((new Set((state.spends || []).map(x => x.date))).size >= 10) mark('everTenDays');
  return hit;
}

/* Form bits, shared by every screen that edits a record. Labels are always
   visible: a placeholder that vanishes the moment you type is no use to anyone
   who looks away mid-sentence. */
/* Every amount box is type=text with inputmode decimal, not type=number:
   number gives spinners, changes on a scroll wheel and fights a comma decimal
   separator. The guard is the message, not the keyboard. */
function field(label, opts) {
  const o = opts || {};
  const input = el('input.fi', {
    type: o.type || 'text',
    inputmode: o.inputmode || null,
    value: o.value != null ? o.value : '',
    placeholder: o.placeholder || null,
    min: o.min || null,
    max: o.max || null
  });
  const node = el('label.field', null, [el('span.flabel', { text: label }), input]);

  /* An amount that cannot be read says so while it is being typed, instead of
     the button quietly doing nothing when it is pressed. */
  if (o.inputmode === 'decimal') {
    const note = el('span.fieldnote', { hidden: true, text: NOT_AN_AMOUNT });
    node.appendChild(note);
    input.addEventListener('input', () => {
      const parsed = parseAmount(input.value);
      note.textContent = amountNote(parsed);
      note.hidden = parsed.ok;
      input.classList.toggle('bad', !parsed.ok);
    });
  }

  return {
    node: node,
    el: input,
    get value() { return input.value.trim(); },
    get number() { return parseAmount(input.value).value; },
    get bad() { return !parseAmount(input.value).ok; }
  };
}

/* A stored amount shown back in a field: 1901.5 is not what anyone typed. It is
   never rounded to the currency's decimals here, or switching to yen and saving
   would quietly round every amount in the planner. */
function amountValue(n, cur) {
  if (!n) return '';
  const shown = Number(n).toFixed(cur.decimals);
  return Number(shown) === Number(n) ? shown : String(n);
}

function picker(label, options, value) {
  const sel = el('select.fi');
  options.forEach(o => {
    const opt = el('option', { value: o.value, text: o.label });
    if (String(o.value) === String(value)) opt.selected = true;
    sel.appendChild(opt);
  });
  return {
    node: el('label.field', null, [el('span.flabel', { text: label }), sel]),
    el: sel,
    get value() { return sel.value; }
  };
}

/* Frequencies, in the words a person would use. */
const FREQS = [
  { value: 'week:1', label: 'Every week' },
  { value: 'week:2', label: 'Every 2 weeks' },
  { value: 'week:4', label: 'Every 4 weeks' },
  { value: 'month:1', label: 'Every month' },
  { value: 'month:2', label: 'Every 2 months' },
  { value: 'month:3', label: 'Every 3 months' },
  { value: 'month:6', label: 'Every 6 months' },
  { value: 'month:12', label: 'Every year' },
  { value: 'once', label: 'One time only' }
];

function freqToValue(f) { return f ? f.unit + ':' + f.every : 'once'; }
function valueToFreq(v) {
  if (v === 'once') return null;
  const [unit, every] = v.split(':');
  return { unit: unit, every: Number(every) };
}
function freqLabel(f) {
  const v = freqToValue(f);
  const hit = FREQS.filter(x => x.value === v)[0];
  return hit ? hit.label : 'Every month';
}

}

/* The two button labels can be set, because "Yes, remove it" is the wrong
   promise on a confirm that swaps numbers rather than deletes them. */
function confirmRow(label, onYes, onNo, opts) {
  const o = opts || {};
  return el('div.footrow', null, [
    label ? el('span.foot', { text: label }) : null,
    el('button.btn.primary', { type: 'button', text: o.yes || 'Yes, remove it', onclick: onYes }),
    el('button.linky', { type: 'button', text: o.no || 'Keep it', onclick: onNo })
  ]);
}

/* A "?" beside a section title. It shows its line as a tooltip on hover, and
   on tap as well, because a phone has no hover to give. */
function helpCap(cap, text, icon) {
  const wrap = el('span.helpwrap');
  const btn = el('button.helpq', {
    type: 'button', text: '?', 'aria-label': text,
    onclick: e => {
      /* This click must not reach the listener it is about to add, which is what
         stopping it here buys: no timer, so a tap closes it straight away. */
      e.stopPropagation();
      document.querySelectorAll('.helpwrap.show').forEach(o => {
        if (o !== wrap) o.classList.remove('show');
      });
      const open = wrap.classList.toggle('show');
      /* A click leaves the focus on the button, and the tip is shown by
         focus-within as well as by this class, so taking the class off on the
         second tap closed nothing: the button still had the focus and the tip
         stayed up until you tapped somewhere else. */
      if (!open) btn.blur();
      if (open) {
        const away = () => { wrap.classList.remove('show'); document.removeEventListener('click', away); };
        document.addEventListener('click', away);
      }
    }
  });
  wrap.appendChild(btn);
  /* Past about two lines' worth the narrow column gets too tall for the window
     near the top of a page, so a long line gets a wider box. */
  wrap.appendChild(el('span.tip' + (text.length > 150 ? '.wide' : ''),
    { role: 'tooltip', text: text }));
  return el('div.caprow', null, [capIcon(icon, cap), wrap]);
}

/* A caption with its screen's icon beside it. Teal, because teal already carries
   every control and all structure in this product: it is not a second loud
   color, it is the one we have. The icon never carries meaning on its own,
   the words next to it always say the same thing. */
function capIcon(icon, text) {
  /* No icon named means the screen's own, so every card on every screen is
     marked the same way Today is, without naming forty icons by hand. */
  /* false, rather than nothing, for a label inside a card that already carries
     the screen's icon at the top of it: the same mark twice in one card reads
     as two cards. */
  const id = icon === false ? null : (icon || (typeof app !== 'undefined' && app.screen));
  if (!id) return el('div.cap', { text: text });
  return el('div.cap.capicon', null, [
    el('span.capi', { html: navIcon(id) }),
    el('span', { text: text })
  ]);
}


/* Enter submits, the way every other form on the web does. One listener covers
   every form in the app, including ones not written yet: from the field, walk
   out to the nearest form, card or sheet and press its main button.

   A textarea is left alone, because Enter there means a new line. Ctrl or Cmd
   with Enter submits it instead, which is the usual arrangement. */
function enterSubmits(e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (!t || !t.matches) return;

  if (t.matches('textarea')) {
    if (!(e.metaKey || e.ctrlKey)) return;
  } else if (!t.matches('input, select')) {
    return;
  }
  /* A search box has nothing to submit: the list filters as you type. Enter in
     it must never reach for a button elsewhere on the card, which is what it
     started doing the moment the Log screen got a Log a spend button of its
     own, turning a search into an open sheet. */
  if (t.matches('input[type="search"]')) return;

  let node = t.parentElement;
  let btn = null;
  while (node && !btn) {
    if (node.matches('.form, .exactrow, .card, .sheet')) {
      /* Most cards submit with their primary button. A card whose one action is
         deliberately not the loud one marks it .onenter instead, or Enter in
         its boxes does nothing at all. */
      const found = Array.prototype.slice.call(
        node.querySelectorAll('.btn.primary, .btn.onenter'))
        .filter(b => !b.hidden && !b.closest('[hidden]'));
      /* At card level, only a button belonging to the card itself counts. One
         sitting in a list inside it is somebody else's: pressing Enter in the
         "thinking about buying something" box used to press "Buy it" on the
         first thing waiting on the list. */
      /* Inside it. The test used to be "is this button in a list anywhere",
         which found the wrapper ABOVE the card on Envelopes, Goals and
         Accounts, where every record's card sits in one outer .goalwrap. That
         excluded each card's own button, so Enter did nothing at all in any
         per record box on three screens. */
      btn = node.matches('.card')
        ? found.filter(b => {
            const list = b.closest('.parkedwrap, .rows, .goalwrap, .blist, .form');
            return !list || !node.contains(list);
          })[0]
        : found[0];
    }
    if (node.matches('.sheet')) break;
    node = node.parentElement;
  }
  if (!btn || btn.disabled || btn.hidden) return;
  e.preventDefault();
  btn.click();
}

document.addEventListener('keydown', enterSubmits);

/* Chrome counts a select clicked with the mouse as keyboard-focused, so our
   focus ring stayed on after the native menu closed with nothing chosen. The
   menu swallows the first click outside it, so clearing that ring took two.
   A select opened by pointer keeps its ring hidden; by keyboard it keeps it. */
document.addEventListener('pointerdown', e => {
  const s = e.target && e.target.closest && e.target.closest('select');
  if (s) s.classList.add('bypointer');
  /* The native menu eats the click that dismisses it, so the select kept
     focus and a second click was needed to be rid of it. */
  const live = document.activeElement;
  if (live && live.tagName === 'SELECT' && live !== s) live.blur();
}, true);
document.addEventListener('focusout', e => {
  if (e.target && e.target.classList) e.target.classList.remove('bypointer');
}, true);
/* Leaving for another window and coming back lit the ring again, because the
   select still held focus and a restored focus always counts as a visible
   one. Nothing keeps focus across a trip to another app. */
function dropPointerSelect() {
  const live = document.activeElement;
  if (live && live.tagName === 'SELECT' && live.classList.contains('bypointer')) live.blur();
}
window.addEventListener('blur', dropPointerSelect);
document.addEventListener('visibilitychange', dropPointerSelect);

/* Charts. One series only, in teal, with today in amber. No categorical
   palette anywhere: our own rule is one loud color, and teal against our muted
   grey fails the colorblind separation check as a pair, so comparisons are
   drawn as fill against outline with the numbers written on. */

function chartTip() {
  let tip = document.getElementById('charttip');
  if (!tip) {
    tip = el('div.charttip', { id: 'charttip', hidden: true });
    document.body.appendChild(tip);
  }
  return tip;
}

/* The target is the full-height column, not the bar inside it: a quiet day is
   four pixels tall and nobody can hit that. Touch gets a tap as well as hover,
   because on a phone the amounts were simply unreachable. */
/* Which column the tip is currently speaking for, so a second tap on the same
   column puts it away instead of showing the same thing again. */
let TIP_FOR = null;
/* One listener for the whole page, not one per column: every chart used to add
   its own, and a page with three charts added forty of them. */
document.addEventListener('click', () => {
  const t = document.getElementById('charttip');
  if (t) t.hidden = true;
  TIP_FOR = null;
});

function hoverable(node, label) {
  node.setAttribute('tabindex', '0');
  node.setAttribute('aria-label', label);
  const show = () => {
    const tip = chartTip();
    tip.textContent = label;
    tip.hidden = false;
    const r = node.getBoundingClientRect();
    /* Measured after it is shown, then kept inside the window: the first and
       last columns used to push their tip off the side of the page. */
    const w = tip.offsetWidth;
    const x = r.left + r.width / 2 + scrollX;
    tip.style.left = Math.round(Math.min(Math.max(x, w / 2 + 8), innerWidth - w / 2 - 8)) + 'px';
    tip.style.top = Math.round(r.top + scrollY - 10) + 'px';
    TIP_FOR = node;
  };
  const hide = () => {
    chartTip().hidden = true;
    if (TIP_FOR === node) TIP_FOR = null;
  };
  /* Pressing a column focuses it, and the focus used to open the tip before
     the tap that was about to toggle it had been seen at all: the tap then
     found it open and shut it again, so a first tap looked like it did
     nothing. The focus only opens the tip when the focus did not come from a
     finger or a mouse, which leaves the keyboard working as it did. */
  let viaPointer = false;
  node.addEventListener('pointerdown', () => { viaPointer = true; });
  node.addEventListener('mousedown', () => { viaPointer = true; });
  node.addEventListener('touchstart', () => { viaPointer = true; }, { passive: true });
  /* A phone sends mouseenter too, as a courtesy, and it arrives before the tap
     that was about to open the figure: the tap then found it already open and
     shut it, so the first tap on a column did nothing and the second one
     worked. Hover opens it only when the hover is a real one. */
  node.addEventListener('mouseenter', () => { if (!viaPointer) show(); });
  node.addEventListener('focus', () => { if (!viaPointer) show(); });
  node.addEventListener('mouseleave', hide);
  node.addEventListener('blur', hide);
  /* A tap is a switch: on, then off. It used to only ever turn it on, so the
     only way to put the figure away was to tap somewhere else entirely. */
  node.addEventListener('click', e => {
    e.stopPropagation();
    const open = TIP_FOR === node && !chartTip().hidden;
    viaPointer = false;
    if (open) { hide(); node.blur(); } else show();
  });
  return node;
}

/* What the two colors mean, said in the "?" rather than left to be worked
   out. "Today is the amber one" also pointed at a bar that is not drawn on a
   day with nothing logged, so on a quiet morning it sent a buyer looking for
   something that is not there. All three charts take this line. */
function amberNote(days) {
  const t = days.filter(d => d.highlight)[0];
  return (t && t.value > 0)
    ? ' The green bars are the days gone by, and the amber one is today.'
    : ' The green bars are the days gone by. Nothing is logged for today yet,' +
      ' so there is no amber bar.';
}

/* Days along the bottom, amounts up the side, one dashed line for the average.
   The line is labelled, so the comparison never rests on the color. */
/* No average line. It was a dashed rule with a label that had to be kept clear
   of the bars, and it only ever restated the figure in the sentence directly
   above the chart. The sentence says it; the chart draws the days. */
function dayBars(app, days, opts) {
  const o = opts || {};
  const top = Math.max(0.01, Math.max.apply(null, days.map(d => d.value)));

  const bars = days.map(d => {
    /* A day with nothing on it is a fixed 2px marker, not a 1% sliver: a
       percentage of the height lands on half a pixel and sits off the baseline.
       Only a real bar answers to the pointer, so empty ground stays quiet. */
    if (d.value <= 0) return el('div.cbarwrap', null, el('div.cbar.empty'));
    const bar = el('div.cbar' + (d.highlight ? '.hi' : ''),
      { style: 'height:' + Math.max(3, Math.round(d.value / top * 100)) + '%' });
    const wrap = el('div.cbarwrap.live', null, bar);
    /* A day the average above the chart does not count says so on the bar
       itself, which is where someone checking the figure is already pointing. */
    hoverable(wrap, d.full + ': ' + app.money(d.value) +
      (d.faint ? ', already inside your balance' : ''));
    return wrap;
  });

  const plot = el('div.chart', null, bars);
  /* Only three labels are ever shown, and the end ones carry a month, which is
     wider than the one day column they would sit in. A column each would push
     them off the edge of the card, so they are placed along the axis instead:
     the ends against the inside edges, today's over the middle of its bar. */
  const marks = [el('span.ctick.first', { text: days[0].short })];
  for (let i = 1; i < days.length - 1; i++) {
    if (!days[i].highlight) continue;
    marks.push(el('span.ctick.mid', { text: days[i].short,
      style: 'left:' + ((i + 0.5) / days.length * 100).toFixed(3) + '%' }));
  }
  if (days.length > 1) marks.push(el('span.ctick.last', { text: days[days.length - 1].short }));
  const ticks = el('div.cticks', null, marks);
  const box = el('div.chartbox', null, [plot, ticks]);

  return box;
}

/* A ranked list of amounts. A list beats a pie: the numbers are readable and
   nothing needs a second color. */
function barList(app, rows, opts) {
  const o = opts || {};
  if (!rows.length) return el('p.sub', { text: o.empty || 'Nothing yet.' });
  const top = Math.max.apply(null, rows.map(r => r.value)) || 1;
  /* One row has nothing to be measured against: the bar fills the width whatever
     the amount is, which reads as "100% of something" rather than as a share. */
  const bars = rows.length > 1;
  return el('div.blist', null, rows.map(r => el('div.brow', null, [
    el('div.btop', null, [
      el('span.nm', { text: r.name }),
      el('span.amt', { text: app.money(r.value) + (r.note ? ' ' + r.note : '') })
    ]),
    !bars ? null : el('div.btrack' + (r.outline ? '.outline' : ''), null,
      /* Six pixels, not two: a two pixel sliver in a nine pixel track with a
         full radius is a dot, and a dot does not read as an amount. */
      el('i', { style: r.value > 0
        ? 'width:' + Math.round(r.value / top * 100) + '%;min-width:6px' : 'width:0' }))
  ])));
}

/* A donut with one segment per part, in the four chart colors. Bilal asked
   for a real chart, so color does carry identity here; every segment is also
   written out in the legend with a swatch, its amount and its share, and the
   middle names whatever is under the pointer, so nothing rests on color alone.
   Hovering a segment or its legend row lifts both. */
function donut(app, parts, opts) {
  const o = opts || {};
  const total = parts.reduce((n, s) => n + Math.max(0, s.value), 0);
  const R = 74, SW = 22, C = 2 * Math.PI * R;
  /* A gap between segments, so two touching colors never read as one band.
     A thin slice is floored at a visible stub, and the stub is usually wider
     than the slice it stands for. Advancing by the true share then walked the
     next segment straight over that extra width, so a 0% slice and its
     neighbour touched while every other pair had a gap. The widths are worked
     out first and the overspend is taken back off the segments with room to
     give it, so every pair gets the same gap whatever the numbers are. */
  const GAP = 7, STUB = 3;

  const live = parts.filter(s => s.value > 0).length;
  const draws = parts.map(s => s.value > 0
    ? Math.max(STUB, C * (Math.max(0, s.value) / total) - GAP) : 0);
  const spill = draws.reduce((n, d) => n + d, 0) + live * GAP - C;
  if (spill > 0) {
    const slack = draws.map(d => Math.max(0, d - STUB));
    const room = slack.reduce((n, d) => n + d, 0);
    if (room > 0) draws.forEach((d, i) => { draws[i] = d - spill * (slack[i] / room); });
  }

  let at = 0;
  const arcs = parts.map((s, n) => {
    const draw = draws[n];
    const a = '<circle class="dseg dseg' + (n + 1) + '" cx="88" cy="88" r="' + R +
      '" fill="none" stroke-width="' + SW + '" stroke-linecap="butt"' +
      ' stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '"' +
      ' stroke-dashoffset="' + (-at).toFixed(2) + '"' +
      ' transform="rotate(-90 88 88)" data-i="' + n + '"></circle>';
    if (s.value > 0) at += draw + GAP;
    return a;
  }).join('');

  const svg = '<svg viewBox="0 0 176 176" width="176" height="176" role="img" aria-label="' +
    (o.label || '') + '"><circle class="dtrack" cx="88" cy="88" r="' + R +
    '" fill="none" stroke-width="' + SW + '"/>' + arcs + '</svg>';

  const num = el('div.ringnum', { text: o.middle });
  const lbl = el('div.ringlbl', { text: o.middleLabel });
  const ring = el('div.ring', { html: svg }, [el('div.ringmid', null, [num, lbl])]);

  const legend = el('div.legend', null, parts.map((s, n) => el('div.lrow', {
    'data-i': n, tabindex: '0',
    'aria-label': s.name + ', ' + app.money(s.value) + ', ' + s.share
  }, [
    el('span.lsw.lsw' + (n + 1)),
    el('span.lnm', { text: s.name }),
    el('span.lamt', { text: app.money(s.value) }),
    el('span.lpc', { text: s.share })
  ])));

  const wrap = el('div.donutwrap', null, [ring, legend]);

  /* One listener on the wrapper rather than ten on the pieces, so a redraw
     never leaves an old segment still listening. */
  const segs = () => wrap.querySelectorAll('.dseg');
  const rows = () => wrap.querySelectorAll('.lrow');
  function lift(n) {
    segs().forEach(x => x.classList.toggle('on', +x.dataset.i === n));
    rows().forEach(x => x.classList.toggle('on', +x.dataset.i === n));
    wrap.classList.toggle('lifting', n >= 0);
    const s = n >= 0 ? parts[n] : null;
    num.textContent = s ? app.money(s.value) : o.middle;
    lbl.textContent = s ? s.name : o.middleLabel;
  }
  const over = e => {
    const hit = e.target.closest('.dseg, .lrow');
    lift(hit ? +hit.dataset.i : -1);
  };
  wrap.addEventListener('mousemove', over);
  wrap.addEventListener('focusin', over);
  wrap.addEventListener('mouseleave', () => lift(-1));
  wrap.addEventListener('focusout', () => lift(-1));
  /* Touch has no hover, so a tap does the same job. */
  wrap.addEventListener('click', over);

  return wrap;
}

/* Counting a figure up on its first draw is the small movement every
   competitor uses and the one that actually says something: the number is
   worked out, not typed in. Only on first sight, and only when it changed,
   so nothing re-animates under somebody's hand while they are logging. */
const COUNTED = {};

/* Swapping the whole state out is not a change to a figure, it is a different
   planner. Counting from what was on screen a second ago then runs a brand new
   buyer's first number DOWN from the example's, which is somebody else's money
   and the last thing that should move on the first screen they ever see.
   Everything that counts starts again from nothing instead, so the first
   figure counts UP to what they just told us.
   Anything outside this file that holds a figure between draws registers here,
   because only the thing that owns it can put it back. */
const COUNT_RESETS = [];
function resetOnReplace(fn) { COUNT_RESETS.push(fn); }
function countersFromZero() {
  Object.keys(COUNTED).forEach(k => { COUNTED[k] = 0; });
  COUNT_RESETS.forEach(fn => { try { fn(); } catch (e) {} });
}

function countUp(node, app, value, key) {
  const from = COUNTED[key];
  COUNTED[key] = value;
  const settle = () => { node.textContent = app.money(value); };
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || document.hidden;
  if (from === undefined || still || Math.abs(value - from) < 0.005) { settle(); return node; }

  const start = performance.now();
  const run = now => {
    const t = Math.max(0, Math.min(1, (now - start) / 420));
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = app.money(from + (value - from) * eased);
    if (t < 1 && node.isConnected) requestAnimationFrame(run); else settle();
  };
  settle();
  requestAnimationFrame(run);
  setTimeout(settle, 460);
  return node;
}

/* Today has been answered, either way: something logged, or "Nothing today"
   pressed. Saying nothing went out is as complete an answer as logging a spend.
   One function, because two places on the Today page ask this question and they
   used to answer it differently: the three things and the Start here step both
   read the state, while the one thing band ran on a flag of its own and went on
   asking for a spend that was already logged. */
function dayAnswered(s, t) {
  const iso = toISO(t || today());
  return s.noSpend === iso || (s.spends || []).some(x => x.date === iso);
}

/* Three small things. Rebuilt each day from what is actually true, so it is
   never a to-do list that grows: three things, each a few seconds, and when
   they are done they are done. Nothing is scored and nothing carries over. */
function threeThings(app) {
  const s = app.state;
  const t = today();
  const iso = toISO(t);
  const b = safeToSpend(s, t);
  const done = (s.threeThings && s.threeThings.date === iso) ? s.threeThings.done || {} : {};

  const out = [];

  /* Anything that fell due and has not been marked paid. */
  const justDue = s.bills.filter(x => !x.paused &&
    occurrences(x.due, x.freq, addDays(t, -3), addDays(t, 1)).length);
  if (justDue.length) {
    out.push({ id: 'bill', secs: '10 sec',
      /* The window reaches three days back and one day forward, so all three
         tenses turn up here. Saying "it was due" on the day it is due reads as
         being late; saying "it is due Tue 10 Nov" on the Wednesday is just
         wrong. Each case gets its own words. */
      text: (function () {
        const on = nextOn(justDue[0].due, justDue[0].freq, addDays(t, -3));
        const when = toISO(on) === iso ? 'It is due today.'
          : toISO(on) < iso ? 'It was due ' + fmtDay(on) + '.'
          : 'It is due ' + fmtDay(on) + '.';
        return 'Check your ' + justDue[0].name + ' bill went out. ' + when;
      })(),
      go: 'bills', doLabel: 'Open bills' });
  }

  const toldUs = dayAnswered(s, t);
  out.push({ id: 'log', secs: '30 sec',
    text: toldUs ? 'Today is written down' : 'Log anything you spent today',
    go: 'log', doLabel: toldUs ? null : 'Log it',
    run: function (a) { openLogBox(a); } });

  if (everydayBalance(s) <= 0) {
    out.push({ id: 'balance', secs: '1 min', text: 'Put in what is in your account',
      go: 'settings', doLabel: 'Open settings' });
  } else if ((s.parked || []).filter(p => Date.now() - p.at >= PARK_HOURS * 3600000).length) {
    out.push({ id: 'parked', secs: '20 sec',
      text: 'Something on your waitlist is ready for you to decide',
      go: 'wait-list', doLabel: 'Have a look' });
  } else if (!s.bills.length) {
    out.push({ id: 'bills', secs: '2 min', text: 'Add one bill, the one that worries you most',
      go: 'bills', doLabel: 'Add a bill' });
  } else {
    out.push({ id: 'check', secs: '10 sec',
      text: 'Look at what is left: ' + app.money(b.left) + ' until ' + fmtDay(b.payday), go: 'today' });
  }

  while (out.length < 3) {
    out.push({ id: 'spare' + out.length, secs: '1 min', text: 'Nothing else needs you today',
      go: 'today', doLabel: null });
  }
  return out.slice(0, 3).map(x => Object.assign({}, x, {
    done: x.id === 'log' ? (toldUs || !!done[x.id]) : !!done[x.id]
  }));
}

function tickThing(app, id) {
  const iso = toISO(today());
  app.change(s => {
    const cur = (s.threeThings && s.threeThings.date === iso) ? s.threeThings : { date: iso, done: {} };
    cur.done = Object.assign({}, cur.done, {});
    cur.done[id] = !cur.done[id];
    s.threeThings = cur;
  });
}

/* One modal, used by the welcome and by Log a spend. Escape closes it, the
   backdrop closes it, and focus starts inside it. */
function openModal(title, body, opts) {
  const o = opts || {};
  const back = el('div.sheetback', { onclick: e => { if (e.target === back) close(); } });
  function close() {
    back.remove();
    document.removeEventListener('keydown', esc);
    document.removeEventListener('keydown', trap);
    if (o.onclose) o.onclose();
  }
  function esc(e) { if (e.key === 'Escape') close(); }

  /* aria-modal tells a screen reader the page behind is unavailable. It tells
     the Tab key nothing, so tabbing past the last control walked out from
     under the backdrop and into the forty odd controls still sitting behind
     it, with no way back but shift and tab. The sheet keeps the key now. */
  function trap(e) {
    if (e.key !== 'Tab' || !back.isConnected) return;
    const able = sheet.querySelectorAll(
      'button, input, select, textarea, a[href], [tabindex]:not([tabindex="-1"])');
    const live = Array.prototype.filter.call(able,
      n => !n.disabled && n.getClientRects().length);
    if (!live.length) return;
    const first = live[0], last = live[live.length - 1];
    const on = document.activeElement;
    if (e.shiftKey && (on === first || !sheet.contains(on))) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && (on === last || !sheet.contains(on))) {
      e.preventDefault(); first.focus();
    }
  }

  const sheet = el('div.sheet', { role: 'dialog', 'aria-modal': 'true',
    'aria-label': title, tabindex: '-1' }, [
    el('div.sheettop', null, [
      el('h2', { text: title }),
      o.bare ? null : el('button.x', { type: 'button', 'aria-label': 'Close', text: '×', onclick: close })
    ]),
    body(close)
  ]);
  back.appendChild(sheet);
  document.body.appendChild(back);
  document.addEventListener('keydown', esc);
  document.addEventListener('keydown', trap);
  /* The first field, not the close button: focusing the X drew a ring round it
     that read as a stray border. A modal that is only something to read has no
     field to fall back on, so it takes the focus itself and the ring with it. */
  const first = o.focus === 'self' ? sheet
    : (sheet.querySelector('input,select') || sheet.querySelector('button'));
  if (first) first.focus();
  return close;
}

/* What a logged spend is called, and what goes under it. Logging from the
   Envelopes screen names the spend after the envelope, so printing both gave
   "Grocery" twice over; picking an envelope in the log box with no note of its
   own gave the useless "Spent" over "Grocery". The envelope name is only worth
   a second line when it says something the first line does not. */
function spendName(state, x) {
  const env = x.env ? ((state.envelopes || []).filter(e => e.id === x.env)[0] || {}).name : null;
  const note = (x.note || '').trim();
  if (!note) return { title: env || 'Spent', foot: null };
  if (env && env.toLowerCase() === note.toLowerCase()) return { title: note, foot: null };
  return { title: note, foot: env };
}

/* Everything one spend can be found by: what was typed into it, and what the
   screen prints about it. Somebody looking for the row that says $4.80 types
   $4.80, not the 4.8 that is stored, and somebody looking for Thu 29 Oct does
   not type 2026-10-29. One list, so the log's own box and the magnifying glass
   in the top bar can never disagree about what a word finds. */
function spendHit(app, x, needle) {
  if (!needle) return true;
  const name = spendName(app.state, x);
  const d = parseISO(x.date);
  return [name.title, name.foot, String(x.amount), app.money(x.amount),
    x.date, fmtDay(d), fmtLong(d)]
    .some(v => String(v == null ? '' : v).toLowerCase().indexOf(needle) >= 0);
}

/* Log a spend, reachable from every screen. The thing this app asks people to
   do fifty times a week should never be more than one tap away. */
function openLogBox(app, onDate) {
  openModal('Log a spend', close => {
    const amount = field('How much', { inputmode: 'decimal', placeholder: '0.00' });
    const note = field('What for', { placeholder: 'Optional' });
    /* A spend dated in the future has not happened, so it cannot be picked. */
    const when = field('Which day', { type: 'date', value: onDate || toISO(today()),
      min: toISO(addDays(today(), -1825)), max: toISO(today()) });
    /* The screen that makes these calls them envelopes, so this field does
       too: "Pot" was a second word for the same thing, and "pot" already
       means a bill's sinking fund elsewhere. With none made there is nothing
       to choose, so the field stays away until the first one exists. */
    const env = picker('Envelope (optional)', [{ value: '', label: 'None' }]
      .concat(app.state.envelopes.map(e => ({ value: e.id, label: e.name }))), '');
    if (!app.state.envelopes.length) env.node.hidden = true;
    const msg = el('p.sub.warn');

    const bump = n => () => {
      const now = parseAmount(amount.el.value).value || 0;
      amount.el.value = round2(now + n).toFixed(app.cur.decimals);
    };

    /* Logging a day that is already inside the balance is allowed, because the
       history is worth having, but it must not look as though nothing happened. */
    /* Amber, not grey. A spend dated before the balance was taken changes
       nothing on Today, which looks exactly like the app ignoring you unless
       the reason is impossible to miss and says what to do about it. */
    const warn = el('p.sub.warn');
    const checkDay = () => {
      /* A refusal is about what was in the box when it was pressed, so it has
         to go the moment that changes. It used to sit there: pick a future
         day, be told the log is not for days that have not happened, correct
         the day to last month, and the refusal was still on screen under a
         date in the past, beside the note that actually applied to it. */
      msg.textContent = '';
      warn.textContent = (when.value && app.state.balanceAsOf && when.value < app.state.balanceAsOf)
        ? 'This is before ' + fmtDay(parseISO(app.state.balanceAsOf)) +
          ', the day you last checked your balance, so your balance already has it in. ' +
          'It goes in your log but will not change today\u2019s number. To make it count, ' +
          'put your balance in again on the Settings page with an earlier date.'
        : '';
    };
    when.el.addEventListener('input', checkDay);
    when.el.addEventListener('change', checkDay);
    /* Correcting the amount takes the refusal away too, since it is just as
       likely to be the half that was wrong. */
    amount.el.addEventListener('input', () => { msg.textContent = ''; });
    checkDay();
    /* Start again clears the whole box, not just the amount. Leaving the note
       behind after pressing it meant the next spend went in labelled as the
       last one. */
    const startAgain = () => {
      amount.el.value = '';
      note.el.value = '';
      env.el.value = '';
      when.el.value = onDate || toISO(today());
      checkDay();
      msg.textContent = '';
      amount.el.focus();
    };

    /* Two rows that do different things, so each one says which. These add to
       the amount, a tap at a time, for when you know it was about twelve
       pounds and would rather not type. */
    const keys = el('div', null, [
      el('p.foot.rowlabel', { text: 'Add it up' }),
      el('div.seg', null, [1, 5, 10, 20].map(n =>
        el('button.segbtn', { type: 'button', text: '+' + app.money(n), onclick: bump(n) })
      ).concat([el('button.segbtn', { type: 'button', text: 'Start again', onclick: startAgain })]))
    ]);

    /* These fill the whole thing in at once: the amount and what it was for. */
    const chips = app.quickAdd().length ? el('div', null, [
      el('p.foot.rowlabel', { text: 'Or one you buy often' }),
      el('div.tags', null, app.quickAdd().map(q =>
        el('button.tag', { type: 'button', text: q.label + ' ' + app.money(q.amount), onclick: () => {
          amount.el.value = Number(q.amount).toFixed(app.cur.decimals);
          note.el.value = q.label;
        } })))
    ]) : null;

    const save = () => {
      if (amount.bad) { msg.textContent = 'That does not look like an amount. Try something like 12.50'; return; }
      if (!(amount.number > 0)) { msg.textContent = 'It needs an amount.'; return; }
      /* The log is what has happened, not what might. Opened from a future day
         on the calendar it used to save quietly and then do nothing at all
         until that date came round. */
      if (when.value && when.value > toISO(today())) {
        msg.textContent = 'The log is for money you have already spent, so it cannot be a day ' +
          'that has not happened yet. Something you are planning belongs on the Waitlist page, ' +
          'and something that goes out by itself belongs on the Bills page.';
        return;
      }
      if (app.capped()) { msg.textContent = CONFIG.copy.cappedTitle; return; }
      app.change(s => {
        s.spends.push({ id: uid('x'), date: when.value || toISO(today()),
          amount: amount.number, note: note.value, env: env.value || undefined });
        s.started = Object.assign({}, s.started, { spend: true });
      });
      close();
    };

    return el('div', null, [
      el('div.form', null, el('div.fgrid', null, [amount.node, note.node, when.node, env.node])),
      warn, keys, chips, msg,
      el('div.footrow', { style: 'margin-top:12px' }, [
        el('button.btn.primary', { type: 'button', text: 'Log it', onclick: save }),
        el('button.linky', { type: 'button', text: 'Cancel', onclick: close })
      ])
    ]);
  });
}

/* Search, across the whole planner. It used to look only at logged spends,
   which is not what a magnifying glass promises: somebody typing "rent" means
   the bill, and somebody typing "goals" means the screen. Everything the
   person has typed into this planner is searchable, plus the screens
   themselves, and picking a result takes you to where that thing lives. */
function searchEverything(app, needle) {
  const s = app.state;
  const q = String(needle || '').trim().toLowerCase();
  if (!q) return [];
  const hit = v => String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0;
  const out = [];
  const add = (group, name, side, go, run) =>
    out.push({ group: group, name: name, side: side, go: go, run: run });

  /* Screens first: the shortest path to "where is the thing that does X". */
  app.visibleScreens().forEach(sc => {
    if (hit(sc.label)) add('Screen', sc.label, 'Go there', sc.id);
  });

  s.bills.forEach(b => {
    if (hit(b.name)) add('Bill', b.name, app.money(b.amount), 'bills');
  });
  s.goals.forEach(g => {
    if (hit(g.name)) add('Goal', g.name, app.money(g.saved) + ' of ' + app.money(g.target), 'goals');
  });
  (s.debts || []).forEach(d => {
    if (hit(d.name)) add('Debt', d.name, app.money(d.balance), 'debt');
  });
  (s.envelopes || []).forEach(e => {
    if (hit(e.name)) add('Envelope', e.name, app.money(e.perStretch) + ' a pay period', 'envelopes');
  });
  (s.incomes || []).forEach(i => {
    if (hit(i.name)) add('Money in', i.name, app.money(i.amount), 'money-in');
  });
  (s.accounts || []).forEach(a => {
    if (hit(a.name)) add('Account', a.name, app.money(a.balance), 'accounts');
  });
  (s.parked || []).forEach(p => {
    if (hit(p.label)) add('Waitlist', p.label, app.money(p.amount), 'wait-list');
  });
  (s.notes || []).forEach(n => {
    if (hit(n.text)) add('Brain dump', n.text, n.done ? 'Done' : '', 'brain-dump');
  });

  /* Spends last and capped: there are more of them than everything else put
     together, and one search should not bury a bill under forty coffees. */
  const spends = s.spends.filter(x => spendHit(app, x, q))
    .sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
  spends.slice(0, 6).forEach(x => {
    add('Spend', spendName(s, x).title, app.money(x.amount) + ' · ' + fmtDay(parseISO(x.date)), 'log',
      () => { app.find = needle; app.focusSearch = true; });
  });
  if (spends.length > 6) {
    add('Spend', 'All ' + spends.length + ' matching spends', 'Open the log', 'log',
      () => { app.find = needle; app.focusSearch = true; });
  }
  return out;
}

function openSearch(app) {
  openModal('Search', close => {
    const box = el('input.fi', { type: 'search', placeholder: 'A bill, a goal, a page, anything you logged',
      'aria-label': 'Search the whole planner', value: app.find || '' });
    const results = el('div.rows.searchrows');
    const note = el('p.sub', { style: 'margin-top:10px' });
    let picked = [];

    function pick(r) {
      close();
      if (r.run) r.run();
      app.go(r.go);
    }

    function draw() {
      picked = searchEverything(app, box.value);
      results.innerHTML = '';
      if (!box.value.trim()) {
        note.textContent = 'Type a word. Bills, goals, debts, envelopes, money in, accounts, the waitlist, your brain dump, every spend, and the pages themselves.';
        return;
      }
      if (!picked.length) {
        note.textContent = 'Nothing matches that.';
        return;
      }
      note.textContent = picked.length === 1 ? '1 match. Press Enter to open it.'
        : picked.length + ' matches. Press Enter for the first one.';
      picked.forEach(r => results.appendChild(
        el('button.row.searchrow', { type: 'button', onclick: () => pick(r) }, [
          el('span.chip', { text: r.group }),
          el('span.nm', { text: r.name }),
          r.side ? el('span.amt', { text: r.side }) : null
        ])));
    }

    box.addEventListener('input', draw);
    box.addEventListener('keydown', e => {
      if (e.key === 'Enter' && picked.length) { e.preventDefault(); pick(picked[0]); }
    });
    draw();
    requestAnimationFrame(() => { box.focus(); box.select(); });
    setTimeout(() => { box.focus(); box.select(); }, 0);

    return el('div', null, [
      el('div.form', { style: 'margin-top:0' }, box),
      note,
      results
    ]);
  });
}

/* Shown once, over the example numbers, never over an empty screen. Skipping
   is a real choice: the example is a working planner on its own. */
/* Numbers somebody actually put in, as opposed to the example everyone starts
   on. Used to decide whether anything is at risk of being written over. */
function hasRealNumbers(s) {
  if (!s || s.example) return false;
  return ((s.bills || []).length + (s.spends || []).length + (s.goals || []).length) > 0;
}

function maybeWelcome(app) {
  /* Never over a planner somebody has already filled in. The review switch
     below used to bring this box back on every single open, and one tap on
     "Use my numbers" wiped the lot. */
  if (hasRealNumbers(app.state)) return;
  /* alwaysWelcome is a review switch, not a feature. The build warns while it
     is on, because shipping it would show the box on every single open. */
  if (app.state.seenWelcome && !CONFIG.alwaysWelcome) return;
  app.change(s => { s.seenWelcome = true; }, { quiet: true });
  openModal('Start with your own numbers', close => {
    const name = field('Your name', { placeholder: 'Your name' });
    const cur = picker('Currency', CURRENCIES.map(c => ({ value: c.code, label: c.label + ' (' + c.symbol.trim() + ')' })), app.cur.code);
    /* The pay is the only answer the planner cannot work without: with it
       empty the box used to close happily onto a screen of zeros, which is
       the one thing this product promised never to open on. */
    const pay = field('How much you are paid', { inputmode: 'decimal', placeholder: '0.00' });
    pay.el.required = true;
    pay.el.addEventListener('input', () => pay.el.classList.remove('bad'));
    /* The balance was the one field marked Optional, and it is the one every
       figure is worked out from: pay only sets how long the stretch is. Filled
       in without it, the box closed onto a hero of 0.00 under a pill reading
       "On track", which is the exact thing the pay being required is there to
       prevent. Both are required now. */
    const bal = field('How much is in your account now', { inputmode: 'decimal', placeholder: '0.00' });
    bal.el.required = true;
    bal.el.addEventListener('input', () => bal.el.classList.remove('bad'));
    const freq = picker('How often you are paid', FREQS.filter(f => f.value !== 'once'), 'week:2');
    const when = field('Your next payday', { type: 'date', value: toISO(addDays(today(), 14)),
      min: toISO(today()), max: toISO(addDays(today(), 730)) });

    const msg = el('p.sub.warn');
    let asked = false;

    const finish = () => {
      if (!(pay.number > 0)) {
        msg.textContent = 'Put in how much you are paid first. Without it every figure is zero. ' +
          'If you would rather look around first, use the example instead.';
        pay.el.classList.add('bad');
        pay.el.focus();
        return;
      }
      /* Filled in, not over zero. Requiring a figure ABOVE zero refused the one
         truthful answer a buyer with an empty account can give, and refused it
         with a sentence telling them to put in what is in their main account,
         which is exactly what they had just done. There was no way past the box
         but typing a balance they do not have. An empty box has not been
         answered; a zero has, and this planner is bought by people at the end of
         the money more often than at the start of it. */
      if (!bal.value) {
        msg.textContent = 'Put in what is in your main account too. Today’s number is ' +
          'worked out from it, so without it everything reads zero.';
        bal.el.classList.add('bad');
        bal.el.focus();
        return;
      }
      if (bal.bad) {
        msg.textContent = amountNote(parseAmount(bal.el.value));
        bal.el.classList.add('bad');
        bal.el.focus();
        return;
      }
      if (hasRealNumbers(app.state) && !asked) {
        asked = true;
        msg.textContent = 'This clears the numbers already in the planner. Press it again to go ahead, or close this box to keep them.';
        return;
      }
      const next = blankState();
      next.name = name.value;
      next.currency = CURRENCIES.filter(c => c.code === cur.value)[0] || next.currency;
      next.pay = { amount: pay.number, freq: valueToFreq(freq.value), anchor: when.value || next.pay.anchor };
      next.accounts[0].balance = bal.number;
      next.seenWelcome = true;
      next.theme = app.state.theme;
      next.started = { pay: pay.number > 0, balance: bal.number > 0 };
      app.replace(next);
      close();
    };

    return el('div', null, [
      el('p.sub', { text: 'Fill this in and you will see what is safe to spend today. Nothing is sent anywhere, and you can do it later instead.' }),
      el('div.form', null, el('div.fgrid', null, [name.node, cur.node, pay.node, freq.node, when.node, bal.node])),
      msg,
      el('div.modalfoot', null, [
        el('button.btn.primary', { type: 'button', text: 'Use these numbers', onclick: finish }),
        /* It said "show me the example" and then showed whatever was already
           there, which after a day or two is a stale example. It now builds a
           fresh one, unless there are real numbers it would throw away. */
        el('button.quiet', { type: 'button', text: 'Show me the example instead', onclick: () => {
          if (!hasRealNumbers(app.state)) app.replace(exampleState());
          close();
        } })
      ])
    ]);
  }, { bare: false });
}

/* A screen that is listed but not built yet. It says so plainly rather than
