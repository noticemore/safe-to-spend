/* Four numbers for the stretch, so the page answers the second question too:
   not just what is safe today, but where the money went. */
function statTiles(app, b) {
  const s = app.state;
  const t = today();
  const spentThis = round2(s.spends
    .filter(x => parseISO(x.date) >= b.start && parseISO(x.date) <= t)
    .reduce((n, x) => n + x.amount, 0));

  /* What actually landed since the last payday, not the next paycheck plus
     whatever is still to come, which is what this used to add up. */
  const landed = round2((s.incomes || []).reduce((n, i) =>
    n + occurrences(i.date, i.freq || null, b.start, addDays(t, 1)).length * i.amount, 0));
  const cameIn = round2(s.pay.amount + landed);

  /* The whole stretch, not just what is still ahead: see billsThisStretch. */
  const billsAll = billsThisStretch(app, b);
  /* Which leaves this tile and the "Bills before payday" row in the panel
     above showing two different figures under the same word. Both are right
     and both are labelled, but a buyer meeting them a second apart deserves
     the one sentence that joins them up. */
  const billsGone = round2(billsAll - b.working.billsOut - b.working.heldOut);
  /* This left out goalsOut, the contribution going to goals this payday, while
     the working panel and the donut both counted it. One screen, one word,
     two different numbers. Money already in a goal and money about to go into
     one are both held back, so both belong here. */
  const aside = round2(b.working.potsOut + b.working.goalPotsOut + b.working.goalsOut);
  const share = n => cameIn > 0 ? Math.round(n / cameIn * 100) : 0;
  /* Same rule as the donut: a real amount never reads "0% of what came in". */
  const of = n => cameIn <= 0 ? 'Nothing came in yet'
    : (n > 0 && share(n) <= 0) ? 'under 1% of what came in'
    : share(n) + '% of what came in';

  const tiles = [
    { k: 'Came in', icon: 'money-in', v: cameIn, note: 'Since your last payday', part: 1 },
    { k: 'Bills', icon: 'bills', v: billsAll, part: share(billsAll) / 100,
      note: billsGone > 0 ? of(billsAll) + ', ' + app.money(billsGone) + ' already out'
        : of(billsAll) },
    /* Pots build up over months, so a share of one month's pay would read as
       nonsense. This one says what it is instead. */
    /* Not "Set aside": the card further down the page carries that caption for
       the money already put by, and this tile counts the goal money going in on
       payday as well, so the two were $40 apart under one word. This is
       everything kept out of what can be spent before payday. */
    { k: 'Held back this payday', icon: 'savings', v: aside,
      note: 'For ' + asideParts(b.working).forWhat, part: share(aside) / 100 },
    { k: 'Spent', icon: 'log', v: spentThis, note: of(spentThis), part: share(spentThis) / 100 }
  ];

  return el('div.tiles.dimmable', null, tiles.map(x => el('div.tile', null, [
    el('div.tilehead', null, [
      el('span.tileicon', { html: navIcon(x.icon) }),
      /* The tile already wears its own icon beside the label, so the caption
         must not fetch a second one. */
      el('div.cap', { text: x.k })
    ]),
    countUp(el('div.tilenum'), app, x.v, 'tile:' + x.k),
    /* A third of a percent rounds to no width at all, so a tile reading
       "Set aside 10.00" drew an empty track and said the opposite of its own
       number. Same six pixel floor barList already uses: a real amount always
       shows something. */
    el('div.tilebar', null, el('i', {
      style: x.v > 0
        ? 'width:' + Math.max(0, Math.min(100, Math.round(x.part * 100))) + '%;min-width:6px'
        : 'width:0' })),
    el('span.foot', { text: x.note })
  ])));
}

/* Back after a while. One card that says what changed, instead of a week of
   missed days to scroll through. Nobody else on this keyword does it. */
function awayCard(app, b) {
  if (!AWAY_SINCE) return null;
  const gap = daysBetween(parseISO(AWAY_SINCE), today());
  if (gap < 3) return null;

  const since = parseISO(AWAY_SINCE);
  /* In date order, oldest first. Walking state.bills gave storage order, so
     three dates came out shuffled and the one dropped by the slice was
     whichever happened to be fourth in the list rather than the newest. */
  const fell = [];
  app.state.bills.forEach(x => {
    if (x.paused) return;
    occurrences(x.due, x.freq, since, today()).forEach(on => fell.push({ on: on, name: x.name }));
  });
  fell.sort((a, c) => a.on - c.on);
  const paid = fell.map(x => x.name + ' on ' + fmtDay(x.on));
  const logged = app.state.spends.filter(x => parseISO(x.date) >= since).length;

  return el('div.card.away', null, [
    capIcon('calendar', 'While you were away'),
    el('p.sub', { style: 'margin-top:10px', html:
      'It has been <b>' + gap + ' days</b>. Nothing broke, and nothing is waiting to be caught up.' }),
    paid.length ? el('p.sub', { style: 'margin-top:8px', text:
      'Due in that time: ' + paid.slice(0, 3).join(', ') + (paid.length > 3 ? ', and ' + (paid.length - 3) + ' more' : '') + '.' }) : null,
    el('p.sub', { style: 'margin-top:8px', html:
      'Today you have <b>' + app.money(b.safe) + '</b>' + (logged ? '' : ', worked out from where things actually stand') + '.' }),
    el('div.footrow', null, [
      el('button.btn.primary', { type: 'button', text: 'Got it', onclick: () =>
        app.change(s => { s.lastOpened = toISO(today()); AWAY_RESET(); }) }),
      el('button.linky', { type: 'button', text: 'Update your balance', onclick: () => app.go('settings') })
    ])
  ]);
}

/* Log. Everything you have ever put in, newest first, searchable and editable.
   Today only ever showed today, which made a mistake from Tuesday unfixable. */
const logScreen = {
  id: 'log',
  label: 'Log',
  view(app) {
    const s = app.state;
    const find = el('input.fi.logsearch', {
      type: 'search', placeholder: 'Search what you logged', 'aria-label': 'Search what you logged',
      value: app.find || ''
    });
    const list = el('div.rows.logrows');

    function draw() {
      /* Trimmed, because a trailing space off a keyboard suggestion used to
         answer "Nothing matches that." The top bar search always trimmed. */
      const needle = String(find.value || '').trim().toLowerCase();
      const rows = s.spends.slice().sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0)
        .filter(x => spendHit(app, x, needle));
      list.innerHTML = '';
      if (!rows.length) {
        list.appendChild(el('p.sub', { text: needle ? 'Nothing matches that.' : 'Nothing logged yet. Use the Log a spend button above to add your first one.' }));
        return;
      }
      let day = null;
      rows.forEach(x => {
        if (x.date !== day) {
          day = x.date;
          /* The rows being drawn, not the whole day. With a search on, this
             heading used to carry spends that were not on the screen. */
          const sum = rows.filter(y => y.date === day).reduce((t, y) => t + y.amount, 0);
          list.appendChild(el('div.daybar', null, [
            el('span', { text: fmtDay(parseISO(day)) }),
            el('span.amt', { text: app.money(round2(sum)) })
          ]));
        }
        const nm = spendName(s, x);
        /* Nothing in the app can make one: the log box is capped at today. It
           arrives from a restored backup or a clock that was wrong, sorts
           straight to the top of this list, and said nothing about itself.
           The engine is already right about it and keeps it out of every
           figure on the Today page. */
        const ahead = x.date > toISO(today());
        const foot = [nm.foot, ahead ? 'dated ahead, so it has not happened yet' : null]
          .filter(Boolean).join(', ');
        list.appendChild(el('div.row', null, [
          el('span.nm', null, [
            el('span.nmline', { text: nm.title }),
            foot ? el('span.foot', { text: foot }) : null
          ]),
          el('span.amt', { text: app.money(x.amount) }),
          el('button.linky.rowx', { type: 'button', text: 'Remove', onclick: () => app.removeSpend(x.id) })
        ]));
      });
    }
    find.addEventListener('input', () => { app.find = find.value; draw(); });
    draw();

    const days = s.spends.length
      ? (new Set(s.spends.map(x => x.date))).size : 0;

    /* Asked for from the magnifying glass in the top bar. Honoured on every
       draw of this screen until it is used, so a redraw cannot swallow it. */
    if (app.focusSearch) {
      /* Asked for by the magnifying glass in the top bar. Going to a screen
         draws it more than once, so this looks up whatever search box is in
         the page at the time rather than holding on to the one this draw
         made, and the flag stays up until a box is actually found. A timer
         alone used to lose the race and leave the cursor nowhere. */
      const grab = () => {
        if (!app.focusSearch) return;
        const box = document.querySelector('.logsearch');
        if (!box) return;
        app.focusSearch = false;
        box.focus();
        box.select();
      };
      requestAnimationFrame(grab);
      setTimeout(grab, 0);
    }

    return el('div.log', null, [
      screenTop(app, 'Log', 'Everything you have put in, newest first.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            /* Arriving here from "Log one spend" and finding only a search
               box is a dead end. The button that does the thing this screen
               is about belongs on the screen, not only in the sidebar. */
            el('div.logtop', null, [
              el('div.form', { style: 'margin-top:0;flex:1;min-width:0' }, el('div.fgrid', null, find)),
              el('button.btn.primary', { type: 'button', text: '+ Log a spend',
                onclick: () => openLogBox(app) })
            ]),
            list
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            helpCap('What is counted here', 'Only what you have typed in. Bills are not here, they are on the Bills page.'),
            el('div.rows', { style: 'margin-top:6px' }, [
              el('div.row', null, [el('span.nm', { text: 'Things logged' }), el('span.amt', { text: String(s.spends.length) })]),
              el('div.row', null, [el('span.nm', { text: 'Days you logged something' }), el('span.amt', { text: String(days) })])
            ])
          ]),
          el('div.card', null, [
            capIcon(null, 'Fixing something'),
            el('p.sub', { style: 'margin-top:8px', text: 'Remove takes a spend out of the log straight away. The undo arrow at the top right puts it back.' })
          ])
        ])
      ])
    ]);
  }
};

/* Calendar. A month at a glance: what is due, what you spent, where payday is. */

/* Everything landing on one day: the regular pay, and anything added on Money
   in. A day flagged Payday that opened to "nothing" was the commonest thing
   people clicked, and the one thing the panel never said. */
function landingOn(state, day) {
  const out = [];
  const nextDay = addDays(day, 1);
  if (state.pay && state.pay.anchor &&
      occurrences(state.pay.anchor, state.pay.freq, day, nextDay).length) {
    out.push({ name: 'Your pay', amount: state.pay.amount || 0, isPay: true });
  }
  (state.incomes || []).forEach(i => {
    if (occurrences(i.date, i.freq || null, day, nextDay).length) {
      out.push({ name: i.name, amount: i.amount, isPay: !!i.isPay });
    }
  });
  return out;
}
/* A day cell is 43px wide on a 390px phone and 33px on a 320px one, and
   "Payday" is 45px of chip, so the cell cut it to "Payda". Both words go into
   the markup and the stylesheet picks one, rather than anything measuring
   anything while the month is being drawn. */
function payChip(full, short) {
  return el('span.cal-pay', null, [
    el('span.cw-long', { text: full }),
    el('span.cw-short', { text: short })
  ]);
}

const calendarScreen = {
  id: 'calendar',
  label: 'Calendar',
  view(app) {
    const s = app.state;
    const t = today();
    const base = app.month ? parseISO(app.month) : new Date(t.getFullYear(), t.getMonth(), 1);
    const first = new Date(base.getFullYear(), base.getMonth(), 1);
    const last = new Date(base.getFullYear(), base.getMonth() + 1, 0);
    const payday = paydayFor(s, addDays(t, 1));

    const cells = [];
    /* Monday first, which is how a pay week is lived. */
    const lead = (first.getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) cells.push(el('div.cal-empty'));

    for (let d = 1; d <= last.getDate(); d++) {
      const day = new Date(first.getFullYear(), first.getMonth(), d);
      const iso = toISO(day);
      const spent = round2(s.spends.filter(x => x.date === iso).reduce((n, x) => n + x.amount, 0));
      const dueToday = [];
      s.bills.forEach(b => {
        if (b.paused) return;
        if (occurrences(b.due, b.freq, day, addDays(day, 1)).length) dueToday.push(b);
      });
      const landing = landingOn(s, day);
      const isPay = toISO(payday) === iso || landing.some(x => x.isPay);

      /* Anything before the day the balance was taken is already inside that
         balance, so logging it changes nothing on Today. The day says so
         rather than letting somebody find out by it not working. */
      const settled = s.balanceAsOf && iso < s.balanceAsOf;
      cells.push(el('button.cal-day' + (iso === toISO(t) ? '.istoday' : '') +
        (settled ? '.settled' : '') +
        (app.day === iso ? '.picked' : ''), {
        type: 'button',
        'aria-label': fmtDay(day) + (settled ? ', anything spent on this day is already inside your balance' : ''),
        /* It used to open "Already inside the balance you put in on ...", with
           nothing saying WHAT was already inside it. */
        title: settled ? 'Anything you spent on this day is already inside the balance you last ' +
          'checked on ' + fmtDay(parseISO(s.balanceAsOf)) +
          ', so logging it here will not change today\u2019s number.' : null,
        onclick: () => { app.day = app.day === iso ? null : iso; app.render(); }
      }, [
        el('span.cal-n', { text: String(d) }),
        isPay ? payChip('Payday', 'Pay')
          : landing.length ? payChip('Money in', 'In') : null,
        dueToday.length ? el('span.cal-bill', {
          text: dueToday.length === 1 ? dueToday[0].name : dueToday.length + ' bills',
          title: dueToday.map(b => b.name + ' ' + app.money(b.amount)).join(', ')
        }) : null,
        spent > 0 ? el('span.cal-spent', { text: app.money(spent) }) : null
      ]));
    }

    const step = n => () => {
      app.month = toISO(new Date(first.getFullYear(), first.getMonth() + n, 1));
      app.render();
    };

    const monthSpent = round2(s.spends.filter(x => parseISO(x.date) >= first && parseISO(x.date) <= last)
      .reduce((n, x) => n + x.amount, 0));

    return el('div.calendar', null, [
      screenTop(app, 'Calendar', 'What is due, what you spent, and where payday falls.'),
      el('div.card', null, [
        el('div.calhead', null, [
          el('button.btn', { type: 'button', text: '‹', 'aria-label': 'Month before', onclick: step(-1) }),
          el('div.calmonth', { text: first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) }),
          el('button.btn', { type: 'button', text: '›', 'aria-label': 'Month after', onclick: step(1) })
        ]),
        el('div.cal-names', null, ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
          .map(n => el('span', { text: n }))),
        el('div.cal-grid', null, cells),
        el('p.sub', { style: 'margin-top:12px', html:
          'Logged in this month: <b>' + app.money(monthSpent) + '</b>' }),
        /* Only ever shown where the dots are, which is the narrow layout. */
        el('p.foot.calkey', { style: 'margin-top:6px', text:
          'A grey dot means a bill is due that day. An amber dot means you logged ' +
          'money that day. Tap a day to see both in full.' })
      ]),
      app.day ? dayPanel(app, parseISO(app.day)) : null
    ]);
  }
};

/* Tapping a day opens it: what went out, what is due, and a way to add to it. */
function dayPanel(app, day) {
  const s = app.state;
  const iso = toISO(day);
  const spends = s.spends.filter(x => x.date === iso);
  const due = [];
  s.bills.forEach(b => {
    if (b.paused) return;
    if (occurrences(b.due, b.freq, day, addDays(day, 1)).length) due.push(b);
  });
  const total = round2(spends.reduce((n, x) => n + x.amount, 0));
  const landing = landingOn(s, day);

  return el('div.card', null, [
    el('div.m-top', null, [
      capIcon(null, fmtLong(day)),
      el('button.linky', { type: 'button', text: 'Close',
        onclick: () => { app.day = null; app.render(); } })
    ]),
    landing.length ? el('div.rows', null, landing.map(x => el('div.row', null, [
      el('span.nm', null, [
        el('span.nmline', { text: x.name }),
        el('span.foot', { text: x.isPay ? 'Payday' : 'Money in' })
      ]),
      el('span.amt', { text: '+ ' + app.money(x.amount) })
    ]))) : null,
    due.length ? el('div.rows', null, due.map(b => el('div.row', null, [
      el('span.nm', { text: b.name + ', due' }),
      el('span.amt', { text: app.money(b.amount) })
    ]))) : null,
    /* "Nothing logged on this day" is a statement about the past. On a day
       that has not arrived, nothing could have been logged; what is worth
       saying is whether anything is due. */
    spends.length
      ? el('div.rows', null, spends.map(x => el('div.row', null, [
          el('span.nm', { text: spendName(s, x).title }),
          el('span.amt', { text: app.money(x.amount) }),
          el('button.linky.rowx', { type: 'button', text: 'Remove', onclick: () => app.removeSpend(x.id) })
        ])))
      : (iso > toISO(today())
          ? (due.length || landing.length ? null : el('p.sub', { text: 'Nothing due on this day.' }))
          : el('p.sub', { text: 'Nothing logged on this day.' })),
    spends.length ? el('p.sub', { style: 'margin-top:11px', html: '<b>' + app.money(total) + '</b> in total.' }) : null,
    (app.state.balanceAsOf && iso < app.state.balanceAsOf)
      ? el('p.sub.warn', { text: 'This day is already inside the balance you last checked on ' +
          fmtDay(parseISO(app.state.balanceAsOf)) +
          '. Anything added here goes in your log but will not change today\u2019s number.' })
      : null,
    iso > toISO(today())
      ? el('div.footrow', null, [
          el('span.sub', { text: 'This day has not happened yet.' }),
          el('button.btn', { type: 'button', text: 'Park something',
            onclick: () => app.go('wait-list') }),
          el('button.btn', { type: 'button', text: 'Add a bill',
            onclick: () => app.go('bills') })
        ])
      : el('div.footrow', null,
          el('button.btn.primary', { type: 'button', text: 'Add something to this day',
            onclick: () => openLogBox(app, iso) }))
  ]);
}

/* The month on one page. The Calendar shows days; this one adds them up, so
   "how did this month go" is answered without counting anything by hand.
   Competitors put this second in the list, and it is the one view we lacked. */
const monthScreen = {
  id: 'month',
  label: 'Month',
  view(app) {
    const s = app.state;
    const t = today();
    const back = app.monthBack || 0;
    const first = new Date(t.getFullYear(), t.getMonth() - back, 1);
    /* There is nothing behind the oldest thing in the planner but empty months,
       and the arrow used to step into them for ever. */
    const oldest = earliestDay(s);
    const atOldest = first <= new Date(oldest.getFullYear(), oldest.getMonth(), 1);
    const next = new Date(first.getFullYear(), first.getMonth() + 1, 1);
    const last = addDays(next, -1);
    const name = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const inThis = d => d >= first && d < next;

    /* Everything landing in the month: the regular pay plus anything else. */
    const paydays = occurrences(s.pay.anchor, s.pay.freq, first, next);
    const extras = [];
    (s.incomes || []).forEach(i => {
      occurrences(i.date, i.freq || null, first, next)
        .forEach(on => extras.push({ name: i.name, amount: i.amount, on: on }));
    });
    const inTotal = round2(paydays.length * (s.pay.amount || 0) +
      extras.reduce((n, x) => n + x.amount, 0));

    /* Bills falling due in the month, whichever account pays them. */
    const billRows = [];
    const accounts = s.accounts || [];
    (s.bills || []).forEach(b => {
      if (b.paused) return;
      /* The month counts every bill, whichever account pays it. Today counts
         only the everyday ones, so the two screens disagree unless this one
         says which part is not everyday money. */
      const mine = fromEveryday(s, b);
      const where = (accounts.filter(a => a.id === b.account)[0] || {}).name || 'another account';
      occurrences(b.due, b.freq, first, next)
        .forEach(on => billRows.push({ name: b.name, amount: b.amount, on: on,
          elsewhere: mine ? null : where }));
    });
    billRows.sort((a, b) => a.on - b.on);
    const billTotal = round2(billRows.reduce((n, x) => n + x.amount, 0));
    const otherAcc = {};
    billRows.forEach(x => { if (x.elsewhere) otherAcc[x.elsewhere] = round2((otherAcc[x.elsewhere] || 0) + x.amount); });
    const otherNames = Object.keys(otherAcc);

    const spends = (s.spends || []).filter(x => inThis(parseISO(x.date)));
    const spentTotal = round2(spends.reduce((n, x) => n + x.amount, 0));
    const over = round2(inTotal - billTotal - spentTotal);
    const done = last < t;
    const soFar = done ? last : t;
    const daysIn = daysBetween(first, next);
    const daysSoFar = Math.max(1, Math.min(daysIn, daysBetween(first, soFar) + 1));

    /* Where it went, grouped the same way Insights groups it. */
    const buckets = {};
    spends.forEach(x => {
      const nm = x.env ? (s.envelopes.filter(e => e.id === x.env)[0] || {}).name || 'Other'
        : 'Not in an envelope';
      buckets[nm] = round2((buckets[nm] || 0) + x.amount);
    });
    const where = Object.keys(buckets).map(k => ({ name: k, value: buckets[k] }))
      .sort((a, c) => c.value - a.value);

    /* One bar per day of the month, so a heavy week is visible at a glance. */
    const days = [];
    for (let i = 0; i < daysIn; i++) {
      const d = addDays(first, i);
      days.push({
        value: d <= t ? spentOn(s, d) : 0,
        full: fmtLong(d), short: String(d.getDate()),
        highlight: toISO(d) === toISO(t)
      });
    }

    const tiles = [
      { k: 'Came in', icon: 'money-in', v: inTotal,
        note: paydays.length + (paydays.length === 1 ? ' payday' : ' paydays') +
          (extras.length ? ' and ' + extras.length + ' more' : '') },
      { k: 'Bills', icon: 'bills', v: billTotal,
        note: billRows.length + (billRows.length === 1 ? ' bill' : ' bills') + ' due' },
      { k: 'Spent', icon: 'log', v: spentTotal,
        note: app.money(round2(spentTotal / daysSoFar)) + (done ? ' a day' : ' a day so far') },
      { k: over < 0 ? 'Short by' : 'Left over', icon: 'savings', v: Math.abs(over),
        note: done ? 'For the whole month' : 'If nothing else changes' }
    ];

    return el('div.month', null, [
      screenTop(app, 'Month', 'Your whole month added up, not just today.'),

      el('div.card.periodbar', null, [
        el('button.btn', { type: 'button', text: '‹', 'aria-label': 'The month before',
          disabled: atOldest ? true : null,
          /* A dead arrow with nothing to say reads as a broken one. */
          title: atOldest ? 'There is nothing in the planner before ' + name : 'The month before',
          onclick: () => { app.monthBack = back + 1; app.render(); } }),
        el('div', null, [
          el('div.periodname', { text: name }),
          el('span.foot', { text: done ? 'Finished' : 'Still going' })
        ]),
        el('button.btn', { type: 'button', text: '›', 'aria-label': 'The month after',
          disabled: back === 0 ? true : null,
          title: back === 0 ? 'This is the month you are in' : 'The month after',
          onclick: () => { app.monthBack = Math.max(0, back - 1); app.render(); } })
      ]),

      el('div.tiles', null, tiles.map(x => el('div.tile', null, [
        el('div.tilehead', null, [
          el('span.tileicon', { html: navIcon(x.icon) }),
          capIcon(null, x.k)
        ]),
        el('div.tilenum', { text: app.money(x.v) }),
        /* Six pixel floor on any real amount, as on the Today tiles: a small
           share rounds to no width and the empty track contradicts the
           figure above it. */
        /* The bar is a share of what came in, so with nothing in there is no
           share to draw. The track went with it: an empty one under a real
           figure contradicts the figure, which is the same reason the floor
           below exists. */
        inTotal > 0
          ? el('div.tilebar', null, el('i', { style: x.v > 0
              ? 'width:' + Math.max(0, Math.min(100, Math.round(x.v / inTotal * 100))) + '%;min-width:6px'
              : 'width:0' }))
          : null,
        el('span.foot', { text: x.note })
      ]))),

      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            helpCap('Spending, day by day', 'Each bar is one day of ' + name + '.' +
              (done ? '' : amberNote(days))),
            /* The average used to live in the chart's dashed line. The line is
               gone, so the sentence carries it. */
            el('p.sub', { style: 'margin:8px 0 4px', html: 'You averaged <b>' +
              app.money(round2(spentTotal / daysSoFar)) + '</b> a day in ' + name + '.' }),
            dayBars(app, days)
          ]),
          el('div.card', null, [
            el('div', { style: 'margin-bottom:6px' }, capIcon(null, 'Where it went')),
            /* Envelopes are optional, so a buyer who never made one would see a
               single full width bar labelled "Not in an envelope", which repeats
               the Spent tile and explains nothing. Point at the feature instead. */
            (where.length === 1 && where[0].name === 'Not in an envelope')
              ? el('div', null, [
                  el('p.sub', { style: 'margin-top:4px', text: s.envelopes.length
                    /* Envelopes already exist, so the thing missing is not an
                       envelope, it is an envelope on the spends themselves. */
                    ? 'You have envelopes, but nothing logged in ' + name + ' was put in one. ' +
                      'Pick an envelope when you log a spend, or log it on the Envelopes ' +
                      'page, and it shows up here.'
                    : 'Everything logged in ' + name + ' is outside an envelope, so there is ' +
                      'nothing to split out here. Envelopes are optional. Make one, put ' +
                      'spends in it, and this card shows what each one took.' }),
                  el('div.footrow', null,
                    el('button.btn', { type: 'button',
                      text: s.envelopes.length ? 'Open Envelopes' : 'Set up envelopes',
                      onclick: () => app.go('envelopes') }))
                ])
              : barList(app, where, { empty: 'Nothing logged in ' + name + (done ? '.' : ' yet.') })
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Bills this month'),
            billRows.length
              ? el('div.rows', { style: 'margin-top:6px' }, billRows.map(x => el('div.row', null, [
                  el('span.chip', { html: chipDate(x.on) }),
                  el('span.nm', null, [
                    el('span.nmline', { text: x.name }),
                    x.elsewhere ? el('span.foot', { text: 'Out of ' + x.elsewhere }) : null
                  ]),
                  el('span.amt', { text: app.money(x.amount) })
                ])))
              : el('p.sub', { text: (done ? 'No bills fell due in ' : 'No bills fall due in ') + name + '.' }),
            otherNames.length
              ? el('p.sub', { style: 'margin-top:11px', text: otherNames.map(k =>
                  app.money(otherAcc[k]) + ' of this comes out of ' + k).join(', ') +
                  ', not your everyday money.' })
              : null
          ]),
          el('div.card', null, [
            capIcon(null, 'How the month adds up'),
            el('div.rows', { style: 'margin-top:10px' }, [
              ['Came in', app.money(inTotal)],
              /* No minus on a zero. A buyer with nothing in the planner yet
                 met "-$0.00" twice on this card. */
              ['Bills due', (billTotal > 0 ? '-' : '') + app.money(billTotal)],
              ['Spent', (spentTotal > 0 ? '-' : '') + app.money(spentTotal)],
              [over < 0 ? 'Short by' : 'Left over', app.money(Math.abs(over))]
            ].map(r => el('div.row', null, [
              el('span.nm', null, el('span.nmline', { text: r[0] })),
              el('span.amt', { text: r[1] })
            ])))
          ])
        ])
      ])
    ]);
  }
};

/* Bills. What is due, when, and what is quietly being saved up for. */
const billsScreen = {
  id: 'bills',
  label: 'Bills',
  view(app) {
    const s = app.state;
    const t = today();
    const b = safeToSpend(s, t);

    const rows = s.bills.slice()
      .sort((x, y) => nextOn(x.due, x.freq, t) - nextOn(y.due, y.freq, t))
      .map(bill => app.editing === bill.id ? billForm(app, bill) : billRow(app, bill, t));

    return el('div.bills', null, [
      screenTop(app, 'Bills', 'Everything that has to be paid, and when.'),
      el('div.cols', null, [
        el('div.col', null, [
          listCard('Your bills', rows, 'No bills yet. Add the ones that come out every month first.'),
          el('div.card', null, [
            capIcon(null, 'Add a bill'),
            billForm(app)
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Due before payday, ' + fmtDay(b.payday)),
            b.working.due.length
              ? el('div.rows', null, b.working.due.map(x => el('div.row', null, [
                  el('span.chip', { html: chipDate(x.on) }),
                  el('span.nm', null, [
                    el('span.nmline', { text: x.name }),
                    /* The engine keeps holding the money back for a one off
                       whose day has gone, and said so only to itself. Without
                       this the row is a date three weeks past under a heading
                       about what is coming. */
                    x.overdue
                      ? el('span.foot', { text: 'Overdue' })
                      : x.saved > 0
                        ? el('span.foot', { text: app.money(x.saved) + ' of it is already saved' })
                        : null
                  ]),
                  el('span.amt', { text: app.money(x.amount) })
                ])))
              : el('p.sub', { text: 'Nothing due between now and payday.' }),
            b.working.elsewhere.length
              ? el('div', { style: 'margin-top:11px' }, b.working.elsewhere.map(x =>
                  el('p.sub', { text: x.name + ', ' + app.money(x.amount) +
                    ', is due too. It comes out of ' + x.account + ', so it is not counted here.' })))
              : null
          ]),
          el('div.card', null, [
            capIcon(null, 'Saving up for'),
            b.working.pots.length || b.working.held.length
              ? el('div.rows', null, b.working.held.map(x => el('div.row', null, [
                  el('span.nm', { text: x.name }),
                  el('span.amt', { text: app.money(x.amount) + ' this time' })
                ])).concat(b.working.pots.map(x => el('div.row', null, [
                  el('span.nm', { text: x.name + ', saved so far' }),
                  el('span.amt', { text: app.money(x.amount) })
                ]))))
              : el('p.sub', { text: b.working.due.some(x => x.saved > 0)
                  ? 'Nothing waiting. The money already saved is shown next to the bill above.'
                  : 'Nothing yet. Add a bill that only comes up every few months and this fills in on its own.' }),
            el('p.sub', { style: 'margin-top:11px', text:
              'A bill that only comes up every few months cannot come out of one payday, so a little is set aside every day instead.' })
          ])
        ])
      ])
    ]);
  }
};

function chipDate(d) {
  return String(d.getDate()).padStart(2, '0') + '<br>' +
    d.toLocaleDateString(undefined, { month: 'short' }).toUpperCase();
}

function billRow(app, bill, t) {
  const on = nextOn(bill.due, bill.freq, t);
  const row = el('div.row.rowtall', null, [
    el('span.chip', { html: chipDate(on) }),
    el('span.nm', null, [
      el('span.nmline', { text: bill.name }),
      /* A one off whose day has gone sorts to the top of this list, so without
         the word it is the first thing on the screen, dated last month, saying
         only "One time only". The engine is still holding the money back. */
      el('span.foot', { text: freqLabel(bill.freq) +
        (bill.paused ? ', paused' : '') +
        (!bill.freq && on < t && !bill.paused ? ', overdue' : '') +
        (bill.pot > 0 && fromEveryday(app.state, bill) ? ', ' + app.money(bill.pot) + ' saved' : '') +
        (bill.account && everyday(app.state) && bill.account !== everyday(app.state).id
          ? ', from ' + ((app.state.accounts.filter(a => a.id === bill.account)[0] || {}).name || 'another account')
          : '') })
    ]),
    el('span.amt', { text: app.money(bill.amount) }),
    el('button.linky.rowx', { type: 'button', text: 'Edit', onclick: () => app.edit(bill.id) })
  ]);
  return row;
}

function billForm(app, bill) {
  const name = field('What is it', { value: bill ? bill.name : '', placeholder: 'Electric' });
  const amount = field('How much', { value: bill ? amountValue(bill.amount, app.cur) : '', inputmode: 'decimal', placeholder: '0.00' });
  const due = field('When is the next one due', {
    type: 'date', value: bill ? bill.due : toISO(addDays(today(), 7)),
    min: toISO(addDays(today(), -1825)), max: toISO(addDays(today(), 3650)) });
  const freq = picker('How often', FREQS, freqToValue(bill ? bill.freq : { unit: 'month', every: 1 }));
  /* With one account there is nothing to pick, so the field only appears once
     a second one exists. The options are plain account names: the old
     "Everyday (your pay lands here)" put an explanation inside an option,
     where it read as part of the name. It is a line under the field now. */
  const acct = picker('Which account it comes out of',
    app.state.accounts.map(a => ({ value: a.id, label: a.name })),
    bill ? bill.account : (everyday(app.state) || {}).id);
  const home = everyday(app.state);
  /* Beside the picker, in the empty half of the row, rather than stacked under
     it where it looked like a message about the thing you just did. */
  const acctNote = home
    ? el('p.fieldaside', { text: home.name + ' is your main account.' })
    : null;
  if (app.state.accounts.length < 2) acct.node.hidden = true;
  const msg = el('p.sub.warn');

  let dupOk = false;
  const save = () => {
    if (!name.value || !(amount.number > 0) || !due.value) {
      msg.textContent = 'It needs a name, an amount and a date.';
      return;
    }
    /* The field declares a min and a max. The form used to ignore them and
       store the date anyway, saying nothing, which is how a one off bill ends
       up dated 1999 and permanently overdue. */
    if (due.el.checkValidity && !due.el.checkValidity()) {
      msg.textContent = 'That date is too far back or too far ahead.';
      return;
    }
    /* Two bills with the same name, amount and date are almost always the
       same bill entered twice, and a doubled bill quietly halves what the
       planner says is safe to spend. Asking once is enough: somebody with two
       identical bills presses the button again. */
    const twin = app.state.bills.filter(x => x.id !== (bill && bill.id) &&
      x.name.trim().toLowerCase() === name.value.trim().toLowerCase() &&
      round2(x.amount) === round2(amount.number) && x.due === due.value);
    if (twin.length && !dupOk) {
      dupOk = true;
      msg.textContent = 'You already have ' + twin[0].name + ' for ' +
        app.money(twin[0].amount) + ' on that date. Press the Add button again if you really have two.';
      return;
    }
    /* Closed before the write, because the write is what redraws the screen. */
    app.editing = null;
    app.change(s => {
      /* Built from scratch, so anything the form does not have a field for has
         to be carried over by hand or Save quietly throws it away. The pot was
         already here; pausing added a second one. */
      const rec = {
        id: bill ? bill.id : uid('b'),
        name: name.value, amount: amount.number, due: due.value,
        freq: valueToFreq(freq.value), account: acct.value,
        pot: bill ? (bill.pot || 0) : 0,
        paused: bill ? !!bill.paused : false
      };
      s.bills = bill ? s.bills.map(x => x.id === bill.id ? rec : x) : s.bills.concat([rec]);
    });
  };

  /* Stopping for a few months is not the same as stopping, and deleting the
     bill was the only way to say it: that threw away the pot with it. */
  const pause = () => {
    app.editing = null;
    app.change(s => {
      s.bills = s.bills.map(x => x.id === bill.id
        ? Object.assign({}, x, { paused: !x.paused }) : x);
    });
  };

  return el('div.form' + (bill ? '.editform' : ''), null, [
    el('div.fgrid', null, [name.node, amount.node, due.node, freq.node, acct.node,
      (acctNote && app.state.accounts.length > 1) ? acctNote : null]),
    bill && bill.paused ? el('p.sub', { style: 'margin:8px 0 0', text:
      'Paused. Nothing is due and nothing more is set aside. ' +
      (bill.pot > 0 ? app.money(bill.pot) + ' already set aside stays set aside.'
        : 'Anything already set aside stays set aside.') }) : null,
    msg,
    el('div.footrow', null, [
      el('button.btn.primary', { type: 'button', text: bill ? 'Save' : 'Add', onclick: save }),
      bill ? el('button.linky', { type: 'button',
        text: bill.paused ? 'Start it again' : 'Pause it', onclick: pause }) : null,
      bill ? el('button.linky', { type: 'button', text: 'Remove', onclick: () => {
        app.editing = null;
        app.change(s => { s.bills = s.bills.filter(x => x.id !== bill.id); });
      } }) : null,
      bill ? el('button.linky', { type: 'button', text: 'Cancel', onclick: () => app.edit(null) }) : null
    ])
  ]);
}

/* Money in. Gets the payday clock right, because every other number hangs off it. */
const moneyInScreen = {
  id: 'money-in',
  label: 'Money in',
  view(app) {
    const s = app.state;
    const t = today();
    const payday = paydayFor(s, addDays(t, 1));
    const days = Math.max(1, daysBetween(t, payday));

    const amount = field('How much you are paid', { value: amountValue(s.pay.amount, app.cur), inputmode: 'decimal', placeholder: '0.00' });
    const anchor = field('Your next payday', { type: 'date', value: s.pay.anchor,
      min: toISO(addDays(today(), -365)), max: toISO(addDays(today(), 730)) });
    const freq = picker('How often you are paid', FREQS.filter(f => f.value !== 'once'), freqToValue(s.pay.freq));
    const msg = el('p.sub.warn');

    const save = () => {
      /* The box says so while it is being typed, and the button used to book it
         as 0 anyway, which is the one number that makes every other figure in
         the planner wrong. */
      if (amount.bad) { msg.textContent = amountNote(parseAmount(amount.el.value)); return; }
      if (!anchor.value) { msg.textContent = 'It needs a date for your next payday.'; return; }
      app.change(st => {
        st.pay = { amount: amount.number, freq: valueToFreq(freq.value), anchor: anchor.value, second: st.pay.second };
      });
    };

    const extras = (s.incomes || []).slice().sort((a, b) => parseISO(a.date) - parseISO(b.date))
      .map(i => el('div.row', null, [
        el('span.chip', { html: chipDate(parseISO(i.date)) }),
        el('span.nm', null, [
          el('span.nmline', { text: i.name }),
          el('span.foot', { text: freqLabel(i.freq) + (i.isPay ? ', counts as a payday' : '') })
        ]),
        el('span.amt', { text: app.money(i.amount) }),
        el('button.linky.rowx', { type: 'button', text: 'Remove',
          onclick: () => app.change(st => { st.incomes = st.incomes.filter(x => x.id !== i.id); }) })
      ]));

    return el('div.moneyin', null, [
      screenTop(app, 'Money in', 'Your pay decides how long your money has to last.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Your pay'),
            el('div.form', null, [
              el('div.fgrid', null, [amount.node, freq.node, anchor.node]),
              msg,
              el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Save', onclick: save }))
            ])
          ]),
          el('div.card', null, [
            capIcon(null, 'The clock right now'),
            /* With no pay saved this card answered the very question the card
               above it is asking, and it answered it with the planner's own
               default fortnight, presented as the buyer's own payday. */
            s.pay.amount > 0

/* Which paycheck pays which bill, for the next few paydays. The month with an
   extra paycheck in it is the one worth knowing about in advance. */
const PAYDAY_ROWS = 3;
const PAYDAY_SCAN = 8;

function paydayHub(app) {
  const s = app.state;
  const t = today();
  const stretches = [];
  const paydays = [];
  let from = t;
  /* The money that pays a bill is the pay that landed BEFORE it, not the one
     that comes after. Labelling each block with the payday at the end of it put
     every bill against the wrong paycheck, one along. The first block is
     special: it is paid out of what is already in the account. */
  let payer = null;
  /* Three rows is about three months out on four-weekly pay, far enough to see
     a bill drift across a payday, short enough that someone with two bills is
     not looking at the same name five times and assuming the list is stuck.
     The three-payday month is rarer than three paydays, so the scan that finds
     it runs on past the rows rather than being cut down with them. */
  for (let i = 0; i < PAYDAY_SCAN; i++) {
    const pay = paydayFor(s, addDays(from, 1));
    paydays.push(pay);
    if (i < PAYDAY_ROWS) {
      const bills = [];
      s.bills.forEach(b => {
        if (b.paused) return;
        occurrences(b.due, b.freq, from, pay).forEach(on => bills.push({ name: b.name, amount: b.amount, on: on }));
      });
      bills.sort((a, c) => a.on - c.on);
      stretches.push({ payer: payer, upto: pay, bills: bills,
        total: round2(bills.reduce((n, x) => n + x.amount, 0)) });
    }
    payer = pay;
    from = pay;
  }

  /* Three paydays inside one calendar month is the month with slack in it. */
  const counts = {};
  paydays.forEach(d => {
    const k = d.getFullYear() + '-' + d.getMonth();
    counts[k] = (counts[k] || 0) + 1;
  });
  const spare = Object.keys(counts).filter(k => counts[k] >= 3)[0];

  return el('div.card', null, [
    helpCap('Which payday pays what', 'Each block is one payday and the bills it has to cover before the next one lands.'),
    el('div.rows', null, stretches.map(x => el('div.row.rowtall', null, [
      el('span.chip', { html: x.payer ? chipDate(x.payer) : 'NOW' }),
      el('span.nm', null, [
        el('span.nmline', { text: x.bills.length ? billNames(x.bills) : 'Nothing to pay' }),
        /* Without the end of the stretch, every row says only where the money
           comes from, and three rows of the same bill look like a repeat. The
           pair of dates is what shows each row is a different run of days. */
        el('span.foot', { text: (x.payer
          ? 'Comes out of the pay landing ' + fmtDay(x.payer)
          : 'Comes out of the money you already have')
          + ', covers up to ' + fmtDay(addDays(x.upto, -1)) })
      ]),
      el('span.amt', { text: app.money(x.total) })
    ]))),
    spare ? el('p.sub', { style: 'margin-top:12px', html:
      'There are <b>three paydays</b> in ' +
      new Date(Number(spare.split('-')[0]), Number(spare.split('-')[1]), 1)
        .toLocaleDateString(undefined, { month: 'long' }) +
      '. That month has more room in it than usual.' }) : null
  ]);
}

/* A row of the bare words "Electricity Bill", three times over, reads like the
   list is stuck rather than like the same bill coming round again. Its own due
   date is what separates them. Past three bills the dates make the line too
   long to take in at a glance, and by then the names and the totals differ
   anyway, so the dates drop out and same-named bills collapse to a count.
   Two bills with the same name printed "Electric, Electric". */
function billNames(bills) {
  if (bills.length <= 3) return bills.map(b => b.name + ' ' + fmtShort(b.on)).join(', ');
  const seen = [], count = {};
  bills.forEach(b => {
    if (count[b.name] == null) { count[b.name] = 0; seen.push(b.name); }
    count[b.name]++;
  });
  return seen.map(n => count[n] > 1 ? n + ' \u00d7' + count[n] : n).join(', ');
}

function incomeForm(app) {
  const name = field('What is it', { placeholder: 'Refund' });
  const amount = field('How much', { inputmode: 'decimal', placeholder: '0.00' });
  const date = field('When it lands', { type: 'date', value: toISO(addDays(today(), 3)),
    min: toISO(addDays(today(), -365)), max: toISO(addDays(today(), 730)) });
  const freq = picker('How often', FREQS, 'once');
  /* This is not the same question as "How often": it asks whether the money
     restarts the payday clock, which is what makes Today share the balance out
     over a shorter run of days. One-offs never can, so the question only
     appears once something repeating is picked. */
  const kind = picker('Is this another payday', [
    { value: 'extra', label: 'No, it is extra on top' },
    { value: 'pay', label: 'Yes, count it as a payday' }
  ], 'extra');
  const showKind = () => {
    kind.node.hidden = freq.value === 'once';
    if (freq.value === 'once') kind.el.value = 'extra';
  };
  freq.el.addEventListener('change', showKind);
  showKind();
  const msg = el('p.sub.warn');

  const save = () => {
    if (!name.value || !(amount.number > 0) || !date.value) {
      msg.textContent = 'It needs a name, an amount and a date.';
      return;
    }
    if (kind.value === 'pay' && freq.value === 'once') {
      msg.textContent = 'A regular payday needs to repeat. Pick how often it comes.';
      return;
    }
    app.change(s => {
      s.incomes.push({ id: uid('i'), name: name.value, amount: amount.number,
        date: date.value, freq: valueToFreq(freq.value), isPay: kind.value === 'pay' });
    });
  };

  return el('div.form', null, [
    el('div.fgrid', null, [name.node, amount.node, date.node, freq.node, kind.node]),
    msg,
    el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Add', onclick: save }))
  ]);
}

/* Envelopes. A way of splitting the day-to-day money for people who think in
   pots. It never changes the safe to spend figure: it divides it up. */
const envelopesScreen = {
  id: 'envelopes',
  label: 'Envelopes',
  view(app) {
    const s = app.state;
    const t = today();
    const b = safeToSpend(s, t);
    const since = toISO(b.start);

    const spentIn = id => round2(s.spends
      .filter(x => x.env === id && x.date >= since)
      .reduce((n, x) => n + x.amount, 0));

    const planned = round2(s.envelopes.reduce((n, e) => n + e.perStretch, 0));
    const spare = round2(b.left - planned);

    const cards = s.envelopes.map(e => {
      const spent = spentIn(e.id);
      const left = round2(e.perStretch - spent);
      const pct = e.perStretch > 0 ? Math.min(1, spent / e.perStretch) : 0;
      const amt = field('How much did you spend', { inputmode: 'decimal', placeholder: '0.00' });

        ]),
        el('div.bar', { style: 'margin-top:11px' }, el('i', { style: 'width:' + Math.round(pct * 100) + '%' })),
        el('p.sub', { style: 'margin-top:9px', text: left < 0
          ? app.money(e.perStretch) + ' planned, ' + app.money(spent) + ' spent. That is ' + app.money(-left) + ' over, so it comes out of your other spending money.'

        el('div.fgrid', { style: 'margin-top:11px' }, amt.node),
        el('div.footrow', null, [
          el('button.btn.primary', { type: 'button', text: 'Log it here', onclick: () => {
            if (!(amt.number > 0) || app.capped()) return;
            app.change(st => {
              st.spends.push({ id: uid('x'), date: toISO(today()),

    return el('div.envelopes', null, [

      el('div.cols', null, [
        el('div.col', null, [
          cards.length ? el('div.goalwrap', null, cards)
            : el('div.card', null, el('p.sub', { text: 'No envelopes yet. Add one below, or skip this page if you would rather not split your money up.' })),
          el('div.card', null, [
            helpCap('Add an envelope',
              'An envelope is an amount you set aside for one thing, like food or petrol. ' +
              'Spending from it does not change your Safe to Spend number, it only shows how much ' +
              'of that amount is left.'),
            envelopeForm(app)
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'Your money right now'),
            el('div.rows', { style: 'margin-top:6px' }, [
              el('div.row', null, [el('span.nm', { text: 'Left to last until payday' }), el('span.amt', { text: app.money(b.left) })]),
              el('div.row', null, [el('span.nm', { text: 'Put into envelopes' }), el('span.amt', { text: app.money(planned) })]),
              el('div.row', null, [el('span.nm', { text: spare < 0 ? 'More planned than you have' : 'Not in any envelope' }),
                el('span.amt', { text: app.money(Math.abs(spare)) })])
            ]),
            el('p.sub', { style: 'margin-top:11px', text: spare < 0

function goalCard(app, g) {
  const pct = g.target > 0 ? Math.min(1, g.saved / g.target) : 0;
  const add = field('How much to put in', { inputmode: 'decimal', placeholder: '0.00' });
  /* The money is held out of safe to spend for the whole stretch but only lands
     in the goal on payday, so for those days it has left Today without arriving
     here. A goal reading "0.00 of 1,500.00" while Today is already lighter
     looks like nothing is happening. This is the same amount goalsForStretch
     holds back, named, with the day it lands. */
  const onItsWay = !g.paused && g.perPayday > 0 && g.saved < g.target
    ? Math.min(g.perPayday, round2(g.target - g.saved)) : 0;

  return el('div.card', null, [
    el('div.parkedtop', null, [
      el('span.nm', { text: g.name }),
      el('span.amt', { text: app.money(g.saved) + ' of ' + app.money(g.target) })
    ]),
    el('div.bar', { style: 'margin-top:11px' }, el('i', { style: 'width:' + Math.round(pct * 100) + '%' })),
    /* The amount per payday is optional, and with none set the line used to read
       "at 0.00 a payday", which sounds like the goal is never going to arrive
       rather than like it is yours to feed by hand. */
    el('p.sub', { style: 'margin-top:9px', text: g.saved >= g.target
      ? 'Fully saved for.'
      : g.paused
        ? app.money(round2(g.target - g.saved)) + ' to go. Paused, so nothing goes in on payday.'
        : g.perPayday > 0
          ? app.money(round2(g.target - g.saved)) + ' to go, at ' + app.money(g.perPayday) + ' a payday.'
          : app.money(round2(g.target - g.saved)) + ' to go. Add to it whenever you like.' }),
    /* Said out loud, because the whole reason to pause rather than remove is
       that the money already put by is not handed back. */
    g.paused && g.saved > 0 ? el('p.sub', { style: 'margin-top:5px', text:
      app.money(g.saved) + ' already saved stays saved, and stays out of Safe to Spend.' }) : null,
    onItsWay ? el('p.sub', { style: 'margin-top:5px', text: app.money(onItsWay) +
      ' is already held back for this and goes in on ' +
      fmtDay(paydayFor(app.state, addDays(today(), 1))) + '.' }) : null,
    el('div.fgrid', { style: 'margin-top:11px' }, add.node),
    el('div.footrow', null, [
      el('button.btn.primary', { type: 'button', text: 'Put it in', onclick: () => {
        if (!(add.number > 0)) return;
        app.change(s => {
          s.goals = s.goals.map(x => x.id === g.id ? Object.assign({}, x, { saved: round2(x.saved + add.number) }) : x);
        });
      } }),
      el('button.linky', { type: 'button', text: g.paused ? 'Start it again' : 'Pause it',
        onclick: () => app.change(s => {
          s.goals = s.goals.map(x => x.id === g.id
            ? Object.assign({}, x, { paused: !x.paused }) : x);
        }) }),
      el('button.linky', { type: 'button', text: 'Remove', onclick: () =>
        app.change(s => { s.goals = s.goals.filter(x => x.id !== g.id); }) })
    ])
  ]);
}

/* Savings. Everything being held back, in one place: bill pots, goals and any
   account that is not the everyday one. Nothing to set up, it just adds up. */
const savingsScreen = {
  id: 'savings',
  label: 'Savings',
  view(app) {
    const s = app.state;
    const b = safeToSpend(s, today());

    const pots = b.working.pots.map(p => ({ name: p.name, value: p.amount, note: 'for a bill' }));
    /* Money already in a goal and the contribution going into one this payday
       are both held back from Safe to Spend, so both belong here. Adding them
       together under the goal's own name was the mistake: a goal holding $120
       read as $160 here while the Today page and the Goals page both said $120.
       Each goal now shows what is really in it, and what is still to go in gets
       its own row, so the rows still add up to the total above them. */
    const goalNow = new Map();
    b.working.goalPots.forEach(g => goalNow.set(g.name, round2((goalNow.get(g.name) || 0) + g.amount)));
    const goals = Array.from(goalNow, ([name, value]) => ({ name, value, note: 'for a goal' }));
    const onPayday = round2(b.working.goalsOut);
    if (onPayday > 0) {
      goals.push({ name: 'Going in on payday', value: onPayday, note: 'for your goals' });
    }
    const sunk = s.accounts.filter(a => !a.everyday && a.balance < 0).length;
    const other = s.accounts.filter(a => !a.everyday && a.balance > 0)
      .map(a => ({ name: a.name, value: a.balance, note: 'in an account' }));
    const all = pots.concat(goals).concat(other).sort((a, c) => c.value - a.value);
    const total = round2(all.reduce((n, x) => n + x.value, 0));

    return el('div.savings', null, [
      /* The card below is captioned "Everything you have set aside", so the
         subtitle says what the page does instead of repeating it. */
      screenTop(app, 'Savings', 'Added up, in one place.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.card', null, [
            /* "Set aside so far" belongs to the Today card, which counts only
               the money already put by out of the main account. This total adds
               the other accounts, so it says so. */
            capIcon(null, 'Everything you have set aside'),
            el('div.big.calm', null,
              (function () {
                const body = Math.abs(total).toLocaleString(undefined, {
                  minimumFractionDigits: app.cur.decimals, maximumFractionDigits: app.cur.decimals });
                const sym = el('span' + (app.cur.after ? '.after' : ''), { text: app.cur.symbol });
                return app.cur.after ? [body, sym] : [sym, body];
              })()),
            el('p.sub', { text: total > 0
              ? 'Your Safe to Spend number never includes this money, so it stays accurate.'
              : 'Nothing yet. Add a bill or a goal and this fills in on its own.' })
          ]),
          el('div.card', null, [
            capIcon(null, 'Each one on its own'),
            el('div', { style: 'margin-top:4px' }, barList(app, all, { empty: 'Nothing set aside yet.' })),
            /* An overdrawn account is not money set aside, so it is left out of
               the total. Saying so is what stops this page and Accounts looking
               like they disagree. */
            sunk ? el('p.sub', { style: 'margin-top:11px', text: sunk === 1
              ? 'One account is below zero, so it is not counted here as set aside.'
              : sunk + ' accounts are below zero, so they are not counted here as set aside.' }) : null
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            helpCap('Where this comes from', 'It is worked out, not typed in. Money held for a bill fills a little every day, goals fill each payday, and other accounts are whatever you put in them.'),
            /* A line at zero is not information, it is a thing to work out and
               dismiss. Bills only build a pot when they come round less often
               than the pay does, so for most people that line is always zero.
               Show a source only once it holds something. */
            (function () {
              const sum = xs => round2(xs.reduce((n, x) => n + x.value, 0));
              const rows = [
                ['Set aside for bills', sum(pots)],
                ['Set aside for goals', sum(goals)],
                ['In your other accounts', sum(other)]
              ].filter(([, v]) => v > 0);
              return rows.length
                ? el('div.rows', { style: 'margin-top:8px' }, rows.map(([k, v]) => el('div.row', null, [
                    el('span.nm', { text: k }), el('span.amt', { text: app.money(v) })
                  ])))
                : el('p.sub', { style: 'margin-top:8px', text: 'Nothing is being held back yet.' });
            })()
          ]),
          el('div.card', null, [
            capIcon(null, 'Change any of it'),
            el('div.stack', null, [
              el('button.btn', { type: 'button', text: 'Bills', onclick: () => app.go('bills') }),
              el('button.btn', { type: 'button', text: 'Goals', onclick: () => app.go('goals') }),
              el('button.btn', { type: 'button', text: 'Accounts', onclick: () => app.go('accounts') })
            ])
          ])
        ])
      ])
    ]);
  }
};

/* The end of a debt is months or years out, so the weekday means nothing and
   the year means everything. fmtDay, which is right for a bill due this week,
   printed "Tue 10 Aug" for a date in 2027. */
const fmtEndDay = d => d.toLocaleDateString(undefined,
  { day: 'numeric', month: 'short', year: 'numeric' });

/* Month by month, minimums on everything and anything spare thrown at the one
   at the top. Stops at thirty years rather than looping for ever. */
function payoff(sorted, extra, money) {
  if (!sorted.length) return { months: 0, why: 'clear', note: '' };
  let left = sorted.map(d => ({ bal: d.balance, min: d.minimum || 0 }));
  const pot = round2(left.reduce((n, d) => n + d.min, 0) + (extra || 0));
  if (pot <= 0) return { months: 0, why: 'nopayment', note: 'Add what you pay each month, on the debt or in the box above, and the end date appears here.' };

  for (let m = 1; m <= 360; m++) {
    let spare = pot;
    left.forEach(d => {
      if (d.bal <= 0) return;
      const pay = Math.min(d.bal, Math.min(d.min, spare));
      d.bal = round2(d.bal - pay); spare = round2(spare - pay);
    });
    for (let i = 0; i < left.length && spare > 0; i++) {
      if (left[i].bal <= 0) continue;
      const pay = Math.min(left[i].bal, spare);
      left[i].bal = round2(left[i].bal - pay); spare = round2(spare - pay);
    }
    if (left.every(d => d.bal <= 0.005)) {
      /* Both of these used to lean on words that float: "that", "it", and
         "above" with nothing named. The amount is on hand, so say it. */
      const paid = round2(pot - spare);
      return { months: m, why: 'ok', note: extra > 0
        /* With an extra big enough to finish it off, "every month" is wrong:
           there is only one month, and it does not even take all of it. */
        ? (m === 1
            ? 'One payment clears this. It takes ' + (money ? money(paid) : paid) +
              ' this month, not the full ' + (money ? money(pot) : pot) + '.'
            : 'This date assumes you pay the extra ' + (money ? money(extra) : extra) +
              ' every month on top of the minimums. Without it, clearing takes longer.')
        : 'This date assumes you only pay the least each month. Put an extra amount in the box above to see how much sooner it would clear.' };
    }
  }
  return { months: 0, why: 'never', note: 'At these amounts the end is more than thirty years out, which is too far ahead to put a date on. Paying a bit more each month is what moves it.' };
}

function debtForm(app) {

/* Accounts. One of them is where pay lands and where safe to spend comes from.
   The rest are tracked so the total is honest, but never spendable. */
const accountsScreen = {
  id: 'accounts',
  label: 'Accounts',
  view(app) {
    const s = app.state;
    const net = netInAccounts(s);
    const day = everyday(s);

    const rows = s.accounts.map(a => {
      /* A name you cannot change means a typo can only be fixed by removing
         the account, which takes its bills with it. */
      const nm = field('Name', { value: a.name, placeholder: 'Savings' });
      const amt = field('Balance', { value: amountValue(a.balance, app.cur), inputmode: 'decimal', placeholder: '0.00' });
      /* A balance that cannot be read was being saved as 0, which empties the
         very account the Today number is worked out from. */
      const rowmsg = el('p.sub.warn');
      return el('div.card', null, [
        /* Every other card on every screen carries the screen's mark. These
           were the only ones without it, so an account read as a different
           kind of thing from the card right under it. */
        el('div.parkedtop', null, [
          el('span.nm.capicon', null, [
            el('span.capi', { html: navIcon('accounts') }),
            el('span', { text: a.name })
          ]),
          el('span.amt', { text: app.money(a.balance) })
        ]),
        a.everyday
          ? el('p.sub', { style: 'margin-top:6px', text: 'This is your main account. Your pay lands here, and Safe to Spend is worked out from this balance.' })
          : el('p.sub', { style: 'margin-top:6px', text: 'Money you are not spending day to day. It counts towards your total, but Safe to Spend ignores it.' }),
        el('div.fgrid', { style: 'margin-top:11px' }, [nm.node, amt.node]),
        el('div.footrow', null, [
          el('button.btn.primary', { type: 'button', text: 'Save', onclick: () => {
            if (amt.bad) { rowmsg.textContent = amountNote(parseAmount(amt.el.value)); return; }
            rowmsg.textContent = '';
            app.change(st => {
              const hit = st.accounts.filter(x => x.id === a.id)[0];
              if (!hit) return;
              const moved = hit.balance !== amt.number;
              if (nm.value) hit.name = nm.value;
              hit.balance = amt.number;
              /* A fresh balance from the bank already has this stretch's spending
                 inside it. Without moving the date, every spend logged since the
                 old date would come off a second time. */
              if (moved && hit.everyday) st.balanceAsOf = toISO(today());
            });
          } }),
          a.everyday ? null : el('button.btn', { type: 'button', text: 'Make this my main account',
            onclick: () => app.change(st => {
              /* Bills remember the account they were added under. Without this,
                 changing the main account drops every one of them from the sum. */
              const wasId = (everyday(st) || {}).id;
              (st.bills || []).forEach(b => { if (!b.account || b.account === wasId) delete b.account; });
              st.accounts.forEach(x => { x.everyday = x.id === a.id; });
              /* Spending logged since the old date came out of the old account,
                 so taking it off this one would read as money gone that never
                 left here. The same reset that saving a balance does. */
              st.balanceAsOf = toISO(today());
            }) }),
          a.everyday || s.accounts.length < 2 ? null : el('button.linky', { type: 'button', text: 'Remove',
            onclick: () => app.change(st => {
              /* Its bills go back to the everyday account rather than disappearing. */
              (st.bills || []).forEach(b => { if (b.account === a.id) delete b.account; });
              st.accounts = st.accounts.filter(x => x.id !== a.id);
            }) })
        ]),
        /* Both of these move `balanceAsOf` to today, and the old line said only
           that it "counts your spending from today", which reads either as
           starting from today or as including today. What a buyer wants to know
           is whether the spends they already logged are about to be taken off a
           second time, so that is what is said. The switch button did the same
           thing and said nothing at all.
           Note the trigger: the "from the date it was set" rule runs all the
           time, so saying "anything you log from today comes off it" is true
           only in the minute after a save. What saving CAUSES is the older
           spends dropping out, so that is the half tied to the button. */
        el('p.foot', { style: 'margin-top:8px', text: a.everyday
          ? 'Type a fresh number from your bank and press Save. What you logged ' +
            'before today is not taken off again, because the bank already took ' +
            'it off.'
          : 'Make this your main account and what you log from today comes off ' +
            'its balance. What you logged before today is left alone.' }),
        rowmsg
      ]);
    });

    const name = field('What is it called', { placeholder: 'Savings' });
    const bal = field('What is in it', { inputmode: 'decimal', placeholder: '0.00' });
    const addmsg = el('p.sub.warn');

    return el('div.accounts', null, [
      screenTop(app, 'Accounts', 'Where the money actually sits.'),
      el('div.cols', null, [
        el('div.col', null, [
          el('div.goalwrap', null, rows),
          el('div.card', null, [
            capIcon(null, 'Add an account'),
            el('div.form', null, [
              el('div.fgrid', null, [name.node, bal.node]),
              el('div.footrow', null, el('button.btn.primary', { type: 'button', text: 'Add', onclick: () => {
                /* The box warns while it is typed; the button used to add the
                   account with a balance of 0 regardless. */
                if (bal.bad) { addmsg.textContent = amountNote(parseAmount(bal.el.value)); return; }
                /* It used to do nothing at all: no message, no outline, while
                   every other Add form in the app says what is missing. */
                if (!name.value) { addmsg.textContent = 'It needs a name and an amount.'; return; }
                addmsg.textContent = '';
                app.change(st => {
                  st.accounts.push({ id: uid('a'), name: name.value, balance: bal.number, everyday: false });
                });
              } })),
              addmsg
            ])
          ])
        ]),
        el('div.col', null, [
          el('div.card', null, [
            capIcon(null, 'All of it together'),
            el('div.rows', null, [
              ['In all your accounts', app.money(net)],
              ['In your main account', app.money(day ? day.balance : 0)],
              ['Everywhere else', app.money(round2(net - (day ? day.balance : 0)))]
            ].map(([k, v]) => el('div.row', null, [
              el('span.nm', { text: k }), el('span.amt', { text: v })
            ])))
          ]),
          /* This was a helpCap on its own, so the card was a title and a
             question mark with nothing under it until you opened it. It is two
             lines and it is the question this screen raises, so it is said. */
          el('div.card', null, [
            capIcon(null, 'Why only one account counts'),
            el('p.sub', { style: 'margin-top:6px', text: 'If your savings counted, the Today page would be telling you to spend them. So Safe to Spend is worked out from your main account only. The rest still count towards your total.' })
          ])
        ])
      ])
    ]);
  }
};

        ]),

              el('div.row', null, [el('span.nm', { text: 'Things waiting' }), el('span.amt', { text: String(waiting.length) })]),
