   pretending, and it is replaced file for file as each screen lands. */
function stubScreen(def) {
  return {
    id: def.id,
    label: def.label,
    view(app) {
      return el('div.today', null, [
        el('div.m-top', null, [
          el('div', null, [
            el('div.m-greet', { text: def.label })
          ]),
          el('button.m-dot', { type: 'button', 'aria-label': 'Settings and backup', onclick: () => app.go('settings') })
        ]),
        el('div.card', null, [
          el('div.cap', { text: 'Coming soon' }),
          el('p.sub', { style: 'margin-top:8px', text: def.note || 'This part is not ready yet. Everything else works as normal.' })
        ])
      ]);
    }
  };
}

/* Navigation. A sidebar on a wide screen, a row of pills on a phone: one list,
   two layouts. Built from the settings file, so switching a screen off for a
   listing removes it from the nav with no code change. */
const BURGER = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
  '<path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
  '<path d="M6 6l12 12M18 6 6 18"/></svg>';

function renderNav(app) {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';

  nav.appendChild(el('div.brand', null, [
    el('div.brandname', { text: CONFIG.shortName || CONFIG.name }),
    CONFIG.brandSub ? el('div.brandsub', { text: CONFIG.brandSub }) : null,
    el('button.btn.primary.logbtn', { type: 'button', text: '+  Log a spend',
      onclick: () => openLogBox(app) })
  ]));

  /* Sixteen screens need grouping or the sidebar becomes a wall. On a phone the
     groups fall away and it is one row of pills. */
  const item = s => el('button.navitem' + (s.id === app.screen ? '.on' : ''), {
    type: 'button',
    'aria-current': s.id === app.screen ? 'page' : null,
    onclick: () => { closeNav(); app.go(s.id); }
  }, [
    el('span.naviconwrap', { html: navIcon(s.id) }),
    el('span.navlabel', { text: s.label })
  ]);

  const shown = app.visibleScreens().filter(s => s.id !== 'settings');
  const list = el('div.navlist');
  let group = null;
  shown.forEach(s => {
    if (s.group && s.group !== group) {
      group = s.group;
      list.appendChild(el('div.navgroup', { text: group }));
    }
    list.appendChild(item(s));
  });
  nav.appendChild(list);

  nav.appendChild(el('button.navitem.navfoot' + (app.screen === 'settings' ? '.on' : ''), {
    type: 'button', onclick: () => { closeNav(); app.go('settings'); }
  }, [
    el('span.naviconwrap', { html: navIcon('settings') }),
    el('span.navlabel', { text: 'Settings' })
  ]));

  /* On a phone the row is far wider than the screen and it redraws back at the
     start every time, so for most pages the lit pill sat off to the right and
     there was no way to tell where you were. Only its own scroll is touched. */
  const on = nav.querySelector('.navitem.on');
  if (on && nav.scrollWidth > nav.clientWidth + 1) {
    nav.scrollLeft = Math.max(0, on.offsetLeft - (nav.clientWidth - on.offsetWidth) / 2);
  }
}

/* The drawer. Seventeen pages never fitted across a phone: the row of pills
   scrolled sideways, so most of the app sat off the edge of the screen with
   nothing to say it was there. On a phone the same list is a panel behind a
   hamburger, and the top bar gets its three things back: log a spend, the
   theme switch, the menu. Nothing changes from tablet width up, where the
   sidebar is always open and the hamburger does not exist. */
function navVeil() {
  let v = document.getElementById('navveil');
  if (!v) {
    v = el('div.navveil', { id: 'navveil', onclick: () => closeNav() });
    document.body.appendChild(v);
  }
  return v;
}

function navIsOpen() { return document.body.classList.contains('navopen'); }

function closeNav() {
  if (!navIsOpen()) return;
  document.body.classList.remove('navopen');
  const b = document.querySelector('.navbtn');
  if (b) { b.setAttribute('aria-expanded', 'false'); b.innerHTML = BURGER; }
}

function openNav() {
  navVeil();
  document.body.classList.add('navopen');
  const b = document.querySelector('.navbtn');
  if (b) { b.setAttribute('aria-expanded', 'true'); b.innerHTML = CROSS; }
  const on = document.querySelector('#nav .navitem.on');
  if (on) on.focus();
}

function toggleNav() { navIsOpen() ? closeNav() : openNav(); }

/* Escape closes it, the way every other panel in the planner closes. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && navIsOpen()) {
    closeNav();
    const b = document.querySelector('.navbtn');
    if (b) b.focus();
  }
});

/* The top bar: theme and currency, right aligned with the content below it.
   Two controls, no more. Settings still holds the full three-way theme choice. */
const UNDO = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 9h11a4.5 4.5 0 0 1 0 9h-6"/><path d="M8 5 4 9l4 4"/></svg>';
const GLASS = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
  '<circle cx="11" cy="11" r="6.3"/><path d="m15.6 15.6 3.6 3.6"/></svg>';
const FOCUS = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round">' +
  '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';
const PRINT = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M7 9V4h10v5"/><path d="M7 18H5.5A1.5 1.5 0 0 1 4 16.5v-5A1.5 1.5 0 0 1 5.5 10h13a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H17"/><path d="M7 14h10v6H7z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/>' +
  '<path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" ' +
  'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M20.3 13.6A8.4 8.4 0 0 1 10.4 3.7a8.4 8.4 0 1 0 9.9 9.9Z"/></svg>';

/* Which theme is actually showing, since "match my device" is a real state. */
function activeTheme(app) {
  if (app.state.theme !== 'auto') return app.state.theme;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyFocus(on) {
  document.body.classList.toggle('focused', !!on);
}

function renderTopbar(app) {
  const bar = document.getElementById('topbar');
  bar.innerHTML = '';

  const sel = el('select.topsel', { 'aria-label': 'Currency' });
  CURRENCIES.forEach(c => {
    const o = el('option', { value: c.code, text: c.code + '  ' + c.symbol.trim() });
    if (c.code === app.cur.code) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => {
    app.change(s => { s.currency = CURRENCIES.filter(c => c.code === sel.value)[0] || s.currency; });
  });

  /* Both states are on show, so it is a switch rather than a guess at what the
     one icon would do. The lit half is the theme you are looking at. */
  const now = activeTheme(app);
  const half = (mode, icon, name) => el('button.topseghalf' + (now === mode ? '.on' : ''), {
    type: 'button', html: icon, title: name,
    'aria-label': name, 'aria-pressed': now === mode ? 'true' : 'false',
    onclick: () => app.change(s => { s.theme = mode; applyTheme(mode); })
  });

  const toggle = el('div.topseg', { role: 'group', 'aria-label': 'Theme' }, [
    half('light', SUN, 'Light mode'),
    half('dark', MOON, 'Dark mode')
  ]);

  /* Everything is kept in this browser and nowhere else, so the planner says so
     out loud each time rather than asking to be trusted. */
  const saving = !SAVE_WORKS
    ? el('span.savedtag.bad', { text: 'Not saving' })
    : (Date.now() - SAVED_AT < 400 ? el('span.savedtag', { text: 'Saved' }) : null);

  const left = el('div.topleft', null, [
    el('button.btn.primary.logbtn.onlyphone', { type: 'button', text: '+ Log a spend',
      onclick: () => openLogBox(app) }),
    saving,
    CONFIG.demoCap ? el('span.demotag', { text: 'Demo' }) : null,
    CONFIG.demoCap && CONFIG.buyUrl
      ? el('a.btn.primary.buybtn', { href: CONFIG.buyUrl, target: '_blank', rel: 'noopener',
          text: 'Get the full planner' })
      : null
  ]);

  const undo = el('button.topbtn.undobtn', {
    type: 'button', title: 'Undo the last thing', 'aria-label': 'Undo the last thing',
    disabled: app.canUndo() ? null : true,
    html: UNDO, onclick: () => app.undo()
  });

  /* Focus hides everything on Today except the one thing and the one figure.
     It used to be an unlabelled icon, which said nothing until you hovered it
     and nothing at all on a phone. It is a switch with its name on it now, the
     way the strongest competitor ships it. */
  const focus = el('button.focusbtn' + (app.state.focus ? '.on' : ''), {
    type: 'button',
    title: app.state.focus ? 'Show everything again' : 'Hide everything except the one number',
    'aria-pressed': app.state.focus ? 'true' : 'false',
    onclick: () => app.change(s => { s.focus = !s.focus; applyFocus(s.focus); })
  }, [
    /* Both words in the markup and the stylesheet picks one, the way the
       Calendar's payday chip does. Below 720px the label used to be hidden
       outright, which left a bare grey toggle with nothing beside it and no
       hover to ask: exactly the unlabelled icon this switch replaced. */
    el('span.focuslbl', { text: 'Focus mode' }),
    el('span.focustiny', { text: 'Focus' }),
    el('span.focusw', null, el('i'))
  ]);

  const printer = el('button.topbtn.printbtn', {
    type: 'button', title: 'Print this page', 'aria-label': 'Print this page',
    html: PRINT, onclick: () => window.print()
  });

  const search = el('button.topbtn.searchbtn', {
    type: 'button', title: 'Search the whole planner', 'aria-label': 'Search the whole planner',
    html: GLASS, onclick: () => openSearch(app)
  });

  /* The menu. A phone cannot show seventeen pages across the top, so the list
     lives behind this and the bar keeps its three things: log a spend on the
     left, the theme switch in the middle, the menu on the right. From tablet
     width up the sidebar is always on show and this button is not drawn at
     all. The bar is redrawn on every change, so its state is read back off
     the body rather than kept in a variable that a redraw would lose. */
  const open = document.body.classList.contains('navopen');
  const burger = el('button.topbtn.navbtn', {
    type: 'button', title: 'Menu', 'aria-label': 'Menu', 'aria-controls': 'nav',
    'aria-expanded': open ? 'true' : 'false',
    html: open ? CROSS : BURGER, onclick: () => toggleNav()
  });

  /* Which page you are on, said once at the top. Nine floating pills with no
     surface behind them and nothing naming the page was the whole of the
     clutter: the bar now has a top line that says where you are and holds the
     two things that are about the app, and a second line that holds the two
     kinds of thing you do here. */
  /* The planner's name, not the page's: every screen already prints its own
     name as the first thing under the bar, and the same word twice in a row
     is the thing that reads as clutter. The sidebar carries this name at every
     other width, so a phone is the one place the app was nameless. */
  const title = el('div.topttl', { text: CONFIG.shortName || CONFIG.name });

  bar.appendChild(title);
  bar.appendChild(el('div.topctrl', null, [toggle, burger]));
  /* A forced line break. The two lines hold different things in different
     widths, so they must not share a grid's columns: a wide tools line used to
     squeeze the name above it until it was cut off. */
  bar.appendChild(el('div.topbreak'));
  bar.appendChild(left);
  /* The switch does nothing anywhere but Today, and a control that does
     nothing is worse than no control. */
  const onToday = app.screen === 'today';
  bar.appendChild(el('div.topwrap', null,
    [onToday ? focus : null, printer, search, undo, el('div.selwrap', null, sel)]));
}

/* The engine's own job: hold the state, hand it to a screen, and put the screen
   back on the page when it changes. Screens never talk to each other. */
/* Anything loaded is made safe before a single sum reads it. This used to run
   the other way round, so a save that predated one of the lists fell over
   inside accrue and left an empty page with no way back. */
let SAVED = normalise(load());
/* An example nobody has touched is rebuilt whenever the date has moved on, so
   it is always a planner mid-stretch rather than a stale snapshot. Anything
   the person has changed, example or not, is left exactly as they left it. */
/* Whether they have already met the welcome box is a fact about them, not part
   of the example, so it has to survive the rebuild below. It is written quietly
   on purpose, so that meeting the box does not count as touching the example
   and stop it refreshing. The cost of that was this: somebody who opened the
   planner, skipped the box and changed nothing met it again the next day,
   because the flag went out with the stale example. */
const metWelcome = !!(SAVED && SAVED.seenWelcome);
if (SAVED && SAVED.example && !SAVED.exampleTouched && SAVED.seededOn !== toISO(today())) {
  SAVED = null;
}
let STATE = accrue(SAVED || exampleState());
if (metWelcome) STATE.seenWelcome = true;
SAVE_WORKS = storageWorks();

/* How long since this was last opened, read before it is updated, so the
   catch-up card knows whether to say anything. */
let AWAY_SINCE = STATE.lastOpened || null;
function AWAY_RESET() { AWAY_SINCE = null; }
STATE.lastOpened = toISO(today());
save(STATE);

/* Undo. Every change snapshots first, so one button takes back the last thing
   that happened whatever it was. The most asked-for feature on this keyword. */
const UNDO_DEPTH = 25;
const undoStack = [];
/* When the last real change was written down, so the top bar can confirm it. */
let SAVED_AT = 0;
function pushUndo() {
  undoStack.push(JSON.stringify(STATE));
  if (undoStack.length > UNDO_DEPTH) undoStack.shift();
}

/* Said out loud, because a planner that is quietly failing to save looks
   exactly like one that is working. */
function warningCard(app) {
  const notes = [];
  if (LOAD_PROBLEM === 'damaged') {
    notes.push({
      cap: 'Your saved numbers could not be read',
      sub: 'The planner has opened with example numbers so you can carry on. Your old file has not been thrown away.',
      btn: hasRescueCopy() ? ['Download the old file', downloadRescueCopy] : null
    });
  } else if (LOAD_PROBLEM) {
    notes.push({
      cap: 'These numbers were saved by a newer planner',
      sub: 'They have been left exactly as they are rather than changed. Open them with the newest copy of the planner.',
      btn: null
    });
  }
  if (!SAVE_WORKS) {
    notes.push({
      cap: 'This browser will not let the planner save',
      sub: 'Everything works while this tab is open, and will be gone once it closes. Private browsing and blocked site data both do this. Download a backup before you leave.',
      btn: ['Download a backup', () => exportBackup(STATE)]
    });
  }
  if (!notes.length) return null;
  return el('div.card.warncard', null, notes.map(n => el('div', null, [
    el('div.cap', { text: n.cap }),
    el('p.sub', { style: 'margin-top:6px', text: n.sub }),
    el('div.footrow', null, [
      n.btn ? el('button.btn', { type: 'button', text: n.btn[0], onclick: n.btn[1] }) : null,
      el('button.linky', { type: 'button', text: 'Hide this',
        onclick: () => { LOAD_PROBLEM = null; app.render(); } })
    ])
  ])));
}

/* A screen that throws must never leave an empty page: there is no way back
   from one, and it looks exactly like losing everything. */
function rescueCard(app, err) {
  return el('div.card.warncard', null, [
    el('div.cap', { text: 'This page could not be drawn' }),
    el('p.sub', { style: 'margin-top:6px', text:
      'Something in the numbers does not add up, so the planner stopped rather than show you a figure it cannot stand behind. Your numbers are still here. Take a backup first, then starting again will clear it.' }),
    el('div.footrow', null, [
      el('button.btn', { type: 'button', text: 'Download a backup', onclick: () => exportBackup(STATE) }),
      el('button.linky', { type: 'button', text: 'Start again with example numbers',
        onclick: () => app.replace(exampleState()) })
    ]),
    el('p.foot', { style: 'margin-top:10px', text: String((err && err.message) || err) })
  ]);
}

const app = {
  screen: (load() || {}).screen || 'today',

  get state() { return STATE; },
  get cur() { return STATE.currency || CONFIG.currency; },
  money(n, o) { return money(n, app.cur, o); },

  /* Every change goes through here, so there is one place that saves and redraws. */
  change(fn, opts) {
    const quiet = opts && opts.quiet;
    if (!quiet) pushUndo();
    fn(STATE);
    /* Once somebody has changed something on the example, it is theirs and is
       never rebuilt underneath them. */
    if (!quiet && STATE.example) STATE.exampleTouched = true;
    save(STATE);
    if (!quiet) SAVED_AT = Date.now();
    app.render();
  },

  canUndo() { return undoStack.length > 0; },
  undo() {
    const prev = undoStack.pop();
    if (!prev) return;
    STATE = JSON.parse(prev);
    save(STATE);
    applyTheme(STATE.theme);
    /* Undoing a change to focus mode put the flag back in the state and left
       the page as it was, so the switch said one thing and the page another. */
    applyFocus(STATE.focus);
    app.render();
  },

  /* The quick buttons are the buyer's own after they edit them. */
  quickAdd() { return (STATE.quickAdd && STATE.quickAdd.length) ? STATE.quickAdd : CONFIG.quickAdd; },

  /* Wiping everything and loading a backup are the two things people most want
     back, and they were the two the undo arrow could not reach. */
  replace(next, opts) {
    if (!(opts && opts.quiet)) pushUndo();
    STATE = normalise(next) || exampleState();
    /* A different planner, so every figure that counts starts again from
       nothing: filling in the welcome box used to run the buyer's own first
       number down from the example's. */
    countersFromZero();
    save(STATE); SAVED_AT = Date.now();
    applyTheme(STATE.theme); applyFocus(STATE.focus); app.render();
  },

  /* Simple hides the screens most people never open. Nothing is deleted and
     the numbers carry on exactly as before. */
  /* Nine, which is what the strongest competitor ships as its whole list, plus
     the Guide. The Guide is not a tenth screen so much as the way back from the
     other nine: hiding it left the buyer who had asked for less of the app as
     the only buyer with no help page, and sent anything pointing at it to some
     other screen without a word.
     Everything else stays available behind the toggle in Settings. */
  simpleScreens: ['today', 'log', 'month', 'calendar', 'bills', 'money-in',
    'goals', 'savings', 'guide', 'settings'],
  visibleScreens() {
    return STATE.simple
      ? SCREENS.filter(s => app.simpleScreens.indexOf(s.id) >= 0)
      : SCREENS;
  },

  /* Which record is open for editing, if any. Holding it here rather than
     poking a form into the page by hand means opening a second one closes the
     first, and cancelling closes only the one you cancelled. */
  editing: null,
  edit(id) {
    app.editing = id;
    app.render();
    const f = document.querySelector('.rows .form .fi, .editform .fi');
    if (f) f.focus();
  },

  go(id) {
    app.editing = null;
    app.back = 0;
    app.monthBack = 0;
    /* The Calendar used to keep whatever month you had stepped to for the rest
       of the session, alone among the three screens with a period in them. */
    app.month = null;
    app.day = null;
    app.screen = id;
    app.change(s => { s.screen = id; }, { quiet: true });
    window.scrollTo(0, 0);
  },

  capped() {
    return CONFIG.demoCap ? STATE.spends.length >= CONFIG.demoCap : false;
  },
  capLeft() {
    return CONFIG.demoCap ? Math.max(0, CONFIG.demoCap - STATE.spends.length) : null;
  },

  logSpend(amount, note) {
    if (!(amount > 0) || app.capped()) return;
    app.change(s => {
      s.spends.push({ id: uid('x'), date: toISO(today()), amount: round2(amount), note: note || '' });
    });
  },

  /* Some days nothing goes out, and saying so in one tap is the whole point.
     Nothing is scored and no streak is kept: this only records the answer. */
  noSpendToday() {
    const iso = toISO(today());
    app.change(s => { s.noSpend = s.noSpend === iso ? null : iso; });
  },
  saidNothingToday() { return STATE.noSpend === toISO(today()); },

  undoLastSpend() {
    app.change(s => { s.spends.pop(); });
  },

  removeSpend(id) {
    app.change(s => { s.spends = s.spends.filter(x => x.id !== id); });
  },

  /* Parking something is the whole point of the waitlist: the decision is
     postponed, not refused, and nothing is deducted while it waits. */
  park(amount, label) {
    if (!(amount > 0)) return;
    app.change(s => {
      s.parked.push({ id: uid('p'), amount: round2(amount), label: label || 'Something', at: Date.now() });
    });
  },
  unpark(id) { app.change(s => { s.parked = s.parked.filter(p => p.id !== id); }); },

  /* A thing can be parked and then bought through the Log page like any other
     spend, which used to leave it sitting on the waitlist for ever. A logged
     spend whose note names a parked thing is a question, never an answer: the
     waitlist asks, and only the buyer takes it off. */
  parkedMatch(p) {
    const label = plainName(p.label);
    if (label.length < 3) return null;
    const from = toISO(new Date(p.at));
    const skip = p.notBought || [];
    return (STATE.spends || []).filter(x =>
      x.date >= from && skip.indexOf(x.id) < 0 && plainName(x.note).indexOf(label) >= 0
    ).sort((a, c) => (a.date < c.date ? 1 : -1))[0] || null;
  },
  keepWaiting(id, spendId) {
    app.change(s => {
      const p = s.parked.filter(x => x.id === id)[0];
      if (p) p.notBought = (p.notBought || []).concat([spendId]);
    });
  },
  buyParked(id) {
    const p = STATE.parked.filter(x => x.id === id)[0];
    if (!p || app.capped()) return;
    app.change(s => {
      s.parked = s.parked.filter(x => x.id !== id);
      s.spends.push({ id: uid('x'), date: toISO(today()), amount: p.amount, note: p.label });
    });
  },

  render() {
    /* Milestones are written down before any screen is drawn, so one reached
       on Today is kept whether or not Milestones is ever opened. A sum that
       will not add up must not take the page down with it. */
    try { if (latchMilestones(STATE)) save(STATE); } catch (e) {}

    let current = app.visibleScreens().filter(s => s.id === app.screen)[0];
    if (!current) current = app.visibleScreens()[0] || SCREENS[0];
    app.screen = current.id;
    try { renderNav(app); renderTopbar(app); } catch (e) { /* the page matters more */ }

    const root = document.getElementById('screen');
    root.innerHTML = '';
    const note = warningCard(app);
    if (note) root.appendChild(note);

    let view;
    try {
      view = current.view(app);
      /* Only a change of screen settles in. Logging a spend must not re-animate
         the whole page underneath the person's hand. */
      if (app.lastRendered !== current.id) view.classList.add('enter');
      app.lastRendered = current.id;
    } catch (e) {
      view = rescueCard(app, e);
    }
    root.appendChild(view);
    DRAWN_AT = clockMark();
  }
};

/* A tab left open does not redraw by itself. A thing parked yesterday could sit
   at "ready in 0 hours" past its two days, and a planner left open overnight
   still says today when it means yesterday. Redraw on the way back in, but only
   when the day or a waiting thing has actually moved on: a blind redraw would
   throw away a half typed box. */
let DRAWN_AT = { day: '', ready: -1 };
function clockMark() {
  return {
    day: toISO(today()),
    ready: (STATE.parked || []).filter(p => Date.now() - p.at >= PARK_HOURS * 3600000).length
  };
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const now = clockMark();
  if (now.day !== DRAWN_AT.day || now.ready !== DRAWN_AT.ready) app.render();
});

applyTheme(STATE.theme);
document.addEventListener('DOMContentLoaded', () => {
  applyFocus(STATE.focus);
  app.render();
  maybeWelcome(app);
});

/* Offline, when hosted. Opened as a local file there is no service worker and
   no way to register one, so this quietly does nothing and the app still runs. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* Today. It answers one question and gets out of the way. Bills, goals and
   everything else live on their own screens and stay out of this one. */
const todayScreen = {
  id: 'today',
  label: 'Today',
  view(app) {
    const s = app.state;
    const t = today();
    const b = safeToSpend(s, t);
    const C = CONFIG.copy;

    const hour = new Date().getHours();
    const part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

    return el('div.today', null, [
      el('div.m-top', null, [
        el('div', null, [
          el('div.m-date', { text: fmtLong(t) }),
          el('div.m-greet', { text: s.name ? part + ', ' + s.name : part }),
          /* How long the money has to last, said once at the top, so the
             answer to "how close is payday" never needs looking up. */
          el('div.m-until', { text: b.stretch === 1
            ? 'Payday is tomorrow.'
            : b.stretch + ' days until payday, ' + fmtDay(b.payday) + '.' })
        ]),
        el('button.m-dot', {
          type: 'button', 'aria-label': 'Settings',
          html: navIcon('settings'),
          onclick: () => app.go('settings')
        })
      ]),

      awayCard(app, b),
      startHere(app),
      oneThing(app, t, C),

      el('div.herorow', null, [hero(app, b, C), madeOf(app, b)]),

      statTiles(app, b),
      /* Rows of two, never two independent columns. Stacked columns let the
         cards in one side run at different heights from the other, so no
         horizontal edge ever lines up and the page reads as a collage. Each
         pair is its own row and both cards in it are the same height.
         Order is the day in order: the small things and the question you ask
         in a shop, then what is coming and what you logged, then the two
         charts that look back over the whole stretch. */
      pairOf(threeSmall(app), beforePayday(app, b)),
      pairOf(afford(app, b), loggedToday(app, b)),
      pairOf(wherePayWent(app, b), setAside(app, b)),
      dayByDay(app, b),
      footNote(app)
    ]);
  }
};

/* Half of these cards drop out on their own: nothing set aside yet, no pay in
   this stretch, nothing parked. A row left holding one card used to keep its
   half width and leave the other half of the screen blank, which read as a
   missing card rather than as nothing to show. On its own it takes the row. */
function pairOf(a, c) {
  const both = a && c;
  if (!a && !c) return null;
  return el('div.pair' + (both ? '' : '.solo'), null, [a, c].filter(Boolean));
}

/* The hero. Its own surface, its own status, and the stretch it covers, so the
   one number the product exists to answer is told apart from the nine cards
   under it without reading a word. */
function hero(app, b, C) {
  const dayOf = Math.min(b.period, Math.max(1, b.period - b.stretch + 1));
  return el('div.card.hero', null, [
    el('div.herotop', null, [
      capIcon('today', C.safeLabel),
      el('span.hstatus', { text: statusWord(b) })
    ]),
    bigNumber(app, b),
    subLine(app, b),
    el('div.bar', { title: 'How much of today\u2019s amount is spent' },
      el('i', { style: 'width:' + Math.round(b.used * 100) + '%' })),
    el('div.hmeta', null, [
      el('span', { text: 'Day ' + dayOf + ' of ' + b.period }),
      /* No denominator when there is nothing to divide: what is due before
         payday being more than the account holds makes today's share negative,
         and "of -$141.67 used today" is not a thing anybody can act on. The
         sentence above the bar has already said what it means. F009 took the
         same figure out of the panel below. */
      el('span', { text: b.left < 0 ? app.money(b.spentToday) + ' used today'
        : app.money(b.spentToday) + ' of ' + app.money(b.allowance) + ' used today' })
    ]),
    quickAdd(app, b)
  ]);
}

/* Four states, and not one of them tells anybody off. "Over" is a fact about
   an amount, not a verdict about a person. */
function statusWord(b) {
  if (b.left < 0) return 'Nothing spare yet';
  if (b.over > 0) return 'Today\u2019s amount used';
  if (b.used >= 0.8) return 'Most of today used';
  return 'On track';
}

/* Competitor 3 puts the arithmetic on the page and leaves it there. It is the
   cheapest thing on the board and the most valuable: a number you cannot check
   is a number you stop believing, and then you stop opening the app. */
function madeOf(app, b) {
  const w = b.working;
  const bills = round2(w.billsOut + w.heldOut);
  const aside = round2(w.potsOut + w.goalPotsOut + w.goalsOut);
  /* The balance and what has gone out of it since are one line, not two. As
     two they read as a double count, because anything logged today appears
     again further down, where it comes off today's share. */
  /* Today's share is worked out from the pot as it stood this morning: divide
     what is left AFTER today's spending and then take today's spending off the
     share again, and it is counted twice. So this table has to start from the
     morning too, or the lines do not add up when a buyer checks them by hand. */
  const morning = b.spentToday > 0;
  const startPot = round2(b.left + b.spentToday);
  const days = b.stretch + ' ' + (b.stretch === 1 ? 'day' : 'days');
  const opening = morning ? 'In your main account this morning' : 'In your main account now';

  /* Everything that comes off the balance before it is shared out. A buyer
     with no bills and no goals yet has none of them, and then the opening
     balance and "Left for 14 days" were the same figure on two rows running,
     which reads as a mistake in the sum. With nothing in between there is
     only one thing to say, so it is said once. */
  const middle = [];
  if (w.incomeIn > 0) middle.push(['Coming in before payday', w.incomeIn, '']);
  if (bills > 0) middle.push(['Bills before payday', -bills, '']);
  if (aside > 0) middle.push(['Set aside for ' + asideParts(w).forWhat, -aside, '']);

  const rows = middle.length
    ? [[opening, round2(w.balance - w.spentSince + b.spentToday), '']].concat(middle,
        [[(morning ? 'Left this morning for ' : 'Left for ') + days, startPot, 'strong']])
    : [[opening + ', to last ' + days, startPot, 'strong']];
  /* With nothing logged yet, "Shared out, that is today's amount" and
     "Safe to spend today" are the same figure on two rows one under the other,
     which reads as a mistake in the sum rather than as a step in it. The
     sharing out is still shown the moment it stops being the final answer, and
     the full chain is always in the modal. */
  /* Nothing to share out. When what is due before payday is more than the
     account holds, sharing that shortfall over the days left prints a daily
     amount nobody can act on, and the sentence under the hero has already said
     what it means in words. The chain ends at the shortfall itself. */
  /* It ended one row too early. The last row is the MORNING figure, and with
     something logged today that is not the shortfall the hero names: the two
     sat $12.50 apart under one caption, with today's spending on no row at all,
     so the chain could not be checked by hand. It carries on to the hero's own
     figure now. Positive, with no minus, because the words already say it,
     which is how F004 settled the same question for "Past today's amount by". */
  if (b.left < 0) {
    if (b.spentToday > 0) {
      rows.push(['Logged today', -b.spentToday, '']);
      rows.push(['More than the account holds by', -b.left, 'total']);
    } else {
      rows[rows.length - 1][2] = 'total';
    }
  } else {
    if (b.spentToday > 0) {
      rows.push(['Shared out, that is today\u2019s amount', b.allowance, 'strong']);
      rows.push(['Logged today', -b.spentToday, '']);
    }
    /* The words already say "past", so a minus on the figure as well reads as a
       double negative: the sentence under the hero says "$50.00 past it" and
       this row said "-$50.00" for the same money. */
    rows.push([b.over > 0 ? 'Past today\u2019s amount by' : 'Safe to spend today',
      b.over > 0 ? b.over : b.safe, 'total']);
  }

  return el('div.card.made', null, [
    /* The link sits on the caption row. On its own line under the table it
       cost thirty pixels of height for four words. */
    el('div.caprow', null, [
      capIcon('insights', 'How this number is made'),
      /* Opened in the modal rather than unfolded in place. Expanded, the
         detail ran to seventeen rows while the hero beside it stayed short,
         so the left column ended in a tall empty well and the page jumped
         under the hand that clicked. It is read once and dismissed. */
      el('button.linky', { type: 'button', text: 'See every line',
        onclick: () => openModal('How this number is made', () => workingRows(app, b),
          { focus: 'self' }) })
    ]),
    el('div.work', null, rows.map(([label, amount, kind]) =>
      el('div.wrow' + (kind ? '.' + kind : ''), null, [
        el('span.wnm', { text: label }),
        el('span.wamt', { text: app.money(amount, { plus: false }) })
      ])
    ))
  ]);
}

/* Every bill that belongs to this pay stretch, not just the ones still ahead.
   `working.billsOut` is built from today to payday, which is the right window
   for "how much is safe to spend between now and payday" and the wrong one for
   anything looking back over the stretch: a bill that went out on Tuesday was
   in neither the Bills tile nor the donut, so its money sat in "Not used yet"
   as though it were still in the account. Three of the four tiles count from
   the last payday, so the fourth has to as well. */
function billsThisStretch(app, b) {
  const w = billsForStretch(app.state, b.start, b.payday);
  return round2(w.due.reduce((t, x) => t + x.amount, 0) +
    w.held.reduce((t, x) => t + x.amount, 0));
}

/* Four shares rounded on their own do not add up to a hundred, and a part
   worth a few euros rounds to "0%", which reads as nothing at all beside an
   amount that is plainly not nothing. So anything under half a percent says so
   in words, and the largest part carries whatever the rounding drops. The
   largest part is the one nothing else on the page prints a share for, so the
   tiles and the donut still agree line for line. */
function shareLabels(values, total) {
  if (!(total > 0)) return values.map(() => '');
  const raw = values.map(v => Math.max(0, v) / total * 100);
  const pct = raw.map(r => Math.round(r));
  /* Only when the parts really are the whole of the total. The donut's four
     parts can come to more than one paycheck, because a pot built up over six
     months is held back out of a balance and not out of this pay. Moving the
     rounding onto the largest part then printed "25%" beside the very figure
     the Bills tile above it calls 74%, and a share of what came in that was
     neither its own share nor the ring's. */
  const whole = values.reduce((t, v) => t + Math.max(0, v), 0);
  if (Math.abs(whole - total) <= 1) {
    let big = 0;
    raw.forEach((r, i) => { if (r > raw[big]) big = i; });
    pct[big] += 100 - pct.reduce((t, n) => t + n, 0);
  }
  return raw.map((r, i) => (r > 0 && pct[i] <= 0) ? 'under 1%' : Math.max(0, pct[i]) + '%');
}

/* Name only what is actually in it. A bill contributes to "set aside" only
   when it comes round less often than the pay does, so for most people the
   whole amount is goal money and saying "for bills and goals" is just wrong.
   Returns the two halves and the words that fit them. */
function asideParts(w) {
  const bills = round2(w.potsOut);
  const goals = round2(w.goalPotsOut + w.goalsOut);
  const both = bills > 0 && goals > 0;
  return {
    bills: bills, goals: goals, total: round2(bills + goals),
    forWhat: both ? 'bills and goals' : (bills > 0 ? 'bills' : 'goals')
  };
}

function oneThing(app, t, C) {
  const o = app.state.oneThing || {};
  if (o.done && o.date === toISO(t)) return null;
  /* And done is done whether or not the button was pressed. The band asks for
     the day's spending; once that is written down it has been answered, and
     sitting there asking for it again, under a Start here step that has already
     ticked itself from the same state, reads as the app not noticing. */
  if (dayAnswered(app.state, t)) return null;
  return el('div.onething', null, [
    el('div', null, [
      el('div.lbl', { text: 'Right now, one thing only' }),
      el('div.txt', { text: C.oneThing })
    ]),
    el('button', {
      type: 'button', text: 'Done',
      onclick: () => app.change(s => { s.oneThing = { date: toISO(t), done: true }; })
    })
  ]);
}

/* The one loud color in the product, spent on this number and nothing else. */
let shownSafe = null;
/* Zero, not null: null means "first ever draw, do not animate", and the whole
   point here is that a planner somebody has just filled in counts up to their
   own figure rather than down from the example's. */
resetOnReplace(() => { shownSafe = 0; });

function figure(n, cur) {
  return Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: cur.decimals, maximumFractionDigits: cur.decimals
  });
}

function bigNumber(app, b) {
  const cur = app.cur;
  const text = document.createTextNode(figure(b.safe, cur));
  /* Krona and zloty go after the number at home, and putting them in front
     looks like a tourist wrote the app. */
  const sym = el('span' + (cur.after ? '.after' : ''), { text: cur.symbol });
  const node = el('div.big', null, cur.after ? [text, sym] : [sym, text]);

  /* Counting to the new figure shows that logging something moved it. Jumping
     straight there reads as a redraw, which is easy to miss. */
  const from = shownSafe;
  const to = b.safe;
  shownSafe = to;
  /* Hidden tab: nobody is watching it count, and frames are starved there, so
     the figure simply appears at its final value. */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches || document.hidden;
  if (from === null || still || Math.abs(to - from) < 0.005) return node;

  const start = performance.now();
  const settle = () => { if (text.parentNode) text.nodeValue = figure(to, cur); };
  const run = now => {
    /* Clamped at both ends: a frame timestamped before the start would send the
       figure the wrong way, which is worse than not animating at all. */
    const t = Math.max(0, Math.min(1, (now - start) / 420));
    const eased = 1 - Math.pow(1 - t, 3);
    text.nodeValue = figure(from + (to - from) * eased, cur);
    if (t < 1 && text.parentNode) requestAnimationFrame(run);
    else settle();
  };
  requestAnimationFrame(run);
  /* Frames stop in a background tab. The figure must still be right when the
     person comes back to it, so the end state does not depend on them. */
  setTimeout(settle, 460);
  return node;
}

/* Going over is a plain sentence. No red, nothing flashing, no telling off. */
function subLine(app, b) {
  /* Being short before a penny has been spent is not the same as overspending.
     Telling someone they have spent past today's amount when they have spent
     nothing is both wrong and exactly the thing that makes people shut the app. */
  if (b.left < 0) {
    return el('p.sub', { html:
      'What is due before payday is <b>' + app.money(-b.left) + '</b> more than the account holds. ' +
      'Nothing is safe to spend yet.' });
  }
  if (b.over > 0) {
    return el('p.sub', { html:
      'That is today’s amount spent, and <b>' + app.money(b.over) + '</b> past it. ' +
      'Tomorrow’s is <b>' + app.money(b.tomorrow) + '</b>.' });
  }
  return el('p.sub', { html:
    'of <b>' + app.money(b.left) + '</b> that has to last until payday, <b>' + fmtDay(b.payday) + '</b>.' });
}

function workingRows(app, b) {
  const w = b.working;
  const rows = [
    ['Your balance on ' + fmtDay(parseISO(w.balanceAsOf)), w.balance, false]
  ];
  w.pots.forEach(x => rows.push([x.name + ', already set aside', -x.amount, false]));
  w.goalPots.forEach(x => rows.push([x.name + ', already set aside', -x.amount, false]));
  w.incomes.forEach(x => rows.push([x.name + ', landing ' + fmtDay(x.on), x.amount, false]));
  const earlier = round2(w.spentSince - b.spentToday);
  if (earlier > 0) rows.push([b.spentToday > 0 ? 'Spent since that date, before today'
    : 'Spent since that date', -earlier, false]);
  w.due.forEach(x => rows.push([x.name +
    (x.overdue ? ', overdue since ' : ', due ') + fmtDay(x.on), -x.amount, false]));
  w.held.forEach(x => rows.push([x.name + ', set aside for ' + fmtDay(x.on), -x.amount, false]));
  w.goals.forEach(x => rows.push([x.name + ', set aside this payday', -x.amount, false]));
  rows.push([(b.spentToday > 0 ? 'Left this morning for ' : 'Left for ') +
    b.stretch + ' ' + (b.stretch === 1 ? 'day' : 'days'),
    round2(b.left + b.spentToday), true]);
  /* Same as the panel this modal expands: a shortfall cannot be shared out. */
  if (b.left >= 0) {
    rows.push(['Shared out, that is today’s amount', b.allowance, true]);
    if (b.spentToday > 0) {
      rows.push(['Logged today', -b.spentToday, false]);
      rows.push([b.over > 0 ? 'Past today’s amount by' : 'Safe to spend now',
        b.over > 0 ? b.over : b.safe, true]);
    }
  } else if (b.spentToday > 0) {
    /* And same as the panel: it must end on the figure the hero names, not on
       the morning one. */
    rows.push(['Logged today', -b.spentToday, false]);
    rows.push(['More than the account holds by', -b.left, true]);
  }

  return el('div.work', null, rows.map(([label, amount, strong]) =>
    el('div.wrow' + (strong ? '.strong' : ''), null, [
      el('span.wnm', { text: label }),
      el('span.wamt', { text: app.money(amount, { plus: false }) })
    ])
  ));
}

function quickAdd(app, b) {
  const left = app.capLeft();
  if (app.capped()) {
    return el('div.capped', null, [
      el('p', { text: CONFIG.copy.cappedTitle }),
      el('p.sub', { text: CONFIG.copy.cappedBody }),
      el('button.btn', { type: 'button', text: 'Download a backup', onclick: () => exportBackup(app.state) })
    ]);
  }

  const wrap = el('div.tags');
  app.quickAdd().forEach(q => {
    wrap.appendChild(el('button.tag', {
      type: 'button', text: '+ ' + q.label + ' ' + app.money(q.amount),
      onclick: () => app.logSpend(q.amount, q.label)
    }));
  });

  const field = el('input.exact', {
    type: 'text', inputmode: 'decimal', placeholder: money(0, app.cur),
    'aria-label': 'Amount spent'
  });
  const note = el('input.exactnote', { type: 'text', placeholder: 'What for (optional)', 'aria-label': 'What for' });
  /* Its own line in the flex row, so it never squeezes the two boxes. */
  const bad = el('p.sub.warn', { hidden: true, style: 'flex-basis:100%;margin:0' });
  field.addEventListener('input', () => {
    const parsed = parseAmount(field.value);
    bad.textContent = amountNote(parsed);
    bad.hidden = parsed.ok;
    field.classList.toggle('bad', !parsed.ok);
  });
  const panel = el('div.exactrow', { hidden: true }, [
    field, note,
    el('button.btn.primary', { type: 'button', text: 'Log it', onclick: () => {
      const n = parseAmount(field.value).value;
      if (n > 0) { app.logSpend(n, note.value.trim()); field.value = ''; note.value = ''; }
    } }),
    bad
  ]);

  wrap.appendChild(el('button.tag', {
    type: 'button', text: '+ Exact',
    onclick: () => { panel.hidden = !panel.hidden; if (!panel.hidden) field.focus(); }
  }));

  /* The honest answer on a good day, and it should be the fastest one to give. */
  const quiet = app.saidNothingToday();
  wrap.appendChild(el('button.tag' + (quiet ? '.on' : ''), {
    type: 'button', text: quiet ? '✓ Nothing today' : 'Nothing today',
    onclick: () => app.noSpendToday()
  }));

  const foot = [];
  if (left != null && left <= 10) foot.push(el('span.foot', { text: left + ' more to log in the demo' }));

  return el('div.qa', null, [wrap, panel, foot.length ? el('div.footrow', null, foot) : null]);
}

function beforePayday(app, b) {
  const w = b.working;
  const items = w.due.map(x => ({ on: x.on, amount: x.amount,
      name: x.name + (x.overdue ? ', overdue'
        : x.saved > 0 ? ', ' + app.money(x.saved) + ' already saved' : '') }))
    .concat(w.held.map(x => ({ on: x.on, name: x.name + ', set aside', amount: x.amount, held: true })));

  /* The panel beside this one takes a single figure off the balance for all of
     it, and this card listed the parts without ever naming that figure, so
     checking one against the other meant adding the rows up by hand. */
  const total = round2(items.reduce((t, x) => t + x.amount, 0));
  /* A card headed "Before payday" with a chip reading 15 FEB on it. The money
     is right, and it really does come off now, but the row carries two numbers
     belonging to two different things: the chip is the day the whole bill
     lands, the amount is this stretch's share of it. Said once, under the
     rows, and only when there is such a row to explain. */
  const anyHeld = items.some(x => x.held);

  return el('div.card', null, [
    capIcon('bills', 'Before payday'),
    items.length
      ? el('div.rows', null, items.map(x => el('div.row', null, [
          el('span.chip', { html: String(x.on.getDate()).padStart(2, '0') + '<br>' +
            x.on.toLocaleDateString(undefined, { month: 'short' }).toUpperCase() }),
          el('span.nm', { text: x.name }),
          el('span.amt', { text: app.money(x.amount) })
        ])))
      : el('p.sub', { text: 'Nothing due between now and payday.' }),
    items.length > 1 ? el('div.footrow', null, el('span.foot', { text:
      app.money(total) + ' in total, and it is already out of your Safe to Spend number.' })) : null,
    anyHeld ? el('p.foot', { style: 'margin:6px 0 0', text:
      'A row that says "set aside" is this payday’s share of a bill landing on the ' +
      'date shown, not the whole bill.' }) : null
  ]);
}


/* The gap nobody on page one fills: the question is not asked at the end of the
   week, it is asked standing in a shop. No judgement, just what happens next. */

function afford(app, b) {
  const out = el('div.answer');
  const field = el('input.exact', { type: 'text', inputmode: 'decimal',
    placeholder: money(0, app.cur), 'aria-label': 'How much is it' });
  const what = el('input.exactnote', { type: 'text', placeholder: 'What is it', 'aria-label': 'What is it' });
  /* A button sitting straight in the card stretches to its full width, and a
     .btn is left aligned, so it read as a bar of text rather than a button.
     In a footrow it is the size of its own words, in the same green as the
     one on the Waitlist page. */
  const parkBtn = el('button.btn.primary.onenter', { type: 'button',
    text: 'Park it for two days', onclick: () => app.park(read(), what.value.trim()) });
  const park = el('div.footrow', { hidden: true }, parkBtn);

  function read() { return parseAmount(field.value).value; }

  function answer() {
    const parsed = parseAmount(field.value);
    const n = parsed.value;
    out.innerHTML = '';
    park.hidden = !(n > 0);

    /* Letters in the amount box used to leave this card blank, which reads as
       the app not working rather than as a typo. The Waitlist already says so;
       both boxes now say the same thing. */
    const bad = field.value.trim() !== '' && !parsed.ok;
    field.classList.toggle('bad', bad);
    if (bad) {
      out.appendChild(el('p.sub.warn', { text: amountNote(parsed) }));
      return;
    }
    if (!(n > 0)) return;

    out.appendChild(el('p.sub', { html: affordLine(app, b, n) }));
  }
  field.addEventListener('input', answer);

  return el('div.card', null, [
    capIcon('wait-list', 'Thinking about buying something?'),
    /* What it is, then what it costs. You know the thing before you know the
       price, and the answer underneath only appears once the amount is in. */
    el('div.exactrow', { style: 'margin-top:12px' }, [what, field]),
    out, park,
    parkedList(app)
  ]);
}

function parkedList(app) {
  const items = app.state.parked || [];
  if (!items.length) return null;
  const rows = items.slice().sort((a, c) => a.at - c.at).map(p => {
    const hours = Math.floor((Date.now() - p.at) / 3600000);
    const leftHours = PARK_HOURS - hours;
    const ready = leftHours <= 0;
    /* Not "Waiting 30 more hours". The button that parked it promised two
       days, so a countdown in hours asked the buyer to convert between the
       two before they knew when to come back. Same words on the Waitlist. */
    const msg = el('p.sub.warn');
    return el('div.parked', null, [
      el('div.parkedtop', null, [
        el('span.nm', { text: p.label }),
        el('span.amt', { text: app.money(p.amount) })
      ]),
      ready ? msg : null,
      ready
        ? el('div.footrow', null, [
            el('button.btn.primary', { type: 'button', text: 'Buy it', onclick: () => {
              if (app.capped()) { msg.textContent = CONFIG.copy.cappedTitle; return; }
              app.buyParked(p.id);
            } }),
            el('button.linky', { type: 'button', text: 'Let it go', onclick: () => app.unpark(p.id) })
          ])
        : el('span.foot', { text: 'Ready to decide ' + readyWhen(p.at) })
    ]);
  });
  return el('div.parkedwrap', null, [capIcon('wait-list', 'Parked')].concat(rows));
}

/* The shape of the whole pay period, which the four tiles give as numbers but
   not as a proportion. The middle holds what came in, and naming a part puts
   that part's own amount there instead. Every part is written out beside it,
   so the picture is a convenience and never the only way to read it. */
function wherePayWent(app, b) {
  const s = app.state;
  const t = today();
  const w = b.working;
  const spent = round2(s.spends
    .filter(x => parseISO(x.date) >= b.start && parseISO(x.date) <= t)
    .reduce((n, x) => n + x.amount, 0));
  const landed = round2((s.incomes || []).reduce((n, i) =>
    n + occurrences(i.date, i.freq || null, b.start, addDays(t, 1)).length * i.amount, 0));
  const cameIn = round2(s.pay.amount + landed);
  if (cameIn <= 0) return null;

  const bills = billsThisStretch(app, b);
  const aside = round2(w.potsOut + w.goalPotsOut + w.goalsOut);
  const free = round2(Math.max(0, cameIn - bills - aside - spent));

  const names = ['Bills', 'Set aside for ' + asideParts(w).forWhat, 'Spent', 'Not used yet'];
  const values = [bills, aside, spent, free];
  const shares = shareLabels(values, cameIn);
  const parts = names.map((name, i) => ({ name: name, value: values[i], share: shares[i] }));

  return el('div.card', null, [
    helpCap('Where the pay went', 'Of ' + app.money(cameIn) +
      ' that came in since your last payday. Point at a part to read it.', 'insights'),
    donut(app, parts, {
      middle: app.money(cameIn),
      middleLabel: 'came in',
      label: parts.map(x => x.name + ' ' + app.money(x.value) + ', ' + x.share).join('. ')
    }),
    /* "Not used yet" is worked out from the pay, while the panel above is worked
       out from the balance, so the two disagree whenever money sits in another
       account or went before the balance was last set. Said plainly here rather
       than left for a buyer to spot and distrust. */
    el('p.sub', { style: 'margin-top:11px',
      text: 'This is what came in, not what is in your main account now.' })
  ]);
}

/* Both cards in a row are the same height, so a busy day used to stretch this
   one down the page and leave the card beside it a tall empty well. Five is
   enough to see what you just logged; the rest are one tap away on the Log. */
const LOGGED_TODAY_MAX = 5;

function loggedToday(app, b) {
  const iso = toISO(today());
  const all = app.state.spends.filter(s => s.date === iso).slice().reverse();
  const items = all.slice(0, LOGGED_TODAY_MAX);
  const hidden = all.length - items.length;
  return el('div.card', null, [
    el('div.caprow', null, [
      capIcon('log', 'Logged today'),
      /* A listing can ship without the Log page, and a link to a page that is
         not there lands the buyer somewhere they did not ask for. */
      hidden > 0 && app.visibleScreens().some(x => x.id === 'log')
        ? el('button.linky', { type: 'button', text: 'See every line',
            onclick: () => app.go('log') })
        : null
    ]),
    items.length
      ? el('div.rows', null, items.map(x => el('div.row', null, [
          el('span.nm', { text: spendName(app.state, x).title }),
          el('span.amt', { text: app.money(x.amount) }),
          el('button.linky.rowx', { type: 'button', text: 'Remove',
            'aria-label': 'Remove ' + spendName(app.state, x).title, onclick: () => app.removeSpend(x.id) })
        ])))
      : el('p.sub', { text: app.saidNothingToday()
          ? 'You said nothing went out today. Good day.'
          : 'Nothing logged yet today. Use the buttons above to add something.' }),
    items.length ? el('div.footrow', null, el('span.foot', { text: hidden > 0
      ? app.money(b.spentToday) + ' in total, across ' + all.length + ' lines'
      : app.money(b.spentToday) + ' in total' })) : null
  ]);
}

/* Milestones only ever count up. There is nothing here that can break. */
function setAside(app, b) {
  const pots = b.working.pots.map(x => ({ name: x.name, amount: x.amount }))
    .concat(b.working.goalPots);
  const total = round2(pots.reduce((t, x) => t + x.amount, 0));
  if (!pots.length) return null;
  return el('div.card', null, [
    capIcon('savings', 'Set aside so far'),
    el('div.rows', null, pots.map(x => el('div.row', null, [
      el('span.nm', { text: x.name }),
      el('span.amt', { text: app.money(x.amount) })
    ]))),
    el('p.sub', { style: 'margin-top:11px', html: '<b>' + app.money(total) +
      '</b> of your balance is already set aside, so the Today page never offers it to you.' })
  ]);
}


/* The shape of the stretch so far, on the screen people actually open. Each bar
   is a day, today is the amber one, and the dashed line is what a day has been
   averaging. One series, so there is nothing to decode. */
function dayByDay(app, b) {
  const s = app.state;
  const start = b.start;
  const days = [];
  for (let i = 0; i < b.period; i++) {
    const d = addDays(start, i);
    const iso = toISO(d);
    days.push({
      iso: iso,
      value: round2(s.spends.filter(x => x.date === iso).reduce((n, x) => n + x.amount, 0)),
      highlight: iso === toISO(today()),
      short: String(d.getDate()),
      full: fmtDay(d)
    });
  }
  /* Set below, once the window the average uses is known. */
  /* Safe to Spend only counts spending logged since the balance was last set:
     anything before that is already inside the balance. Averaging the whole
     stretch and then comparing it to the allowance measures the two halves of
     the sentence on different days, so the average starts where the allowance
     does. Normally that is the payday and nothing changes. */
  const setOn = b.working.balanceAsOf ? parseISO(b.working.balanceAsOf) : start;
  const from = setOn > start ? setOn : start;
  const counted = days.filter(d => d.iso >= toISO(from));
  const gone = round2(counted.reduce((n, d) => n + d.value, 0));
  const sofar = Math.max(1, daysBetween(from, today()) + 1);
  const perDay = round2(gone / sofar);
  const part = toISO(from) !== toISO(start);
  /* Every bar is filled. The days the average leaves out are named in the
     sentence under the chart and again on the bar itself when you point at
     it, which is enough: drawing them differently was a third thing to learn
     before the chart could be read at all. */
  if (part) days.forEach(d => { d.faint = d.iso < toISO(from); });

  return el('div.card', null, [
    helpCap('Spending, day by day', 'Each bar is one day since your last payday.' +
      amberNote(days), 'month'),
    el('p.sub', { style: 'margin:8px 0 0', html:
      'You are averaging <b>' + app.money(perDay) + '</b> a day, against <b>' +
      app.money(b.allowance) + '</b> a day to stay on track.' }),
    !part ? null : el('p.sub', { style: 'margin:5px 0 0', text:
      'Counted from ' + fmtDay(from) + ', the day you last checked your balance. ' +
      'Anything before that is already inside it.' }),
    dayBars(app, days),
    el('div.footrow', null,
      el('button.linky', { type: 'button', text: 'See where it went', onclick: () => app.go('insights') }))
  ]);
}

/* Five steps, and then it takes itself away. Competitors all open on one, and
   it is the difference between a figure of zero and a figure that means something. */
function startHere(app) {
  const s = app.state;
  const done = s.started || {};
  const steps = [
    { k: 'pay', name: 'Add your pay', line: 'How much, and when the next one lands', go: 'money-in',
      got: s.pay.amount > 0 },
    { k: 'balance', name: 'Put in what is in your main account', line: 'The one your pay lands in', go: 'settings',
      got: everydayBalance(s) > 0 },
    { k: 'bills', name: 'Add your bills', line: 'Rent, phone, anything that goes out by itself', go: 'bills',
      got: s.bills.length > 0 },
    { k: 'goal', name: 'Set one goal', line: 'Something to put money by for', go: 'goals',
      got: s.goals.length > 0 },
    { k: 'spend', name: 'Log one spend', line: 'Anything you bought today', go: 'log',
      got: s.spends.length > 0 }
  ];
  const left = steps.filter(x => !x.got);
  if (s.example || s.hideStart || !left.length) return null;

  const next = left[0];
  return el('div.card', null, [
    el('div.m-top', null, [
      el('div', null, [
        capIcon('guide', 'Start here'),
        el('p.sub', { style: 'margin-top:4px', text:
          (steps.length - left.length) + ' of ' + steps.length + ' done. One step at a time.' })
      ]),
      el('button.linky', { type: 'button', text: 'Hide this',
        onclick: () => app.change(st => { st.hideStart = true; }) })
    ]),
    el('div.bar', { style: 'margin-top:10px' },
      el('i', { style: 'width:' + Math.round((steps.length - left.length) / steps.length * 100) + '%' })),
    el('div.startlist', null, steps.map(x => el('div.startrow', null, [
      el('span.tick' + (x.got ? '.on' : ''), { text: x.got ? '\u2713' : '' }),
      el('span.nm', null, [
        el('span.nmline' + (x.got ? '' : '.pending'), { text: x.name }),
        el('span.foot', { text: x.line })
      ]),
      x === next ? el('button.btn.primary', { type: 'button', text: 'Do it',
        onclick: () => app.go(x.go) }) : null
    ])))
  ]);
}

/* The reassurance every competitor puts at the bottom, because it is the first

/* Three small things, each a few seconds. Competitor 1's best idea after the
   one-thing banner, and the opposite of a to-do list: it is rebuilt daily. */
function threeSmall(app) {
